/* =====================================================================
   MULTI-TELEFONO: stanza con QR, benvenuto per gli amici, Scarabocchi
   L'host (il tuo telefono) tiene lo stato della partita; gli altri
   telefoni si collegano al tuo con PeerJS (WebRTC, nessun account).
   Con ?local nell'indirizzo usa BroadcastChannel: utile per provare
   più schede sullo stesso computer.
   ===================================================================== */
const PEER_PREFIX = "afterdinner-v1-";
const QS = new URLSearchParams(location.search);
const USE_LOCAL = QS.has("local");
const NET = { role:null, code:null, myId:null, status:"idle", peer:null, conn:null, conns:new Map(), bc:null, name:"", info:null, turnT:null, outbox:[], lostAt:0 };
const GRACE = USE_LOCAL && QS.has("fast") ? 3000 : 60000;      // tempo per ricollegarsi prima che l'host possa togliere un giocatore
const ROOM_KEY = "ad.room", ROOM_TTL = 3*3600e3;
let M = null;          // stato della partita (sull'host è quello vero, sugli altri è una copia)
let MD = {};           // disegni del turno {idGiocatore: immagine}
let mpTick = null, mpEndsLocal = 0, mpKey = "";

function myPid(){
  if(USE_LOCAL){ try{ let id = sessionStorage.getItem("ad.pid"); if(!id){ id = "u"+Math.random().toString(36).slice(2,10); sessionStorage.setItem("ad.pid", id); } return id; }catch(e){} } // in prova ogni scheda è un giocatore diverso
  try{ let id = localStorage.getItem("ad.pid"); if(!id){ id = "u"+Math.random().toString(36).slice(2,10); localStorage.setItem("ad.pid", id); } return id; }
  catch(e){ return NET._pid || (NET._pid = "u"+Math.random().toString(36).slice(2,10)); }
}
function savedName(){ try{ return localStorage.getItem("ad.name") || ""; }catch(e){ return ""; } }
function storeName(n){ try{ localStorage.setItem("ad.name", n); }catch(e){} }
function loadScript(src, globalName){
  if(window[globalName]) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); });
}
const newCode = () => Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
const joinUrl = () => location.origin + location.pathname + "?room=" + NET.code + (USE_LOCAL ? "&local" : "");
const mpPlayer = id => M && M.players.find(p => p.id === id);
const guesserId = () => M && M.order[M.turn];
const amGuesser = () => guesserId() === NET.myId;
const cleanName = n => String(n||"").trim().slice(0,18) || "Giocatore";

/* ---------- trasporto ---------- */
async function hostOpen(){
  if(USE_LOCAL){
    NET.bc = new BroadcastChannel("ad-" + NET.code);
    NET.bc.onmessage = e => { const d = e.data; if(d.to === "host") hostReceive(d.from, d.msg); };
    NET.sendTo = (id, msg) => NET.bc.postMessage({from:"host", to:id, msg});
    NET.bc.postMessage({from:"host", to:"*", msg:{t:"rehello"}}); // dopo una riapertura chi era dentro si ripresenta
    return;
  }
  await loadScript("lib/peerjs.min.js", "Peer");
  await new Promise((res, rej) => {
    const peer = new Peer(PEER_PREFIX + NET.code); NET.peer = peer;
    peer.on("open", res);
    peer.on("error", e => { if(NET.status !== "open") rej(e); else console.warn(e); });
    peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
    peer.on("connection", conn => {
      conn.on("data", msg => { if(msg && msg.pid){ conn._pid = msg.pid; NET.conns.set(msg.pid, conn); } hostReceive(conn._pid, msg); });
      conn.on("close", () => { if(conn._pid && NET.conns.get(conn._pid) === conn){ NET.conns.delete(conn._pid); hostReceive(conn._pid, {t:"bye"}); } });
    });
  });
  NET.sendTo = (id, msg) => { const c = NET.conns.get(id); if(c && c.open) try{ c.send(msg); }catch(e){} };
}
async function guestOpen(){
  NET.toHost = msg => {
    msg = {...msg, pid:NET.myId};
    if(USE_LOCAL){ NET.bc.postMessage({from:NET.myId, to:"host", msg}); return; }
    if(NET.conn && NET.conn.open){ try{ NET.conn.send(msg); return; }catch(e){} }
    if(!/^(peek|hello|bye)$/.test(msg.t)) NET.outbox.push(msg); // lo mando appena torna la connessione
  };
  if(USE_LOCAL){
    NET.bc = new BroadcastChannel("ad-" + NET.code);
    NET.bc.onmessage = e => { const d = e.data; if(d.to === NET.myId || d.to === "*") guestReceive(d.msg); };
    NET.status = "open"; NET.toHost({t:"peek"}); if(NET.name) NET.toHost({t:"hello", name:NET.name}); return;
  }
  await loadScript("lib/peerjs.min.js", "Peer");
  guestConnect();
}
function guestConnect(){
  clearTimeout(NET.retryT);
  if(!NET.peer || NET.peer.destroyed){
    const peer = new Peer(); NET.peer = peer;
    peer.on("error", e => { if(NET.peer !== peer) return; guestLost(e.type === "peer-unavailable"); });
    peer.on("disconnected", () => { try{ !peer.destroyed && peer.reconnect(); }catch(e){} });
  }
  const peer = NET.peer;
  const dial = () => {
    try{ NET.conn && NET.conn.close(); }catch(e){}
    const conn = peer.connect(PEER_PREFIX + NET.code, {reliable:true}); NET.conn = conn;
    conn.on("open", () => {
      if(NET.conn !== conn) return;
      NET.status = "open"; NET.lostAt = 0; NET.wasIn = NET.wasIn || !!NET.name;
      NET.toHost({t:"peek"}); if(NET.name) NET.toHost({t:"hello", name:NET.name});
      NET.outbox.splice(0).forEach(m => { try{ conn.send(m); }catch(e){} });
      M ? (mpNotes(), mpRender()) : mpRender(true);
    });
    conn.on("data", guestReceive);
    conn.on("close", () => { if(NET.conn === conn) guestLost(false); });
  };
  if(peer.open) dial(); else peer.once("open", dial);
}
/* connessione persa: riprovo ogni 3 secondi per 5 minuti (l'host potrebbe aver chiuso e riaperto l'app) */
function guestLost(noroom){
  if(NET.role !== "guest" || ["closed","full"].includes(NET.status)) return;
  if(noroom && !M && !NET.wasIn){ NET.status = "noroom"; mpRender(true); return; } // QR vecchio: la stanza non c'è
  if(!NET.lostAt) NET.lostAt = Date.now();
  if(Date.now() - NET.lostAt > 5*60e3){ NET.status = "lost"; mpNotes(); mpRender(true); return; }
  NET.status = "reconnecting";
  M ? mpNotes() : mpRender(true);
  clearTimeout(NET.retryT);
  NET.retryT = setTimeout(guestConnect, 3000);
}
function mpClose(){
  clearTimeout(NET.turnT); clearTimeout(NET.retryT); clearInterval(mpTick); mpTick = null;
  try{ NET.peer && NET.peer.destroy(); }catch(e){}
  try{ NET.bc && NET.bc.close(); }catch(e){}
  Object.assign(NET, {role:null, code:null, status:"idle", peer:null, conn:null, conns:new Map(), bc:null, info:null, outbox:[], lostAt:0});
  M = null; MD = {}; releaseWake(); mpNotes();
}
/* l'host chiude davvero la stanza: avvisa tutti e cancella la partita salvata */
function mpEndRoom(){
  if(NET.role === "host"){
    mpBroadcast({t:"closed"}); roomClear();
    const peer = NET.peer, bc = NET.bc; NET.peer = null; NET.bc = null;
    setTimeout(() => { try{ peer && peer.destroy(); }catch(e){} try{ bc && bc.close(); }catch(e){} }, 500);
  }
  mpClose();
}
/* partita salvata sul telefono dell'host, per riprenderla se l'app si chiude */
function roomSave(){
  if(NET.role !== "host" || !M) return;
  if(M.phase === "final"){ roomClear(); return; }
  const base = {code:NET.code, M, at:Date.now(), deck:NET.deck || null, deckLevel:NET.deckLevel || null};
  try{ localStorage.setItem(ROOM_KEY, JSON.stringify({...base, MD})); }
  catch(e){ try{ localStorage.setItem(ROOM_KEY, JSON.stringify(base)); }catch(_){} }
}
function roomLoad(){ try{ const r = JSON.parse(localStorage.getItem(ROOM_KEY) || "null"); return r && r.M && Date.now() - r.at < ROOM_TTL && r.M.phase !== "final" ? r : null; }catch(e){ return null; } }
function roomClear(){ try{ localStorage.removeItem(ROOM_KEY); }catch(e){} }
/* un'azione del giocatore: sull'host va diretta, sugli altri telefoni parte verso l'host */
function act(msg){ if(NET.role === "host") hostReceive(NET.myId, {...msg, pid:NET.myId}); else NET.toHost(msg); }

/* ---------- host: regole e stato ---------- */
function mpBroadcast(msg){ if(!M) return; M.players.forEach(p => { if(p.id !== NET.myId) NET.sendTo(p.id, msg); }); }
function recRounds(){ const n = Math.max(M.players.filter(p => p.on).length, 3), est = r => n * r * (M.seconds + 30) / 60; return [3,2,1].find(r => est(r) <= 25) || 1; }
function publish(){
  if(M.phase === "result") armAutoFinal(); else { clearTimeout(NET.autoT); M.autoAt = null; }
  if(M.phase === "lobby" && !M.roundsManual) M.rounds = recRounds(); // finché l'host non sceglie, uso i giri consigliati
  M.left = M.phase === "turn" ? (M.paused != null ? M.paused : Math.max(0, M.endsAt - Date.now())) : null;
  mpBroadcast({t:"state", s:M});
  roomSave();
  onState(M);
}
/* risposte: maiuscole, accenti, articoli e un piccolo refuso non contano */
const normWord = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[’`]/g, "'").replace(/^\s*(il|lo|la|i|gli|le|un|uno|una)\s+/, "").replace(/^\s*(l|un|gl)'\s*/, "")
  .replace(/[^a-z0-9]+/g, "");
function lev(a, b){
  const d = Array.from({length:b.length + 1}, (_, i) => i);
  for(let i = 1; i <= a.length; i++){ let prev = d[0]; d[0] = i;
    for(let j = 1; j <= b.length; j++){ const t = d[j]; d[j] = Math.min(d[j] + 1, d[j-1] + 1, prev + (a[i-1] === b[j-1] ? 0 : 1)); prev = t; } }
  return d[b.length];
}
function guessOk(text, word){
  const a = normWord(text), b = normWord(word);
  if(!a) return false; if(a === b) return true;
  const dist = lev(a, b);
  return b.length >= 9 ? dist <= 2 : b.length >= 5 ? dist <= 1 : false;
}
function armTurnTimer(){
  clearTimeout(NET.turnT);
  if(!M || M.phase !== "turn" || M.paused != null) return;
  NET.turnT = setTimeout(() => { if(M && M.phase === "turn"){ toReveal(); publish(); } }, Math.max(0, M.endsAt - Date.now()) + 300);
}
function armAutoFinal(){
  clearTimeout(NET.autoT);
  if(NET.role !== "host" || !M || M.phase !== "result" || peekNext()) return;
  if(!M.autoAt) M.autoAt = Date.now() + 12000;
  NET.autoT = setTimeout(() => { if(M && M.phase === "result" && !peekNext()){ M.autoAt = null; M.turn++; toNextTurn(); publish(); } }, Math.max(0, M.autoAt - Date.now()));
}
function mpEndTurn(o){ clearTimeout(NET.turnT); M.paused = null; M.phase = "result"; M.last = {word:M.word, by:guesserId(), ...o}; }
// chi perde la connessione durante il turno conta ancora: non si scopre prima della fine del tempo
const stillDrawing = () => M.players.filter(p => p.id !== guesserId() && !M.queue.includes(p.id) && (p.on || (p.offAt && M.startedAt && p.offAt >= M.startedAt)));
/* disegni finiti: chi indovina li ha visti tutti e nessuno sta più disegnando */
/* fine del tempo (o tutti hanno inviato): tocca a chi indovina, senza tempo */
function toReveal(){
  clearTimeout(NET.turnT); M.paused = null;
  if(!M.queue.length){ mpEndTurn({reason:"nodraw"}); return; }
  M.phase = "reveal"; M.revealed = false; M.view = 0;
}
/* disegni finiti: nessuno ha indovinato */
function turnCheck(){
  if(M.phase === "turn" && !stillDrawing().length){ toReveal(); return true; }
  if(M.phase === "reveal" && M.view >= M.queue.length){ mpEndTurn({reason:"none"}); return true; }
  return false;
}
function toNextTurn(){
  if(M.turn >= M.order.length){ M.turn = 0; M.round++; }
  M.phase = (M.order.length && M.round <= M.rounds && nextGuesser()) ? "ready" : "final";
  if(M.phase === "final") M.lineSeed = Math.floor(Math.random()*1000);
  MD = {}; M.queue = []; M.tries = [];
}
/* l'host toglie un giocatore che non è tornato: la partita continua senza di lui */
function mpRemove(id){
  if(!M || id === M.host || !mpPlayer(id)) return;
  const wasG = guesserId() === id && M.phase !== "lobby" && M.phase !== "final";
  M.players = M.players.filter(p => p.id !== id); delete M.scores[id];
  const oi = M.order.indexOf(id);
  if(oi >= 0){ M.order.splice(oi, 1); if(oi < M.turn) M.turn--; }
  if(wasG){ clearTimeout(NET.turnT); M.paused = null; toNextTurn(); }
  else if(M.phase === "turn" || M.phase === "reveal"){
    const qi = M.queue.indexOf(id);
    if(qi >= 0){ M.queue.splice(qi, 1); if(qi < M.view) M.view--; delete MD[id]; mpBroadcast({t:"drawings", imgs:MD}); }
    turnCheck();
  }
  publish();
}
function playerBack(p){
  p.on = true; delete p.offAt;
  if(M.phase === "turn" && M.paused != null && p.id === guesserId()){ M.endsAt = Date.now() + Math.max(M.paused, 10000); M.paused = null; armTurnTimer(); }
}

const LEVELS = [["beginner","Beginner"],["medium","Medium"],["extreme","Extreme"]];

const USED_KEY = "ad.usedWords", USED_GAMES = 5;
function usedLoad(){ try{ const u = JSON.parse(localStorage.getItem(USED_KEY) || "[]"); return Array.isArray(u) ? u : []; }catch(e){ return []; } }
function usedSave(u){ try{ localStorage.setItem(USED_KEY, JSON.stringify(u.slice(-USED_GAMES))); }catch(e){} }
function usedNewGame(){ const u = usedLoad(); u.push([]); usedSave(u); NET.deck = null; }
function drawWord(){
  const lvl = M.level || "medium";
  if(NET.deckLevel !== lvl){ NET.deck = null; NET.deckLevel = lvl; }
  const u = usedLoad(); if(!u.length) u.push([]);
  if(!NET.deck || !NET.deck.length){
    const recent = new Set(u.flat()), thisGame = new Set(u[u.length-1]);
    let pool = DRAW_WORDS[lvl].filter(w => !recent.has(w));
    if(pool.length < 8) pool = DRAW_WORDS[lvl].filter(w => !thisGame.has(w)); // finite le nuove, ripesco dalle più vecchie
    if(!pool.length) pool = DRAW_WORDS[lvl].slice();
    NET.deck = shuffle(pool.map(w => ({cat:LEVELS.find(l => l[0] === lvl)[1], word:w})));
  }
  const c = NET.deck.pop();
  u[u.length-1].push(c.word); usedSave(u);
  return c;
}
function nextGuesser(){
  for(let i = 0; i < M.order.length; i++){
    if(mpPlayer(guesserId()) && mpPlayer(guesserId()).on) return true;
    M.turn++; if(M.turn >= M.order.length){ M.turn = 0; M.round++; if(M.round > M.rounds) return false; }
  }
  return false;
}
function hostReceive(pid, msg){
  if(!M || !msg || !pid) return;
  const p = mpPlayer(pid);
  switch(msg.t){
    case "peek": NET.sendTo(pid, {t:"info", host:mpPlayer(M.host).name, game:"Scarabocchi"}); break;
    case "hello": {
      // stesso nome di un giocatore scollegato: è lui che rientra da un altro "telefono"
      const ghost = !p && M.players.find(x => !x.on && x.id !== M.host && x.name.toLowerCase() === cleanName(msg.name).toLowerCase());
      if(ghost){
        const old = ghost.id; ghost.id = pid; playerBack(ghost);
        M.scores[pid] = M.scores[old]; delete M.scores[old];
        M.order = M.order.map(x => x === old ? pid : x);
        if(M.queue) M.queue = M.queue.map(x => x === old ? pid : x);
        if(MD[old]){ MD[pid] = MD[old]; delete MD[old]; }
        publish(); break;
      }
      if(!p){
        if(M.players.length >= 16){ NET.sendTo(pid, {t:"full"}); return; }
        const used = new Set(M.players.map(x => x.color));
        let nm = cleanName(msg.name), k = 2; while(M.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = cleanName(msg.name).slice(0,15) + " " + k++;
        M.players.push({id:pid, name:nm, color:COLORS.find(c => !used.has(c)) || COLORS[M.players.length % COLORS.length], on:true});
        M.scores[pid] = 0;
        if(M.phase !== "lobby") M.order.push(pid);
        sfx("join"); buzz(20);
      } else { playerBack(p); if(msg.name) p.name = cleanName(msg.name); }
      publish();
      if(Object.keys(MD).length){ NET.sendTo(pid, {t:"drawings", imgs:{}}); Object.entries(MD).forEach(([id, img]) => NET.sendTo(pid, {t:"draw1", id, img})); }
      break;
    }
    case "bye":
      if(p && p.on){
        p.on = false; p.offAt = Date.now();
        if(M.phase === "turn" || M.phase === "reveal") turnCheck(); // il turno va avanti: chi si scollega può rientrare
        publish();
      } break;
    case "start":
      if(M.phase === "ready" && (pid === guesserId() || (pid === M.host && msg.skip))){
        if(msg.skip){ M.turn++; toNextTurn(); publish(); break; }
        const c = drawWord(); M.word = c.word; M.cat = c.cat; MD = {};
        M.queue = []; M.view = 0; M.tries = []; M.paused = null; M.revealed = false;
        M.phase = "turn"; M.endsAt = Date.now() + M.seconds*1000; M.startedAt = Date.now();
        armTurnTimer();
        mpBroadcast({t:"drawings", imgs:MD}); publish();
      } break;
    case "send": // un disegnatore ha finito e invia il disegno
      if((M.phase === "turn" || M.phase === "reveal") && pid !== guesserId() && !M.queue.includes(pid) && typeof msg.img === "string" && msg.img.length < 400000){
        MD[pid] = msg.img; M.queue.push(pid);
        if(M.sprint && M.queue.length === 1){ // Sprint: dal primo disegno restano 30 secondi a tutti
          if(M.paused != null) M.paused = Math.min(M.paused, 30000);
          else if(M.endsAt - Date.now() > 30000){ M.endsAt = Date.now() + 30000; armTurnTimer(); }
        }
        if(M.phase === "turn") turnCheck(); // se hanno inviato tutti si passa subito alle risposte
        mpBroadcast({t:"draw1", id:pid, img:msg.img}); onDrawings(); publish(); // solo il disegno nuovo: messaggi piccoli, niente cadute di connessione
      } break;
    case "advance": // chi indovina salta il disegno senza provare (non si torna indietro)
      if(M.phase === "reveal" && M.revealed && pid === guesserId() && M.view < M.queue.length && (msg.view == null || msg.view === M.view)){ M.view++; turnCheck(); publish(); } break;
    case "reveal":
      if(M.phase === "reveal" && pid === guesserId() && !M.revealed){ M.revealed = true; publish(); } break;
    case "guess": { // un solo tentativo scritto per disegno
      if(M.phase !== "reveal" || !M.revealed || pid !== guesserId() || M.view >= M.queue.length || msg.view !== M.view || typeof msg.text !== "string") break;
      const text = msg.text.trim().slice(0, 40), helper = M.queue[M.view]; if(!text) break;
      if(guessOk(text, M.word)){
        const pts = M.view === 0 ? 2 : 1, g = guesserId();
        M.scores[g] += pts; M.scores[helper] = (M.scores[helper] || 0) + pts;
        mpEndTurn({reason:"guess", helper, pts, pos:M.view, text});
      } else {
        M.tries.push({text, on:helper}); M.view++; turnCheck();
      }
      publish(); break;
    }
    case "pass":
      if((M.phase === "turn" || M.phase === "reveal") && pid === guesserId()){ mpEndTurn({reason:"pass"}); publish(); } break;
    case "next": {
      const nx = peekNext(), np = mpPlayer(nx);
      if(M.phase === "result" && (nx ? (pid === nx || (pid === M.host && !(np && np.on)) || pid === M.host && msg.force) : (pid === guesserId() || pid === M.host))){
        clearTimeout(NET.autoT); M.autoAt = null; M.turn++; toNextTurn(); publish();
      } break; }
  }
}

function guestReceive(msg){
  if(!msg) return;
  if(msg.t === "info"){ NET.info = msg; mpRender(true); }
  else if(msg.t === "full"){ NET.status = "full"; mpRender(true); }
  else if(msg.t === "state"){ M = msg.s; if(M.phase === "turn") mpEndsLocal = Date.now() + M.left; onState(M); }
  else if(msg.t === "drawings"){ MD = msg.imgs || {}; onDrawings(); }
  else if(msg.t === "draw1"){ MD[msg.id] = msg.img; onDrawings(); }
  else if(msg.t === "rehello"){ if(NET.name) NET.toHost({t:"hello", name:NET.name}); }
  else if(msg.t === "closed"){ NET.status = "closed"; clearTimeout(NET.retryT); try{ sessionStorage.removeItem("ad.joined"); }catch(_){} M = null; mpNotes(); mpRender(true); }
}
let prevPhase = null;
function onState(s){
  if(NET.role === "host") mpEndsLocal = s.endsAt;
  if(!wake) grabWake(); // schermo acceso per tutta la serata
  if(s.phase === "turn" && prevPhase !== "turn"){ NET.lastQ = 0; NET.lastTry = 0;
    NET.prevScores = {...s.scores}; NET.prevOrder = [...s.players].sort((a,b) => (s.scores[b.id]||0) - (s.scores[a.id]||0) || a.name.localeCompare(b.name)).map(p => p.id); }
  const showResult = s.phase === "result" && (prevPhase === "turn" || prevPhase === "reveal");
  if(s.phase === "reveal" && s.tries && s.tries.length > (NET.lastTry||0)){ const t = s.tries[s.tries.length-1]; NET.lastTry = s.tries.length; if(amGuesser()) showX(t.text); else showX(t.text, mpPlayer(s.order[s.turn])); }
  if(s.phase === "turn" && s.sprint && s.queue && s.queue.length === 1 && (NET.lastQ||0) === 0 && !amGuesser() && s.queue[0] !== NET.myId){ sprintAlert(); }
  if(s.phase === "turn" && s.queue && s.queue.length > (NET.lastQ||0)){ if(amGuesser()){ sfx("pop"); buzz(15); } NET.lastQ = s.queue.length; }
  if(s.phase === "reveal" && prevPhase === "turn"){ sfx("timeUp"); buzz([40,60,40]); }
  if(s.phase === "turn" && prevPhase !== "turn") sfx("go");
  if(s.phase === "result" && (prevPhase === "turn" || prevPhase === "reveal")){ if(s.last && s.last.reason === "guess") { confetti(); buzz([30,40,30]); sfx("correct"); } else if(s.last && s.last.reason === "pass") sfx("pass"); else sfx("timeUp"); }
  if(s.phase === "ready" && prevPhase !== "ready" && amGuesser()){ buzz([20,40,20]); sfx("join"); }
  const enteringFinal = s.phase === "final" && prevPhase !== "final";
  prevPhase = s.phase;
  if(enteringFinal) setTimeout(() => { sfx("drumroll", .9); setTimeout(() => sfx("fanfare"), 950); if(NET.finalLastAt) setTimeout(() => sfx("sad"), NET.finalLastAt * 1000 + 150); }, 300);
  if(NET.role === "guest" && mpPlayer(NET.myId)) NET.wasIn = true;
  mpNotes();
  mpRender();
  if(showResult) showOutcome(s); else if(s.phase === "result") animateLB();
}

/* avvisi in basso: connessione persa, pausa, giocatori da togliere */
function mpNotes(){
  let box = document.getElementById("mpnote");
  const items = [];
  if(S.screen === "mp" && NET.role && M){
    const host = mpPlayer(M.host);
    if(NET.role === "guest" && NET.status === "reconnecting") items.push(`<div class="note"><i class="spin" aria-hidden="true"></i><span>Collegamento con ${esc(host ? host.name : "l'host")} perso. Mi ricollego da solo, tu resta qui.</span></div>`);
    if(NET.role === "guest" && NET.status === "lost") items.push(`<div class="note"><span>Non riesco più a collegarmi con ${esc(host ? host.name : "l'host")}.</span><div class="nbtns"><button id="g-retry">Riprova</button></div></div>`);
    if(M.phase === "turn" && M.paused != null){ const g = mpPlayer(guesserId()); if(g && g.id !== NET.myId) items.push(`<div class="note"><span><b>Pausa.</b> ${esc(g.name)} è offline: il tempo riparte quando rientra.</span></div>`); }
    if(NET.role === "host" && M.phase !== "final"){
      M.players.filter(p => !p.on && p.id !== NET.myId && p.offAt && Date.now() - p.offAt > GRACE).forEach(p => {
        const min = Math.max(1, Math.round((Date.now() - p.offAt) / 60000));
        items.push(`<div class="note"><span><b>${esc(p.name)}</b> è offline da ${min} min. Togliere dalla partita?</span><div class="nbtns"><button data-wait="${p.id}">Aspetta</button><button class="k" data-kick="${p.id}">Togli</button></div></div>`);
      });
    }
  }
  if(!items.length){ box && box.remove(); return; }
  if(!box){
    box = document.createElement("div"); box.id = "mpnote"; box.setAttribute("aria-live","polite"); document.body.appendChild(box);
    box.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.kick) mpRemove(b.dataset.kick);
      else if(b.dataset.wait){ const p = mpPlayer(b.dataset.wait); if(p){ p.offAt = Date.now(); publish(); } }
      else if(b.id === "g-retry") location.reload();
    });
  }
  const html = items.join("");
  if(box.innerHTML !== html) box.innerHTML = html;
}

  return { undo: w('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
           eraser: w('<path d="m7 21-4-4a2 2 0 0 1 0-3L13 4a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-9 9"/><path d="M7 21h14M9 10l6 6"/>'),
           trash: w('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
           fit: w('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>') + "Intera" }; })();
let BOARD = null;
function boardInit(){
  const cv = $("#board"); if(!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.lineCap = "round"; g.lineJoin = "round";
  const bkey = NET.code + "|" + mpKey; let saved = null;
  if(!BOARD || BOARD.key !== mpKey){ try{ const o = JSON.parse(sessionStorage.getItem("ad.board") || "null"); if(o && o.k === bkey) saved = o.s; }catch(_){} }
  BOARD = {cv, g, w:r.width, h:r.height, strokes:(BOARD && BOARD.key === mpKey) ? BOARD.strokes : (saved || []), cur:null, ink:(BOARD && BOARD.ink) || INKS[0], size:(BOARD && BOARD.size) || 5, eraser:!!(BOARD && BOARD.eraser), key:mpKey};
  BOARD.view = {z:1, x:0, y:0}; BOARD.pts = new Map(); BOARD.pinch = null; BOARD.noDraw = false;
  boardRedraw(); boardZoomUI();
  /* un dito disegna, due dita zoomano e spostano la lavagna (solo la lavagna, mai la pagina) */
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const toBoard = ([x,y]) => { const v = BOARD.view; return [(x - v.x) / v.z / BOARD.w, (y - v.y) / v.z / BOARD.h]; };
  const pinchInfo = () => { const [a,b] = [...BOARD.pts.values()]; return {d:Math.hypot(a[0]-b[0], a[1]-b[1]) || 1, m:[(a[0]+b[0])/2, (a[1]+b[1])/2]}; };
  cv.onpointerdown = e => {
    try{ cv.setPointerCapture(e.pointerId); }catch(_){} BOARD.pts.set(e.pointerId, pos(e));
    if(BOARD.pts.size === 1 && !BOARD.noDraw){
      BOARD.cur = {c:BOARD.eraser ? PAPER : BOARD.ink, s:(BOARD.eraser ? 22 : BOARD.size) / BOARD.view.z, p:[toBoard(pos(e))], id:e.pointerId};
      BOARD.strokes.push(BOARD.cur); boardRedraw();
    } else if(BOARD.pts.size === 2){
      // arriva il secondo dito: il tratto appena iniziato era un errore, lo tolgo
      if(BOARD.cur){ const i = BOARD.strokes.indexOf(BOARD.cur); if(i >= 0) BOARD.strokes.splice(i, 1); BOARD.cur = null; }
      BOARD.noDraw = true; const pi = pinchInfo(); BOARD.pinch = {d0:pi.d, m0:pi.m, v0:{...BOARD.view}}; boardRedraw();
    }
  };
  cv.onpointermove = e => {
    if(!BOARD.pts.has(e.pointerId)) return; BOARD.pts.set(e.pointerId, pos(e));
    if(BOARD.pinch && BOARD.pts.size >= 2){
      const {d, m} = pinchInfo(), {d0, m0, v0} = BOARD.pinch, w = BOARD.w, h = BOARD.h;
      const z = Math.min(5, Math.max(1, v0.z * d / d0));
      let x = m[0] - (m0[0] - v0.x) / v0.z * z, y = m[1] - (m0[1] - v0.y) / v0.z * z;
      x = Math.min(0, Math.max(w - w*z, x)); y = Math.min(0, Math.max(h - h*z, y));
      BOARD.view = {z, x, y}; boardRedraw(); boardZoomUI(); return;
    }
    if(BOARD.cur && BOARD.cur.id === e.pointerId){ BOARD.cur.p.push(toBoard(pos(e))); boardRedraw(); }
  };
  cv.onpointerup = cv.onpointercancel = e => {
    BOARD.pts.delete(e.pointerId);
    if(BOARD.cur && BOARD.cur.id === e.pointerId){ BOARD.cur = null; boardSave(); }
    if(BOARD.pts.size < 2) BOARD.pinch = null;
    if(BOARD.pts.size === 0) BOARD.noDraw = false; // si torna a disegnare solo dopo aver alzato tutte le dita
  };
}

function boardSave(){ try{ sessionStorage.setItem("ad.board", JSON.stringify({k:NET.code + "|" + BOARD.key, s:BOARD.strokes})); }catch(_){} }
function boardZoomUI(){ const b = $("#b-fit"); if(b) b.hidden = !BOARD || BOARD.view.z <= 1.01; }
function boardFit(){ if(!BOARD) return; BOARD.view = {z:1, x:0, y:0}; boardRedraw(); boardZoomUI(); }
function boardPaint(g, w, h, strokes, view){
  g.save(); g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
  if(view && view.z > 1){ g.translate(view.x, view.y); g.scale(view.z, view.z); }
  strokes.forEach(st => {
    g.strokeStyle = st.c; g.lineWidth = st.s * (w/340); g.beginPath();
    st.p.forEach(([x,y], i) => i ? g.lineTo(x*w, y*h) : g.moveTo(x*w, y*h));
    if(st.p.length === 1) g.lineTo(st.p[0][0]*w + .1, st.p[0][1]*h);
    g.stroke();
  });
  g.restore();
}
function boardRedraw(){ if(BOARD) boardPaint(BOARD.g, BOARD.w, BOARD.h, BOARD.strokes, BOARD.view); }
function boardSnapshot(){
  if(!BOARD || !BOARD.strokes.length) return null;
  const c = document.createElement("canvas"), W = 300, H = Math.round(300 * BOARD.h / BOARD.w);
  c.width = W; c.height = H; const g = c.getContext("2d"); g.lineCap = "round"; g.lineJoin = "round";
  boardPaint(g, W, H, BOARD.strokes);
  return c.toDataURL("image/jpeg", .65);
}

async function mpHostStart(){

/* riapro la partita salvata con lo stesso codice: gli amici si ricollegano da soli */
async function mpHostResume(sv){
  mpClose();
  NET.role = "host"; NET.myId = myPid(); NET.code = sv.code; NET.status = "connecting"; NET.lobbyStep = 2; NET.inviteN = 0;
  M = sv.M; MD = sv.MD || {}; NET.deck = sv.deck; NET.deckLevel = sv.deckLevel;
  if(M.host !== NET.myId){ const h = mpPlayer(M.host); if(h) h.id = NET.myId; M.scores[NET.myId] = M.scores[M.host]; M.order = M.order.map(x => x === M.host ? NET.myId : x); M.host = NET.myId; }
  M.players.forEach(p => { if(p.id !== NET.myId && p.on){ p.on = false; p.offAt = Date.now(); } });
  if(M.phase === "turn" && M.paused == null) M.endsAt = Date.now() + Math.max(15000, sv.M.endsAt - sv.at); // il tempo era fermo mentre l'app era chiusa
  prevPhase = M.phase;

    try{ await hostOpen(); NET.status = "open"; break; }
    catch(e){ if(e && e.type === "unavailable-id"){ await new Promise(r => setTimeout(r, 3000)); continue; } NET.status = "error"; break; }

function wheelInit(){
  const list = [...document.querySelectorAll(".wtile")].map(b => CATALOG.find(g => g.name === b.getAttribute("aria-label")));
  const N = list.length, wrap = $("#wheelwrap"), step = 360 / N;
  let rot = Math.min(N - 1, Math.max(0, Math.round(S.wheelPos || 0))), anim = null;
  WHEEL = {list};
  const sel = () => ((Math.round(rot) % N) + N) % N;
  const draw = () => {
    const W = wrap.clientWidth, R = W * .40, ws = Math.max(48, Math.min(78, 2 * Math.PI * R / N * .72));
    wrap.style.setProperty("--ws", ws + "px");
    wrap.querySelectorAll(".wtile").forEach((b, i) => {
      let d = ((i - rot) % N + N) % N; if(d > N/2) d -= N;           // distanza dal gioco in alto
      const th = d * step * Math.PI / 180, x = R * Math.sin(th), y = -R * Math.cos(th);
      const near = Math.max(0, 1 - Math.abs(d) / 2.2), sc = .78 + .42 * near;
      b.style.transform = `translate(${x}px,${y}px) scale(${sc})`; b.style.zIndex = Math.round(10 + near * 10); b.style.opacity = .55 + .45 * Math.max(near, .2);
    });
    const g = list[sel()], hub = $("#whub");
    if(hub.dataset.game !== g.id){
      hub.dataset.game = g.id; hub.style.setProperty("--c", g.color); hub.classList.toggle("locked", !g.ready);
      hub.innerHTML = `${ICONS[g.icon]}<b>${g.name}</b><small>${g.ready ? "Tocca per giocare" : "In arrivo"}</small>`;
      $("#wdesc").textContent = g.desc; S.wheelPos = sel();
      const pb = $("#wplay"); pb.dataset.game = g.id; pb.textContent = g.ready ? `Gioca a ${g.name}` : `${g.name}: in arrivo`; pb.classList.toggle("ghost", !g.ready); pb.classList.toggle("pink", g.ready);
    }
  };
  const goTo = target => {
    cancelAnimationFrame(anim);
    const from = rot, t0 = performance.now();
    const tick = now => { const k = Math.min(1, (now - t0) / 320), e = 1 - Math.pow(1 - k, 3); rot = from + (target - from) * e; draw(); if(k < 1) anim = requestAnimationFrame(tick); else { rot = ((target % N) + N) % N; draw(); save(); } };
    anim = requestAnimationFrame(tick);
  };
  // trascina col dito: l'angolo del dito rispetto al centro fa girare la ruota
  let drag = null;
  const ang = e => { const r = wrap.getBoundingClientRect(); return Math.atan2(e.clientX - (r.left + r.width/2), -(e.clientY - (r.top + r.height/2))) * 180 / Math.PI; };
  wrap.onpointerdown = e => { if(e.target.closest("#whub")) return; cancelAnimationFrame(anim); drag = {a:ang(e), rot, moved:0, id:e.pointerId}; wrap.setPointerCapture(e.pointerId); };
  wrap.onpointermove = e => {
    if(!drag) return;
    let da = ang(e) - drag.a; if(da > 180) da -= 360; if(da < -180) da += 360;
    drag.moved = Math.max(drag.moved, Math.abs(da));
    const before = sel(); rot = drag.rot - da / step; draw(); if(sel() !== before){ buzz(8); }
  };
  wrap.onpointerup = wrap.onpointercancel = e => {
    if(!drag) return; const d = drag; drag = null;
    if(d.moved < 4){ const t = document.elementFromPoint(e.clientX, e.clientY)?.closest(".wtile"); if(t){ const i = +t.dataset.wi; let dd = ((i - rot) % N + N) % N; if(dd > N/2) dd -= N; goTo(rot + dd); return; } }
    goTo(Math.round(rot));
  };
  draw();
  if(window.ResizeObserver){ const ro = new ResizeObserver(() => { if(!document.body.contains(wrap)) ro.disconnect(); else draw(); }); ro.observe(wrap); }
}
function guessInfo(){

function mpRender(force){
  if(S.screen !== "mp") return;
  const drawing = M && M.phase === "turn" && !amGuesser() && !(M.queue||[]).includes(NET.myId);
  const guessing = M && M.phase === "reveal" && M.revealed && amGuesser(), cur = guessing ? M.queue[M.view] : null;
  const key = M ? [M.phase, M.turn, M.round, amGuesser(), drawing, guessing ? M.view + "/" + (cur && MD[cur] ? 1 : 0) : ""].join("|") : "none";
  // mentre disegni (o scrivi la risposta) non ridisegno la pagina, altrimenti si cancellerebbe la lavagna
  if(!force && key === mpKey && (drawing || guessing)){ const q = $("#qcount"); if(guessing && q){ const h = guessInfo(); if(q.innerHTML !== h) q.innerHTML = h; } return; }
  if(drawing && key !== mpKey) BOARD = null;
  mpKey = key;
  render();
}
function mpAfterRender(){
  if(S.screen !== "mp") return;
  $("#board-btn").hidden = true;
  if(NET.role === "guest"){ $("#back-btn").hidden = true; $("#menu-btn").hidden = true; }
  $("#info-btn").hidden = !M;
  sndBtn();
  if($("#qrbox")){
    loadScript("lib/qrcode.js", "qrcode").then(() => {
      const q = qrcode(0, "M"); q.addData(joinUrl()); q.make();
      const box = $("#qrbox"); if(box) box.innerHTML = q.createSvgTag(6, 2);
    }).catch(() => { const box = $("#qrbox"); if(box) box.innerHTML = `<p class="hint">${esc(joinUrl())}</p>`; });
  }
  if($("#board")) boardInit();
  clearInterval(mpTick); mpTick = null;
  if(M && M.phase === "turn"){
    mpTick = setInterval(() => {
      const el = $("#mptime"); const s = M && M.paused != null ? Math.ceil(M.paused/1000) : Math.max(0, Math.ceil((mpEndsLocal - Date.now())/1000));
      if(el && el.textContent !== String(s)){ el.textContent = s; el.classList.toggle("low", s <= 10); if(s <= 5 && s > 0 && !(M && M.paused != null)) sfx("tick"); }
    }, 200);
  }
}

/* ---------- eventi ---------- */
view.addEventListener("click", e => {
  if(S.screen !== "mp") return;
  const b = e.target.closest("button"); if(!b) return;
  const id = b.id, d = b.dataset;
  if(d.mpset){ M[d.mpset] = d.mpset === "level" ? d.v : d.mpset === "sprint" ? d.v === "1" : +d.v; if(d.mpset === "rounds") M.roundsManual = true; publish(); }
  else if(id === "mp-start"){ usedNewGame(); M.players = M.players.filter(p => p.on); M.order = shuffle(M.players.map(p => p.id)); M.scores = {}; M.players.forEach(p => M.scores[p.id] = 0); M.turn = 0; M.round = 1; M.phase = "ready"; publish(); }
  else if(id === "mp-go"){ act({t:"start"}); }
  else if(id === "mp-reveal"){ b.disabled = true; sfx("pop"); act({t:"reveal"}); }
  else if(id === "mp-skip"){ act({t:"start", skip:true}); }

const PIN_HASH = "318aee3fed8c9d040d35a7fc1fa776fb31303833aa2de885354ddf3d44d8fb69"; // SHA-256 del PIN dell'host; vuoto = nessun lucchetto
const LOCK_ON = !!PIN_HASH && /github\.io$/.test(location.hostname);
function isUnlocked(){ try{ return localStorage.getItem("ad.host") === PIN_HASH; }catch(e){ return false; } }
async function sha256(t){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
  // ripiego per i browser senza crypto.subtle
  const K = [], H = [], isP = n => { for(let f = 2; f*f <= n; f++) if(n % f === 0) return false; return true; };
  for(let n = 2, i = 0; i < 64; n++) if(isP(n)){ if(i < 8) H[i] = (Math.pow(n, 1/2) * 2**32) | 0; K[i++] = (Math.pow(n, 1/3) * 2**32) | 0; }
  const bytes = [...new TextEncoder().encode(t)], l = bytes.length * 8; bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i*8)) & 255);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for(let o = 0; o < bytes.length; o += 64){
    const w = []; for(let i = 0; i < 16; i++) w[i] = (bytes[o+4*i] << 24) | (bytes[o+4*i+1] << 16) | (bytes[o+4*i+2] << 8) | bytes[o+4*i+3];
    for(let i = 16; i < 64; i++){ const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3), s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i = 0; i < 64; i++){ const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
    [a,b,c,d,e,f,g,h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}
