<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14173f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AfterDinner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AfterDinner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: una colonna da telefono, schermate a "carte" su un tavolo notturno; una sola cosa grande per volta */
:root{
  --night:#14173f; --night-2:#21266a; --night-3:#30378c;
  --paper:#fff6e6; --ink:#2a2140; --board:#e9ebf7;
  --mango:#ffa41b; --pink:#ff3d72; --mint:#14d494; --sky:#3d8bff; --lilac:#8f63ff;
  --muted:#b3b8ea;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:22px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;
}
/* sfondo su un livello fisso: background-attachment:fixed su iPhone lasciava riquadri chiari dopo le transizioni */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at 15% 10%,rgba(255,181,71,.10),transparent 40%),radial-gradient(circle at 90% 85%,rgba(255,111,145,.10),transparent 45%)}
.app{max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:6px 16px}
.logo{grid-column:2;font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1;background:none;border:0;color:var(--paper);cursor:pointer;padding:0}
.logo .dots{display:flex;gap:6px}
.logo .dots i{width:11px;height:11px;border-radius:50%;display:block}
.logo .dots i:nth-child(1){background:var(--mango)}.logo .dots i:nth-child(2){background:var(--pink)}.logo .dots i:nth-child(3){background:var(--mint)}
.iconbtn{font:600 .9rem var(--body);color:var(--paper);background:var(--night-2);border:1px solid var(--night-3);border-radius:999px;padding:8px 14px;cursor:pointer}
.iconbtn:hover{background:var(--night-3)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2.3rem}
h2{font-size:1.6rem}
.lead{color:var(--muted);margin:6px 0 0}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--muted)}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;animation:in .28s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* bottoni */
.btn{font:600 1.1rem var(--display);letter-spacing:.01em;border:0;border-radius:18px;padding:16px 20px;cursor:pointer;color:var(--ink);background:var(--mango);box-shadow:0 5px 0 #c2740a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c2740a}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #b8204c}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #0a9468}
.btn.ghost{background:var(--night-2);color:var(--paper);box-shadow:0 5px 0 #11152b}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stack{display:flex;flex-direction:column;gap:12px}

/* home */
.hero{padding:0;margin-top:-6px;text-align:center}
.hero h1{margin:0}
.hero h1 span{color:var(--mango)}
.games{display:flex;flex-direction:column;gap:14px}
.game{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;border:0;border-radius:var(--r);padding:16px;background:var(--paper);color:var(--ink);cursor:pointer;position:relative;font:inherit}
.game .art{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:700 1.9rem var(--display);color:var(--ink)}
.game h3{font-size:1.3rem}
.game p{margin:2px 0 0;font-size:.92rem;color:#5b5272}
.game .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px;background:#f0e3cc;color:#5b4a2c}
.game.soon{background:var(--night-2);color:var(--paper);cursor:default}
.game.soon p{color:var(--muted)}
.game.soon .tag{background:var(--night-3);color:var(--muted)}
.game.soon .art{background:var(--night-3)!important;color:var(--muted)}

/* giocatori */
.field{display:flex;gap:10px}
.field input{flex:1;min-width:0;font:500 1.1rem var(--body);padding:14px 16px;border-radius:16px;border:2px solid var(--night-3);background:var(--night-2);color:var(--paper)}
.field input::placeholder{color:var(--muted)}
.field .btn{padding:14px 18px}
.players{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.player{display:flex;align-items:center;gap:12px;background:var(--night-2);border-radius:16px;padding:10px 12px}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 1.05rem var(--display);color:var(--ink)}
.player .name{flex:1;font-weight:600;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:10px}
.x:hover{color:var(--pink)}
.empty{color:var(--muted);text-align:center;padding:18px;border:2px dashed var(--night-3);border-radius:16px}
.opts{display:grid;grid-template-columns:1fr;gap:14px;background:var(--night-2);border-radius:var(--r);padding:16px}
.opt label{display:block;font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:600 1rem var(--display);padding:10px;border-radius:12px;border:2px solid var(--night-3);background:transparent;color:var(--paper);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* passa il telefono */
.pass{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:20px 0}
.pass .big-av{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font:700 3rem var(--display);color:var(--ink);box-shadow:0 0 0 10px rgba(255,255,255,.06)}
.pass h1{font-size:2.6rem}
.roundinfo{font-variant-numeric:tabular-nums}

/* carta */
.card{background:var(--paper);color:var(--ink);border-radius:28px;padding:22px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.mode{display:inline-flex;align-items:center;gap:8px;font:700 1rem var(--display);padding:7px 14px;border-radius:999px;color:var(--ink)}
.mode .pts{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 8px;font-size:.85rem}
.word{font:700 clamp(2.2rem,11vw,3.4rem) var(--display);line-height:1.05;overflow-wrap:anywhere}
.cat{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:#7a6f8f;font-weight:700}
.rule{font-size:.95rem;color:#5b5272;margin:0;max-width:34ch}
.timer{position:relative;width:132px;height:132px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font:700 2.6rem var(--display);font-variant-numeric:tabular-nums;color:var(--paper)}
.timer.low .t{color:var(--pink)}
.timer.low{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.hidden-word{filter:blur(14px);user-select:none}
.peek{font:600 .85rem var(--body);background:none;border:0;color:#7a6f8f;text-decoration:underline;cursor:pointer}

/* chi ha indovinato */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.who button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:2px solid var(--night-3);background:var(--night-2);color:var(--paper);font:600 1rem var(--body);cursor:pointer;text-align:left;min-width:0}
.who button span.n{min-width:0;overflow-wrap:anywhere}
.who button:hover{border-color:var(--mint)}
.who .av{width:32px;height:32px;font-size:.95rem}

/* esito */
.burst{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 0}
.burst .plus{font:700 3.2rem var(--display);color:var(--mint)}
.deltas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.delta{background:var(--night-2);border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700}
.delta .av{width:28px;height:28px;font-size:.85rem}
.delta b{color:var(--mint)}

/* tabellone */
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:grid;grid-template-columns:28px 38px 1fr auto;align-items:center;gap:12px;background:var(--night-2);border-radius:16px;padding:10px 14px}
.board .pos{font:700 1.1rem var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.board .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.board .bar{grid-column:3/4;height:6px;border-radius:6px;background:var(--night-3);overflow:hidden;margin-top:4px}
.board .bar i{display:block;height:100%;background:var(--mango);border-radius:6px}
.board .sc{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.board li.first{background:linear-gradient(90deg,rgba(255,181,71,.25),var(--night-2))}
.board li.first .pos{color:var(--mango)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:10px}
.pod{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .col{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:8px;font:700 1.6rem var(--display);color:var(--ink)}
.pod .nm{font-weight:700;text-align:center;overflow-wrap:anywhere;font-size:.95rem}
.pod .pts{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}

/* regole */
.rules{background:var(--night-2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.rules ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes div{border-radius:14px;padding:10px 12px;color:var(--ink);font-size:.85rem;line-height:1.3}
.modes b{display:block;font:700 1.05rem var(--display)}
.confirm{background:var(--night-2);border:2px solid var(--pink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
/* splash di apertura */
#splash{position:fixed;inset:0;z-index:100;background:var(--night);display:grid;place-items:center;cursor:pointer;animation:splashOut .45s ease-in 2.5s forwards}
#splash .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
#splash .dots{display:flex;gap:14px}
#splash .dots i{width:26px;height:26px;border-radius:50%;display:block;transform:translateY(-60px) scale(0);animation:drop .6s cubic-bezier(.3,1.6,.5,1) forwards, hop .5s ease-in-out 1.55s 2}
#splash .dots i:nth-child(1){background:var(--mango);animation-delay:.1s,1.55s}
#splash .dots i:nth-child(2){background:var(--pink);animation-delay:.25s,1.65s}
#splash .dots i:nth-child(3){background:var(--mint);animation-delay:.4s,1.75s}
#splash .name{font:700 clamp(2.4rem,12vw,3.4rem) var(--display);color:var(--paper);display:flex;letter-spacing:.01em}
#splash .name span{display:inline-block;opacity:0;transform:translateY(14px);animation:letter .35s ease-out forwards}
#splash .name span.d{color:var(--mango)}
@keyframes drop{to{transform:none}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation:splashOut .3s ease-in 1s forwards!important}#splash *{opacity:1!important;transform:none!important}}
/* home: elenco giochi */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.people{display:flex;flex-direction:column;align-items:center;gap:8px}
.people .plabel{font:700 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prow{position:relative;display:flex;justify-content:center;width:100%}
.stepper{display:flex;align-items:center;gap:6px;background:radial-gradient(120% 140% at 50% 50%,var(--night) 55%,color-mix(in srgb,var(--night-3) 55%,var(--night)) 100%);border:2px solid color-mix(in srgb,var(--paper) 38%,var(--night-3));border-radius:999px;padding:5px;box-shadow:inset 0 0 18px rgba(0,0,0,.35)}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--paper);font:700 1.4rem var(--display);cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:64px;text-align:center;font:700 1.4rem var(--display)}
.pclear{position:absolute;left:calc(50% + 100px);top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer}
.chips button{font:600 .9rem var(--body);padding:8px 14px;border-radius:999px;border:2px solid var(--night-3);background:transparent;color:var(--paper);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gitem{width:100%;display:grid;grid-template-columns:60px 1fr 18px;gap:14px;align-items:center;text-align:left;font:inherit;color:var(--paper);background:var(--night-2);border:2px solid transparent;border-radius:20px;padding:12px;cursor:pointer;transition:transform .1s,border-color .15s}
.gitem:hover{border-color:var(--night-3)}
.gitem:active{transform:scale(.98)}
.gitem:not(.locked){background:var(--paper);color:var(--ink)}
.gicon{width:60px;height:60px;border-radius:18px;background:var(--c);color:var(--ink);display:grid;place-items:center}
.gicon svg{width:32px;height:32px}
.locked .gicon{background:color-mix(in srgb,var(--c) 55%,var(--night-3));color:var(--paper)}
.gtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.gname{font:600 1.2rem var(--display);line-height:1.15}
.gdesc{font-size:.88rem;opacity:.8}
.gmeta{font-size:.75rem;font-weight:700;opacity:.6;margin-top:2px}
.soon{font:700 .62rem var(--body);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;background:var(--night-3);color:var(--muted);border-radius:999px;padding:2px 7px;vertical-align:middle}
.chev{font:700 1.6rem var(--display);opacity:.5}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,28,.7);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:in .2s ease-out}
.modal .sheet{width:100%;max-width:480px;background:var(--night-2);border:2px solid var(--night-3);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.viewsw{display:flex;align-self:center;flex:none;background:radial-gradient(120% 160% at 50% 50%,var(--night) 55%,color-mix(in srgb,var(--night-3) 55%,var(--night)) 100%);border:2px solid color-mix(in srgb,var(--paper) 38%,var(--night-3));border-radius:999px;padding:3px;gap:2px;margin-top:-6px}
.viewsw button{font:600 .85rem var(--body);padding:7px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.viewsw button[aria-pressed="true"]{background:color-mix(in srgb,var(--paper) 14%,transparent);color:var(--paper)}
/* ruota: la home sta tutta in una schermata, ferma */
html.wheelmode,html.wheelmode body{height:100%;overflow:hidden}
html.wheelmode .app{height:100dvh;min-height:0;box-sizing:border-box;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
html.wheelmode #view{flex:1;min-height:0;display:flex;flex-direction:column}
html.wheelmode #view>.screen{flex:1;min-height:0;gap:12px}
.wheelzone{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;container-type:size;margin-top:-4px}
.wheelzone .wheelwrap{flex:none;width:min(100cqw,calc(100cqh - 3.6em - 64px),420px);height:auto;max-width:none;aspect-ratio:1}
.wheelwrap{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.wheel{position:absolute;inset:0}
.wheel::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dashed var(--night-3)}
.wtile{position:absolute;left:50%;top:50%;width:var(--ws);height:var(--ws);margin:calc(var(--ws)/-2) 0 0 calc(var(--ws)/-2);border-radius:28%;border:0;background:var(--c);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 6px 0 rgba(0,0,0,.25);will-change:transform}
.wtile svg{width:58%;height:58%}
.wtile.locked{background:color-mix(in srgb,var(--c) 60%,var(--night-3))}
.whub{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:var(--c);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.25),0 0 0 8px color-mix(in srgb,var(--c) 25%,transparent);transition:background .25s;padding:8px}
.whub svg{width:42%;height:42%}
.whub b{font:700 clamp(1rem,4.6vw,1.35rem)/1.05 var(--display);text-align:center}
.whub small{font:700 .62rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.wdesc{text-align:center;margin:0;min-height:2.6em;color:var(--muted);flex:none}
.wplay{flex:none;width:100%;margin-top:auto}
.ggrid{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.gtile{width:100%;aspect-ratio:1;max-width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;text-align:center;background:var(--c);color:var(--ink);border:0;border-radius:32px;padding:26px 22px 24px;font:inherit;cursor:pointer;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .15s}
.gtile.pressing{transform:scale(.96)}
.gtile .gname{font:700 clamp(1.7rem,8vw,2.3rem) var(--display);line-height:1.05;text-wrap:balance}
.gtile .gicon{color:var(--ink);flex:1;min-height:0;width:100%;display:grid;place-items:center;background:none;box-shadow:none;height:auto;border-radius:0}
.gtile .gicon svg{width:auto;height:78%;max-width:60%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))}
.gtile .gdesc{font-size:1rem;font-weight:500;opacity:.85;max-width:30ch;text-wrap:balance}
.gtile.locked{filter:saturate(.75) brightness(.88)}
.gtile .badge{position:static;margin-top:-2px;font:700 .66rem var(--body);text-transform:uppercase;letter-spacing:.1em;background:rgba(20,23,63,.85);color:var(--paper);border-radius:999px;padding:5px 10px}
.badges{display:flex;gap:6px;justify-content:center}
.gtile .badge.adult{background:var(--paper);color:#b0102a}
.zoom{position:fixed;z-index:90;border-radius:32px;pointer-events:none;display:grid;place-items:center;color:var(--ink);transition:all .45s cubic-bezier(.6,0,.2,1)}
.zoom svg{width:120px;height:120px;transition:transform .45s cubic-bezier(.6,0,.2,1),opacity .3s}
.zoom.fade{opacity:0;transition:opacity .3s}
html,body{overscroll-behavior-y:contain}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:max(16px,1em)}
html:has(.modal),html:has(.modal) body{overflow:hidden}
.modal{overscroll-behavior:contain}
.modal .sheet{position:relative;max-height:100%;min-height:0;flex:0 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal .sheet>h2:first-of-type{padding-right:44px}
.xclose{position:sticky;top:0;align-self:flex-end;flex:none;margin:0 -4px -40px 0;box-shadow:0 4px 14px rgba(0,0,0,.35);width:40px;height:40px;border-radius:50%;border:0;background:var(--night-3);color:var(--paper);display:grid;place-items:center;cursor:pointer;z-index:2}
.xclose svg{width:20px;height:20px}
.preview .xclose{background:rgba(20,23,63,.55)}
#ptr{position:fixed;left:50%;top:env(safe-area-inset-top,0px);z-index:95;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--night-2);border:2px solid var(--night-3);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(-60px);pointer-events:none}
#ptr svg{width:22px;height:22px;color:var(--mango)}
#ptr.armed{border-color:var(--mango)}
#ptr.go svg{animation:spin .8s linear infinite}
.newver{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:96;border:0;border-radius:999px;background:var(--mango);color:var(--ink);font:700 .95rem var(--body);padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45);width:max-content;max-width:calc(100% - 32px);cursor:pointer;animation:in .3s ease-out}
.hright{grid-column:3;grid-row:1;justify-self:end;display:flex;gap:8px;align-items:center}
#host-btn,.dhost{font-size:1.4rem;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none;line-height:1;letter-spacing:-.05em}
#host-btn[hidden]{display:none}
.hostsheet .hlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.hitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;background:var(--night-2);border:2px solid var(--night-3);border-radius:16px;padding:12px 14px;color:var(--paper);font:inherit;cursor:pointer}
.hitem b{font:600 1.05rem var(--display);display:flex;align-items:center;gap:8px}
.hitem b .av{width:26px;height:26px;font-size:.8rem}
.hitem span{color:var(--muted);font-size:.85rem}
.hitem em{font-style:normal;font-weight:700;font-size:.85rem;color:var(--mango)}
.hitem.armed{border-color:var(--mango);animation:popin .25s}
.hitem.danger b{color:var(--pink)}
.hitem.danger.armed{border-color:var(--pink)}.hitem.danger em{color:var(--pink)}
#info-btn,#snd-btn,#host-btn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
#snd-btn svg{width:22px;height:22px}
#snd-btn[aria-pressed="false"]{color:var(--muted)}
#snd-btn[hidden]{display:none}
#info-btn svg{width:24px;height:24px}
.rulesheet .sheet{gap:14px}
.rulesheet h3{margin:4px 0 0;font:600 1.05rem var(--display);color:var(--mango)}
.rulesheet ol,.rulesheet ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.rulesheet .modes{margin-top:4px}
#menu-btn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
#menu-btn svg{width:22px;height:22px}
.set-list{display:flex;flex-direction:column;gap:4px;width:100%}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--night-3)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.set-row .lbl b{font-weight:700}
.set-row .lbl span{font-size:.82rem;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--night-3);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:transform .2s}
.sw:checked{background:var(--mint)}
.sw:checked::after{transform:translateX(22px)}
.set-row input[type=range]{flex:1;accent-color:var(--mango);min-width:0}

#back-btn{grid-column:1;grid-row:1;justify-self:start;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
#back-btn svg{width:22px;height:22px}

.lock{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--night-3);border:2px solid var(--night)}
.lock::after{content:"";position:absolute;left:6px;top:8px;width:6px;height:5px;border-radius:1px;background:var(--muted);box-shadow:0 -3px 0 -1px transparent}
.lock::before{content:"";position:absolute;left:6.5px;top:4px;width:3px;height:4px;border:1.5px solid var(--muted);border-bottom:0;border-radius:3px 3px 0 0}
.preview .sheet{align-items:center;text-align:center}
.preview .gicon{width:96px;height:96px;border-radius:28px}
.preview .gicon svg{width:48px;height:48px}
.preview .pmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.preview .pmeta span{font-size:.78rem;font-weight:700;background:var(--night-3);color:var(--paper);border-radius:999px;padding:4px 10px}
.preview .row{width:100%}
/* multi-telefono */
.seg button.est{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.seg button.est small{font:600 .68rem var(--body);opacity:.75;white-space:nowrap}
.seg button.est small.rec{opacity:1;color:var(--mango);text-transform:uppercase;letter-spacing:.06em;font-size:.6rem}
.seg button.est[aria-pressed="true"] small.rec{color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:4px;background:var(--night-2);border-radius:999px;padding:5px 6px;align-self:center;max-width:100%;flex-wrap:nowrap;justify-content:center}
.inks{display:flex;gap:5px}
.ink{width:25px;height:25px;flex:none;border-radius:50%;border:0;background:var(--ink);cursor:pointer;padding:0;box-shadow:0 0 0 2px var(--night-2),0 0 0 2px transparent;transition:box-shadow .15s,transform .15s}
.ink[aria-pressed="true"]{box-shadow:0 0 0 2px var(--night-2),0 0 0 4px var(--paper);transform:scale(1.05)}
.tsep{width:1px;height:22px;background:var(--night-3);margin:0 2px}
.tbtn{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.tbtn svg{width:20px;height:20px}
.tbtn:hover{background:var(--night-3)}
.tbtn[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.sz{width:8px;height:8px;border-radius:50%;background:currentColor;transition:all .15s}
.sz.thick{width:16px;height:16px}
.finale{gap:14px}
.rv{opacity:0;animation:rise .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.podium-list,.mid-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.podium-list li,.mid-list li,.lastrow{display:grid;grid-template-columns:44px 38px 1fr auto;align-items:center;gap:12px;background:var(--night-2);border-radius:18px;padding:12px 16px}
.podium-list li{padding:16px}
.podium-list .pnum{font:700 1.6rem var(--display)}
.podium-list .pname{font:700 1.25rem var(--display)}
.pod-oro{background:linear-gradient(100deg,#ffcf4a,#ffa41b)!important;color:var(--ink)}
.pod-oro .pname{font-size:1.6rem!important}
.pod-argento{background:linear-gradient(100deg,#e6e8f5,#b9bdd8)!important;color:var(--ink)}
.pod-bronzo{background:linear-gradient(100deg,#f0a979,#c9774a)!important;color:var(--ink)}
.pnum{font:700 1.1rem var(--display);text-align:center;font-variant-numeric:tabular-nums}
.pname{font-weight:700;min-width:0;overflow-wrap:anywhere}
.ppts{font:700 1.1rem var(--display);font-variant-numeric:tabular-nums}
.mid-list li{opacity:0}
.last{background:var(--night-2);border:2px dashed var(--night-3);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.last .lastrow{grid-template-columns:38px 1fr auto;background:transparent;padding:0}
.quip{font:600 1.15rem var(--display);margin:0;color:var(--paper);text-wrap:balance}
.quip b{color:var(--pink)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1!important}}
.viewer{background:var(--board);box-shadow:0 0 0 3px var(--night-3);border-radius:22px;aspect-ratio:1/1.1;max-height:58vh;width:100%;display:grid;place-items:center;overflow:hidden}
.viewer{position:relative}
.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;animation:in .25s ease-out}
.dwait.big{background:transparent;color:#7a6f8f;font-size:1rem;text-align:center;padding:20px;aspect-ratio:auto}
.guessview{gap:12px}
.gstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none;flex:none}
.gstrip::-webkit-scrollbar{display:none}
.gcard{flex:none;scroll-snap-align:start;position:relative;width:96px;height:132px;padding:0;border:0;border-radius:14px;background:var(--board);box-shadow:0 0 0 2px var(--night-3);overflow:hidden;cursor:pointer;animation:cardin .45s both cubic-bezier(.2,1.1,.4,1)}
.gcard img{width:100%;height:100%;object-fit:contain;display:block}
.gcard .gname{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:rgba(27,30,58,.88);color:var(--paper);font:600 .75rem var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard.win{box-shadow:0 0 0 3px var(--mint)}
.gcard.win .gname{background:var(--mint);color:var(--ink)}
.outcome.zoomd img{width:auto;max-width:86vw;max-height:66vh;border-radius:18px}
.still,.still .watchhead,.still .rhead,.still .sentok,.still .big-av,.still .dword,.still .viewer img,.still .sentlist li,.still .gcard,.still .lb li,.still .ldelta{animation:none!important}
/* chi ha già disegnato: countdown, chi sta guardando, esito */
.sentok{font:700 .95rem var(--display);color:var(--ink);background:var(--mint);border-radius:999px;padding:6px 14px;animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
img.mine.small{width:auto;max-width:40%;max-height:24vh;opacity:.9;transform:rotate(-3deg);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.think{display:inline-flex;gap:6px;align-items:center}
.think i{width:10px;height:10px;border-radius:50%;background:var(--mango);animation:thinkdot 1.1s infinite ease-in-out}
.think i:nth-child(2){animation-delay:.15s;background:var(--pink)}.think i:nth-child(3){animation-delay:.3s;background:var(--mint)}
@keyframes thinkdot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.watchview{gap:10px}
.sentbox{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px;align-items:stretch;text-align:center}
.sentlist .chk{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--night-3);display:grid;place-items:center;font:700 .85rem var(--body);color:var(--ink)}
.sentlist li.ok .chk{background:var(--mint);border-color:var(--mint)}
.sentlist li.wait .chk{border-color:var(--muted)}
.sentlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;width:100%;max-width:360px}
.sentlist li{display:flex;align-items:center;gap:10px;background:var(--night-2);border-radius:12px;padding:5px 12px;text-align:left}
.sentlist .av{width:24px;height:24px;font-size:.72rem;flex:none}
.sentlist .sn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sentlist .ss{font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px}
.sentlist li.ok .ss{color:var(--mint)}
.sentlist li.ok:last-of-type{animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
.sentlist li{padding:7px 12px;font-size:1.02rem}
.sentlist li.wait{opacity:.85;box-shadow:inset 0 0 0 1px var(--night-3)}.sentlist li.wait .ss{color:var(--muted);font-weight:500}
.sentlist li.off{opacity:.45}
.sentlist .think i{width:5px;height:5px}
.bigwait .megatime{margin:-6px 0}
.watchhead{text-align:center;background:var(--night-2);border-radius:18px;padding:10px 14px;animation:popin .4s cubic-bezier(.3,1.4,.5,1)}
.watchhead .wtitle{font:700 1.5rem/1.15 var(--display)}
.watchhead.mine{background:linear-gradient(135deg,var(--mango),#ff8a3d);color:var(--ink)}
.watchhead.mine .eyebrow{color:rgba(42,33,64,.75)}
.watchhead.mine .wtitle{animation:beat 1.4s ease-in-out infinite}
.qstrip{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.qstrip li{flex:1 0 0;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--night-2);border-radius:14px;padding:6px 4px;transition:opacity .3s,transform .3s}
.qstrip li .av{width:26px;height:26px;font-size:.8rem}
.qstrip .qn{font-size:.72rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qstrip .qs{font-size:.66rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1em}
.qstrip li.now{box-shadow:inset 0 0 0 2px var(--mango);transform:translateY(-2px)}
.qstrip li.now .qs{color:var(--mango);font-weight:700}
.qstrip li.ko{opacity:.6}.qstrip li.ko .qs{color:var(--pink)}
.qstrip li.skip{opacity:.45}
.qstrip li.next{opacity:.7}
.watchview .viewer{position:relative}
.thinkbub{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(27,30,58,.92);color:var(--paper);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.thinkbub .think i{width:7px;height:7px}
.guessview .viewer{aspect-ratio:1/1.3;max-height:56dvh}
/* esito e classifica */
.resultview{gap:10px}
.rhead{text-align:center;background:var(--night-2);border-radius:20px;padding:12px 14px;animation:popin .45s cubic-bezier(.3,1.4,.5,1)}
.rhead.ok{box-shadow:inset 0 0 0 2px var(--mint)}
.rhead.ko{box-shadow:inset 0 0 0 2px var(--night-3)}
.rword{font:700 1.8rem/1.1 var(--display);margin:2px 0}
.rline{margin:0;color:var(--muted)}
.rline b{color:var(--paper)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:flex;align-items:center;gap:10px;background:var(--night-2);border-radius:14px;padding:7px 12px;position:relative;will-change:transform}
.lb li.me{box-shadow:inset 0 0 0 2px var(--mango)}
.lb li.first{background:linear-gradient(90deg,rgba(255,181,71,.25),var(--night-2))}
.lb .av{width:30px;height:30px;font-size:.9rem;flex:none}
.lb.dense{gap:4px}.lb.dense li{padding:4px 12px}.lb.dense .av{width:24px;height:24px;font-size:.75rem}
.lpos{font:700 1rem var(--display);color:var(--muted);width:2em;text-align:center}
.lb li.first .lpos{color:var(--mango)}
.lname{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldelta{font:700 .85rem var(--display);color:var(--ink);background:var(--mint);border-radius:999px;padding:2px 8px;animation:popin .5s 2.4s both cubic-bezier(.3,1.6,.5,1)}
.lsc{font:700 1.3rem var(--display);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right}
.lsc.bump{animation:bump .25s}
.lb li.gain{animation:glow 1.2s 2.4s}
@keyframes bump{50%{transform:scale(1.45);color:var(--mint)}}
@keyframes glow{30%{background:color-mix(in srgb,var(--mint) 30%,var(--night-2))}}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.outcome{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:24px;background:rgba(10,12,28,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .25s;cursor:pointer}
.outcome.out{animation:fadeout .35s forwards}
.oc-in{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:popin .55s cubic-bezier(.3,1.5,.5,1)}
.oc-pts{font:700 clamp(5rem,30vw,8rem)/1 var(--display);color:var(--mint);text-shadow:0 10px 50px rgba(20,212,148,.5)}
.outcome.ko .oc-pts{color:var(--pink);text-shadow:0 10px 50px rgba(255,61,114,.4)}
.oc-title{font:700 1.9rem/1.1 var(--display)}
.oc-sub{color:var(--muted);font-size:1.05rem}
.oc-word{font:700 1.4rem var(--display);background:var(--paper);color:var(--ink);border-radius:14px;padding:6px 16px;margin-top:6px}
.outcome img{width:auto;max-width:min(56vw,220px);max-height:34vh;object-fit:contain;border-radius:16px;margin-top:6px;animation:popin .6s .2s both}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
/* transizioni di gioco */
.megatime{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}}
.sentdots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sentdots i{width:14px;height:14px;border-radius:50%;background:var(--night-3);transition:background .3s}
.sentdots i.on{background:var(--mint);animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.drawscreen .dword{animation:wordin .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes wordin{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
.pass .big-av{animation:popin .5s cubic-bezier(.3,1.5,.5,1)}
.guessview .viewer img{animation:cardin .45s cubic-bezier(.2,1.1,.4,1)}
@keyframes cardin{from{opacity:0;transform:translateX(60px) rotate(4deg) scale(.92)}to{opacity:1;transform:none}}
#mp-reveal{animation:beat 1.2s ease-in-out infinite}
.mebar{box-sizing:border-box;display:flex;align-items:center;gap:10px;background:var(--night-2);border:1px solid var(--night-3);border-radius:999px;padding:4px 14px 4px 4px;align-self:stretch;width:100%}
.mebar .av{width:30px;height:30px;font-size:.9rem;flex:none}
.mebar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:600}
.mebar .mepts{font:700 1rem var(--display);color:var(--mango)}
.mebar .mepos{font:700 1rem var(--display)}
.mebar .mepos small{font:500 .75rem var(--body);color:var(--muted)}
.bigwait{gap:14px}
.dword.small{font-size:1.3rem}
.megatime{font:700 clamp(6rem,38vw,10rem)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--paper);text-shadow:0 8px 40px rgba(255,164,27,.35)}
.megatime.low{color:var(--pink)}
.bigwait .mine{max-height:34vh;width:auto;max-width:70%;border-radius:16px}
.guessform input{text-align:center;font-weight:600}
.drawer-tag{color:var(--mango)}
.xfail{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:10px;pointer-events:none;z-index:60}
.xfail svg{width:42vmin;height:42vmin;max-width:240px;max-height:240px;color:var(--pink);filter:drop-shadow(0 8px 30px rgba(255,61,114,.55));animation:xpop 1.1s ease-out forwards}
.xfail p{margin:0;font:600 1.2rem var(--display);color:var(--paper);background:rgba(10,12,28,.75);padding:6px 14px;border-radius:999px;animation:xfade 1.1s ease-out forwards}
@keyframes xpop{0%{transform:scale(.3) rotate(-25deg);opacity:0}22%{transform:scale(1.12) rotate(5deg);opacity:1}36%{transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:scale(.92)}}
@keyframes xfade{0%,10%{opacity:0}25%,75%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s}
.xfail.sprint{align-content:start;padding-top:120px}
.xfail.watch{background:rgba(10,12,28,.82);justify-items:center;text-align:center;padding:24px;animation:xfade 2.6s ease-out forwards}
.xfail.watch svg{width:30vmin;height:30vmin;max-width:150px;max-height:150px;animation:xpop 2.6s ease-out forwards}
.xfail.watch p{animation:none;background:none;padding:0}
.xfail.watch .xwho{color:var(--muted);font:600 1.1rem var(--body)}
.xfail.watch .xword{font:700 clamp(2rem,11vw,3.4rem)/1.05 var(--display);color:var(--ink);background:var(--paper);border-radius:18px;padding:8px 20px;max-width:100%;overflow-wrap:anywhere;animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
.xfail.watch .xno{color:var(--pink);font:700 1.6rem var(--display)}
.xfail.sprint p{background:var(--mango);color:var(--ink);font-size:1.25rem;animation-duration:1.6s}

<body>

<div id="splash" aria-label="AfterDinner" role="img">
  <div class="wrap">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="name" id="splash-name"></div>
  </div>
</div>
<canvas id="confetti"></canvas>
<div class="app">
  <header class="top">
    <button class="logo" id="home-btn" aria-label="Torna alla home"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>AfterDinner</span></button>
    <div class="hright">
    <button class="iconbtn" id="board-btn" hidden>Punteggi</button>
    <button class="iconbtn" id="host-btn" hidden aria-label="Comandi dell'host">⋯</button>
    <button class="iconbtn" id="snd-btn" hidden aria-label="Effetti audio"></button>
    <button class="iconbtn" id="info-btn" hidden aria-label="Regole del gioco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><circle cx="12" cy="7" r=".6" fill="currentColor"/></svg></button>
    <button class="iconbtn" id="menu-btn" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </div>
    <button class="iconbtn" id="back-btn" hidden aria-label="Torna alla home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<script>
(() => {
const COLORS = ["#ffa41b","#ff3d72","#14d494","#3d8bff","#8f63ff","#ffd21f","#ff7a2e","#22c4ff","#9be21c","#ff6fcf"];
const MODES = [
  {id:"mima", name:"Mima", pts:2, color:"#ffa41b", rule:"Solo gesti. Niente parole, niente suoni."},
  {id:"descrivi", name:"Descrivi", pts:1, color:"#3d8bff", rule:"Parla quanto vuoi, ma senza dire la parola né parti di essa."},
  {id:"disegna", name:"Disegna", pts:2, color:"#14d494", rule:"Disegna nell'aria o su un foglio. Niente lettere né numeri."},
  {id:"tre", name:"Tre parole", pts:3, color:"#ff3d72", rule:"Puoi dire solo tre parole in tutto il turno. Poi solo gesti."}
];
const WORDS = {
  "Cose di casa":["Frigorifero","Lavatrice","Ombrello","Cuscino","Telecomando","Scopa","Moka","Accappatoio","Lampadario","Sveglia","Cavatappi","Stendino","Ferro da stiro","Tostapane"],
  "Animali":["Giraffa","Pinguino","Polpo","Canguro","Riccio","Fenicottero","Lumaca","Scoiattolo","Pipistrello","Cammello","Gufo","Delfino","Zanzara","Tartaruga"],
  "Mestieri":["Pompiere","Dentista","Pizzaiolo","Astronauta","Postino","Giardiniere","Parrucchiere","Bagnino","Mago","Vigile","Idraulico","Sarto"],
  "Cibo":["Lasagna","Arancino","Gelato","Popcorn","Spaghetti","Cannolo","Anguria","Tiramisù","Polenta","Ciambella","Carciofo","Panettone","Mozzarella"],
  "Azioni":["Fare la doccia","Cambiare una gomma","Fare surf","Allacciarsi le scarpe","Montare un mobile","Pescare","Truccarsi","Fare un selfie","Dirigere un'orchestra","Fare yoga","Prendere il treno","Impastare la pizza"],
  "Luoghi":["Spiaggia","Aeroporto","Ospedale","Cinema","Discoteca","Biblioteca","Supermercato","Stazione","Palestra","Luna park","Campeggio","Museo"],
  "Sport e svaghi":["Bowling","Sci","Pallavolo","Karaoke","Scacchi","Paracadutismo","Tennis","Equitazione","Biliardo","Nuoto sincronizzato","Arrampicata","Tiro con l'arco"],
  "Oggetti strani":["Monociclo","Boomerang","Cannocchiale","Clessidra","Fisarmonica","Mongolfiera","Bussola","Metronomo","Palla di vetro","Scafandro"]
};
/* splash: lettere una alla volta, poi sparisce (tocca per saltare) */
(() => {
  const sp = document.getElementById("splash"), nm = document.getElementById("splash-name");
  if(!sp) return;
  try{ const st = JSON.parse(localStorage.getItem("dopocena.v1"))?.settings; if(st && st.splash===false){ sp.remove(); return; } }catch(e){}
  nm.innerHTML = [..."AfterDinner"].map((ch,i)=>`<span class="${i===5?"d":""}" style="animation-delay:${.7+i*.06}s">${ch}</span>`).join("");
  const kill = () => sp.remove();
  sp.addEventListener("animationend", e => { if(e.target===sp) kill(); });
  sp.addEventListener("click", kill);
  setTimeout(kill, 3200);
})();
const ICONS = (() => {
  const w = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  return {
    bolt: w('<path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/>'),
    nosay: w('<path d="M4 5h16v11H9l-5 4z"/><path d="m9 8 6 5M15 8l-6 5"/>'),
    mask: w('<path d="M3 7c3-2 15-2 18 0 0 6-3 10-9 10S3 13 3 7z"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="10.5" r="1.5" fill="currentColor"/>'),
    pencil: w('<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/>'),
    bomb: w('<circle cx="10" cy="14" r="7"/><rect x="13" y="6" width="4" height="3" rx="1" transform="rotate(45 15 7.5)"/><path d="M17 5.5c1-1.5 2.5-1.5 3.5-2.5"/>'),
    head: w('<rect x="8" y="2" width="8" height="6" rx="1.5"/><circle cx="12" cy="15" r="5"/><path d="M12 8v2"/>'),
    gauge: w('<path d="M3 17a9 9 0 0 1 18 0"/><path d="M12 17l5-6"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/>'),
    truth: w('<path d="M3 12l3 3 5-6"/><path d="M14 9l6 6M20 9l-6 6"/>'),
    people: w('<circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M2.5 19c.5-3 3-5 5.5-5s5 2 5.5 5M14 14.5c3 0 5.5 1.5 6 4.5"/>'),
    target: w('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
    chili: w('<path d="M7 20c7 1 12-5 12-11 0-2-1-3-2.5-3S14 8 13 11c-1 3-4 6-8 7-1 .5-.5 2 2 2z" fill="currentColor" stroke="none"/><path d="M16.5 6c0-2 1-3 2.5-3.5"/>'),
    pig: w('<path d="M6.2 7.2 4.5 2.8 9.6 5.2z M17.8 7.2l1.7-4.4-5.1 2.4z" fill="currentColor" stroke-width="1.4"/><circle cx="12" cy="13.2" r="7.6"/><ellipse cx="12" cy="15.8" rx="4" ry="2.8" stroke-width="1.8"/><circle cx="10.6" cy="15.8" r=".8" fill="currentColor" stroke="none"/><circle cx="13.4" cy="15.8" r=".8" fill="currentColor" stroke="none"/><circle cx="9" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1" fill="currentColor" stroke="none"/>'),
    scribble: w('<rect x="7" y="2.5" width="10" height="5" rx="1.5"/><path d="M4 20c2-4 4-5 5-3s-1 3 1 3 3-6 5-5-1 4 1 4 3-2 4-3"/><path d="M12 7.5v3"/>'),
    trophy: w('<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/>')
  };
})();
const CATALOG = [
  {id:"scarabocchi", name:"Scarabocchi", icon:"scribble", color:"#22c4ff", ready:true, players:"4-8", mins:"15-25", phones:"all", desc:"Indovina la parola dai disegni dei tuoi amici."},
  {id:"lampo", name:"Lampo", icon:"bolt", color:"#ffa41b", ready:false, players:"3-10", mins:"20-40", phones:"one", desc:"Mima, descrivi o disegna la parola prima che scada il tempo."},
  {id:"senzadire", name:"Senza dire", icon:"nosay", color:"#ff3d72", players:"4-12", mins:"20-30", phones:"one", desc:"Fai indovinare la parola senza usare le cinque vietate."},
  {id:"intruso", name:"L'Intruso", icon:"mask", color:"#8f63ff", players:"4-10", mins:"10-15", phones:"both", desc:"Tutti conoscono il luogo segreto, tranne uno. Scovalo."},
  {id:"catena", name:"Disegno a catena", icon:"pencil", color:"#14d494", players:"4-10", mins:"15-20", phones:"all", desc:"Frase, disegno, frase: guarda come si deforma il messaggio."},
  {id:"bomba", name:"Bomba", icon:"bomb", color:"#ff7a2e", players:"3-12", mins:"10", phones:"one", desc:"Rispondi alla sfida e passa il telefono prima che esploda."},
  {id:"fronte", name:"Fronte", icon:"head", color:"#3d8bff", players:"3-10", mins:"10-15", phones:"one", desc:"Telefono sulla fronte: gli altri ti aiutano a indovinare."},
  {id:"termometro", name:"Termometro", icon:"gauge", color:"#ffd21f", players:"4-10", mins:"20", phones:"one", desc:"Un indizio, una scala, una lancetta da piazzare nel punto giusto."},
  {id:"verofalso", name:"Vero o falso su di me", icon:"truth", color:"#9be21c", players:"4-10", mins:"15-20", phones:"all", desc:"Tre fatti su di te, uno è falso. Chi ci casca?"},
  {id:"chidinoi", name:"Chi di noi?", icon:"people", color:"#ff6fcf", players:"4-12", mins:"15", phones:"both", desc:"Voto segreto su chi del gruppo farebbe cosa."},
  {id:"stima", name:"Stima", icon:"target", color:"#22c4ff", players:"3-10", mins:"15-20", phones:"all", desc:"Domande con un numero per risposta. Vince chi si avvicina."},
  {id:"porcellino", name:"Il Porcellino", icon:"pig", color:"#e8233f", adult:true, players:"4-10", mins:"20-30", phones:"one", desc:"Domande e sfide per adulti, per quando la serata si scalda."},
  {id:"quiz", name:"Quiz del gruppo", icon:"trophy", color:"#ffa41b", players:"4-12", mins:"20-30", phones:"one", desc:"Quiz a squadre, con domande anche su di voi."}
];
const WHEEL_ON = false; // vista a ruota messa da parte: true per riattivarla
const DEFAULT_SETTINGS = {wheel:false, sfx:true, silentOk:false, music:false, volume:70, vibration:true, splash:true, awake:true};
const STORE_KEY = "dopocena.v1"; // chiave invariata per non perdere le partite salvate

const $ = (s, r=document) => r.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => esc((n.trim()[0]||"?").toUpperCase());

let S = load() || fresh();
function fresh(){ return {screen:"home", players:[], rounds:2, seconds:60, game:null, settings:{...DEFAULT_SETTINGS}}; }
function load(){ try{ const v = JSON.parse(localStorage.getItem(STORE_KEY)); return v && v.players ? v : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

let timerId = null, wake = null, audio = null;
S.settings = {...DEFAULT_SETTINGS, ...(S.settings||{})};
if(!S.settings.audioOffV1){ S.settings.sfx = false; S.settings.music = false; S.settings.audioOffV1 = true; }
if(!S.settings.sfxOnV2){ S.settings.sfx = true; S.settings.sfxOnV2 = true; } // Rob: effetti accesi per tutti, ospiti compresi; la musica resta spenta // per ora l'audio parte spento: si accende dalle impostazioni
const ST = () => S.settings;

function go(screen){ S.screen = screen; save(); render(); window.scrollTo(0,0); }
function player(id){ return S.players.find(p => p.id === id); }
function av(p, cls="av"){ return `<span class="${cls}" style="background:${p.color}">${initial(p.name)}</span>`; }

/* ---------- Schermate ---------- */
const screens = {
  home(){
    const f = S.filter || "all";
    const n = S.people || null;
    const fits = g => { if(!n) return true; const [a,b] = String(g.players).split("-").map(Number); return n >= a && n <= (b || a); };
    const list = CATALOG.filter(g => (f==="all" || (f==="one" ? g.phones!=="all" : g.phones!=="one")) && fits(g));
    const chip = (k,l) => `<button data-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
    return `
    <section class="screen">
      <div class="hero">
        <h1>A cosa <span>giochiamo?</span></h1>
      </div>
      ${S.game && !S.game.over ? `<button class="btn mint" id="resume">Riprendi la partita di Lampo</button>` : ""}
      <div class="people" role="group" aria-label="Quanti siete stasera">
        <span class="plabel">Quanti siete stasera?</span>
        <div class="prow"><div class="stepper"><button data-people="-1" aria-label="Uno in meno" ${n && n <= 2 ? "disabled" : ""}>−</button><output aria-live="polite">${n ? n : "?"}</output><button data-people="1" aria-label="Uno in più" ${n >= 16 ? "disabled" : ""}>+</button></div>
        ${n ? `<button class="pclear" data-people="0" aria-label="Mostra tutti i giochi">✕</button>` : ""}</div>
      </div>
      <div class="chips" role="group" aria-label="Filtra i giochi">${chip("all","Tutti")}${chip("one","Un telefono")}${chip("many","Più telefoni")}</div>

      ${WHEEL_ON && ST().wheel && list.length ? wheelHTML(list) : `<ul class="ggrid">${list.map(g => `
        <li><button class="gtile ${g.ready?"":"locked"}" style="--c:${g.color}" data-game="${g.id}" aria-label="${g.name}${g.ready?"":", in arrivo"}">
          <span class="gname">${g.name}</span>
          <span class="gicon">${ICONS[g.icon]}</span>
          <span class="gdesc">${g.desc}</span>
          <span class="badges">${g.adult?`<span class="badge adult">18+</span>`:""}${g.ready?"":`<span class="badge">In arrivo</span>`}</span>
        </button></li>`).join("")}
      </ul>`}

function rank(){
  const sc = S.game.scores;
  return [...S.players].sort((a,b)=> sc[b.id]-sc[a.id] || a.name.localeCompare(b.name));
}
function boardHTML(compact){
  const ranked = rank(), sc = S.game.scores, max = Math.max(1, ...Object.values(sc));
  let pos = 0, prev = null;
  return `<ol class="board">${ranked.map((p,i)=>{ if(sc[p.id]!==prev){pos=i+1;prev=sc[p.id];}
    return `<li class="${pos===1&&sc[p.id]>0?"first":""}"><span class="pos">${pos}</span>${av(p)}
      <span><span class="nm">${esc(p.name)}</span>${compact?"":`<span class="bar" style="display:block"><i style="width:${sc[p.id]/max*100}%"></i></span>`}</span>
      <span class="sc">${sc[p.id]}</span></li>`}).join("")}</ol>`;
}

/* ---------- Logica di gioco ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newGame(){
  const deck = shuffle(Object.entries(WORDS).flatMap(([cat,ws])=>ws.map(w=>({cat,word:w}))));
  S.game = {round:1, rounds:S.rounds, seconds:S.seconds, turn:0, order:shuffle(S.players.map(p=>p.id)),
    scores:Object.fromEntries(S.players.map(p=>[p.id,0])), deck, card:null, hidden:false, endsAt:null, last:null, over:false};
}
function drawCard(){
  const g = S.game;
  if(!g.deck.length) g.deck = shuffle(Object.entries(WORDS).flatMap(([cat,ws])=>ws.map(w=>({cat,word:w}))));
  const c = g.deck.pop();
  // "Tre parole" esce più di rado, è la carta difficile
  const r = Math.random(); const mode = r<.32?"mima":r<.62?"descrivi":r<.88?"disegna":"tre";
  g.card = {...c, mode}; g.hidden = false;
}
function startTurn(){
  drawCard();
  S.game.endsAt = Date.now() + S.game.seconds*1000;
  go("play"); grabWake();
}
function endTurn(reason, guesserId){
  stopTimer(); releaseWake();
  const g = S.game, me = g.order[g.turn], m = MODES.find(x=>x.id===g.card.mode);
  const deltas = [];
  if(reason==="guess"){ deltas.push({id:me, pts:m.pts},{id:guesserId, pts:1}); g.scores[me]+=m.pts; g.scores[guesserId]+=1; }
  g.last = {word:g.card.word, reason, deltas};
  g.endsAt = null;
  go("result");
  if(deltas.length){ buzz([30,40,30]); confetti(); sfx("correct"); }
}
function nextTurn(){
  const g = S.game;
  if(g.turn+1 < g.order.length){ g.turn++; }
  else if(g.round < g.rounds){ g.round++; g.turn=0; }
  else { g.over = true; go("final"); confetti(160); return; }
  go("pass");
}

function runTimer(){
  stopTimer();
  const g = S.game, total = g.seconds*1000, r=54, circ=2*Math.PI*r;
  const tick = () => {
    const left = Math.max(0, g.endsAt - Date.now());
    const s = Math.ceil(left/1000);
    const t = $("#tleft"), ring = $("#ring"), box = $("#timer");
    if(!t) return;
    if(t.textContent !== String(s)){ t.textContent = s; if(s<=5 && s>0) sfx("tick"); }
    ring.setAttribute("stroke-dashoffset", circ*(1-left/total));
    box.classList.toggle("low", s<=10);
    if(left<=0){ sfx("timeUp"); endTurn("time"); }
  };
  tick(); timerId = setInterval(tick, 200);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

/* ---------- Extra: wake lock, suoni, coriandoli ---------- */
async function grabWake(){ if(!ST().awake) return; try{ wake = await navigator.wakeLock?.request("screen"); }catch(e){ wake=null; } }
function releaseWake(){ try{ wake?.release(); }catch(e){} wake=null; }
function ctx(){ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); if(audio.state!=="running") audio.resume().catch(()=>{}); return audio; }
/* iPhone: con "ambient" il silenzioso zittisce l'app e non compare niente sulla Dynamic Island;
   con "playback" suona anche col silenzioso, ma iPhone mostra l'icona audio. Lo sceglie Rob nelle impostazioni. */
function setAudioSession(active){ try{ if(navigator.audioSession) navigator.audioSession.type = active && ST().silentOk ? "playback" : "ambient"; }catch(e){} }
/* iPhone: l'audio parte solo dopo un tocco */
let audioUnlocked = false, idleT = null;
function unlockAudio(){
  if(audioUnlocked) return;
  setAudioSession(true);
  try{ const a = ctx(); const b = a.createBuffer(1, 1, 22050), src = a.createBufferSource(); src.buffer = b; src.connect(a.destination); src.start(0); audioUnlocked = true; audioIdle(400); }catch(e){}
}
["pointerdown","touchend","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, {passive:true, capture:true}));
/* l'audio resta acceso solo mentre suona: finito l'effetto si spegne, così iPhone non mostra niente sulla Dynamic Island */
function audioIdle(ms){ clearTimeout(idleT); idleT = setTimeout(() => { if(!musicT && audio && audio.state === "running") audio.suspend().catch(()=>{}); }, ms); }

/* app in background o schermo spento: tutto zitto; al ritorno riparte */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){ stopMusic(); try{ audio && audio.suspend(); }catch(e){} setAudioSession(false); }
  else { if(ST().music) startMusic(); }
});
window.addEventListener("pagehide", () => { stopMusic(); try{ audio && audio.suspend(); }catch(e){} });
/* effetti sonori sintetizzati: niente file da scaricare */
function tone(f, at, dur, o = {}){
  const a = audio, t = a.currentTime + at, osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || "triangle"; osc.frequency.setValueAtTime(f, t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const peak = (o.gain || .16) * vol() + .0001;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + (o.attack || .008)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = osc;
  if(o.lp){ const fl = a.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; osc.connect(fl); node = fl; }
  node.connect(g).connect(a.destination); osc.start(t); osc.stop(t + dur + .02);
}
function noise(at, dur, o = {}){
  const a = audio, t = a.currentTime + at, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; fl.type = o.type || "bandpass"; fl.frequency.setValueAtTime(o.from || 800, t); if(o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + dur); fl.Q.value = o.q || 1;
  g.gain.setValueAtTime((o.gain || .12) * vol() + .0001, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(fl).connect(g).connect(a.destination); src.start(t); src.stop(t + dur);
}
const SFX = {
  tap(){ tone(1400, 0, .035, {type:"sine", gain:.05}); },
  open(){ tone(523, 0, .09); tone(784, .08, .14); },
  join(){ tone(660, 0, .1, {type:"sine", gain:.14}); tone(990, .09, .18, {type:"sine", gain:.14}); },
  go(){ [523,659,784,1047].forEach((f,i) => tone(f, i*.07, .14, {gain:.13})); },
  send(){ noise(0, .28, {from:500, to:3500, gain:.16}); tone(880, .18, .08, {type:"sine", gain:.08}); },
  pop(){ tone(380, 0, .12, {type:"sine", to:900, gain:.2}); tone(1200, .07, .06, {type:"sine", gain:.06}); },
  correct(){ [523,659,784].forEach((f,i) => tone(f, i*.09, .16, {gain:.15})); tone(1047, .27, .5, {gain:.16}); tone(1319, .27, .5, {type:"sine", gain:.08}); },
  wrong(){ tone(220, 0, .16, {type:"sawtooth", gain:.09, lp:900}); tone(155, .14, .3, {type:"sawtooth", gain:.1, lp:700}); },
  tick(){ tone(1800, 0, .03, {type:"square", gain:.04, lp:3000}); tone(900, 0, .05, {type:"sine", gain:.08}); },
  timeUp(){ tone(196, 0, .9, {type:"sine", gain:.2}); tone(98, 0, 1.1, {type:"triangle", gain:.12}); },
  pass(){ tone(440, 0, .12); tone(330, .1, .2); },
  sprint(){ for(let i = 0; i < 3; i++){ tone(700, i*.18, .09, {type:"square", gain:.06, lp:2500}); tone(1050, i*.18+.09, .09, {type:"square", gain:.06, lp:2500}); } },
  drumroll(d){ for(let t = 0; t < d; t += .045) noise(t, .04, {type:"highpass", from:1500, gain:.05 + .07*(t/d)}); },
  fanfare(){ [[392,0],[523,.12],[659,.24],[784,.36]].forEach(([f,t]) => tone(f, t, .14, {type:"square", gain:.06, lp:2200})); [784,988,1175].forEach(f => tone(f, .5, .8, {type:"square", gain:.05, lp:2000})); },
  sad(){ [[392,0],[370,.32],[349,.64]].forEach(([f,t]) => tone(f, t, .3, {type:"sawtooth", gain:.08, lp:1200})); tone(330, .96, .9, {type:"sawtooth", gain:.09, lp:1000, to:300}); }
};
function sfx(name, ...a){ if(!ST().sfx || !ST().volume) return; try{ ctx(); SFX[name](...a); audioIdle(name === "sad" || name === "fanfare" ? 2600 : 1500); }catch(e){ console.warn("sfx", name, e); } }
window.__sfxTest = () => Object.keys(SFX).map(k => { try{ ctx(); SFX[k](k === "drumroll" ? .5 : undefined); return k + ":ok"; }catch(e){ return k + ":" + e.message; } });
function vol(){ return ST().volume/100; }
/* vibrazione: solo Android (iPhone non la permette alle app web) */
function buzz(ms){ if(ST().vibration){ try{ navigator.vibrate?.(ms); }catch(e){} } }
function beep(freq, dur){
  if(!ST().sfx || !ST().volume) return;
  try{
    ctx();
    const o = audio.createOscillator(), gn = audio.createGain();
    o.type="triangle"; o.frequency.value=freq; gn.gain.setValueAtTime(.16*vol()+.0001, audio.currentTime);
    gn.gain.exponentialRampToValueAtTime(.001, audio.currentTime+dur);
    o.connect(gn).connect(audio.destination); o.start(); o.stop(audio.currentTime+dur);
  }catch(e){}
}
/* musica di sottofondo: giro di accordi morbido generato al volo */
let musicT = null, musicStep = 0;
const CHORDS = [[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
function musicNote(f, t, d, g){
  const o = audio.createOscillator(), gn = audio.createGain();
  o.type = "sine"; o.frequency.value = f;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(g, t+.04); gn.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(gn).connect(audio.destination); o.start(t); o.stop(t+d+.05);
}
function musicTick(){
  if(!ST().music || !ST().volume) return;
  const ch = CHORDS[Math.floor(musicStep/8)%CHORDS.length], t = audio.currentTime+.05, v = .05*vol();
  if(musicStep%8===0) musicNote(ch[0]/2, t, 2.2, v*1.2);
  musicNote(ch[[0,1,2,1,0,2,1,2][musicStep%8]]*(musicStep%4===3?2:1), t, .5, v);
  musicStep++;
}
function startMusic(){ if(musicT || !ST().music) return; try{ ctx(); musicT = setInterval(musicTick, 280); }catch(e){} }
function stopMusic(){ clearInterval(musicT); musicT = null; audioIdle(300); }
document.addEventListener("pointerdown", () => { if(ST().music && !musicT) startMusic(); });
document.addEventListener("click", e => { if(e.target.closest("button:not([disabled]):not(#b-send):not(#mp-go):not(.gtile)")) sfx("tap"); }, true);

function confetti(n=90){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio||1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const ps = Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,
    s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[Math.floor(Math.random()*COLORS.length)]}));
  let f=0;
  (function frame(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<110) requestAnimationFrame(frame); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* ---------- Render ed eventi ---------- */
function render(){
  if(!screens[S.screen] || (["pass","play","who","result","board","final"].includes(S.screen) && !S.game)) S.screen="home";
  if(S.screen==="mp" && !NET.role) S.screen="home";
  if(LOCK_ON && !isUnlocked() && S.screen!=="mp") S.screen="locked";
  const html = screens[S.screen](), k = S.screen + "|" + (S.screen === "mp" ? mpKey : "");
  if(html !== view._html){ // stessa schermata aggiornata: niente animazione di entrata, niente scatti
    const same = view._k === k; view.innerHTML = html; view._html = html; view._k = k;
    if(same && view.firstElementChild) view.firstElementChild.classList.add("still");
  }
  document.documentElement.classList.toggle("wheelmode", !!$("#wheel"));
  document.documentElement.classList.toggle("drawmode", !!$(".drawscreen"));
  if(typeof sndBtn === "function") sndBtn();
  if($("#wheel")) wheelInit();
  $("#back-btn").hidden = S.screen==="home";
  $("#menu-btn").hidden = S.screen!=="home";
  $("#board-btn").hidden = !(S.game && !S.game.over && ["pass","result"].includes(S.screen));
  $("#info-btn").hidden = !currentRulesGame();
  if(S.screen==="play"){
    if(!S.game.endsAt || S.game.endsAt < Date.now()) { S.game.endsAt = null; endTurn("time"); return; }
    runTimer();
  }
  if(S.screen==="players") setTimeout(()=>$("#player-name")?.focus(),50);
  mpAfterRender();
}

view.addEventListener("submit", e => {
  if(e.target.id==="add-form"){
    e.preventDefault();
    const inp = $("#player-name"), name = inp.value.trim();
    if(!name) return;
    if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ inp.value=""; inp.placeholder="Questo nome c'è già"; return; }
    const used = new Set(S.players.map(p=>p.color));
    const color = COLORS.find(c=>!used.has(c)) || COLORS[S.players.length%COLORS.length];
    S.players.push({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name, color});
    save(); render();
  }
});

view.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const id = b.id, d = b.dataset;
  if(d.game){ if(suppressClick){ suppressClick=false; return; } const g=CATALOG.find(x=>x.id===d.game); if(g.ready) openGame(g.id); else showPreview(g); }
  else if(d.filter){ S.filter=d.filter; save(); render(); }
  else if(d.view){ ST().wheel = d.view === "wheel"; save(); render(); window.scrollTo(0,0); }
  else if(d.people){ const k = +d.people; S.people = k === 0 ? null : Math.min(16, Math.max(2, (S.people || (k > 0 ? 3 : 5)) + k)); save(); render(); }
  else if(id==="resume"){ go(S.game.endsAt && S.game.endsAt>Date.now() ? "play" : (S.screen==="play"?"result":"pass")); }
  else if(d.del){ S.players = S.players.filter(p=>p.id!==d.del); save(); render(); }
  else if(d.rounds){ S.rounds=+d.rounds; save(); render(); }
  else if(d.seconds){ S.seconds=+d.seconds; save(); render(); }
  else if(id==="start"){ newGame(); go("pass"); }
  else if(id==="ready"){ startTurn(); }
  else if(id==="peek"){ S.game.hidden=!S.game.hidden; save(); $("#word").classList.toggle("hidden-word",S.game.hidden); b.textContent=S.game.hidden?"Mostra la parola":"Nascondi la parola"; }
  else if(id==="got"){ stopTimer(); S.game.pausedLeft = S.game.endsAt-Date.now(); go("who"); }
  else if(id==="back-play"){ S.game.endsAt = Date.now()+(S.game.pausedLeft||0); go("play"); }
  else if(d.who){ endTurn("guess", d.who); }
  else if(id==="skip"){ endTurn("skip"); }
  else if(id==="next"){ nextTurn(); }
  else if(id==="back-game"){ go(S.prev||"pass"); }
  else if(id==="ask-end"){ $("#end-slot").innerHTML = `<div class="confirm"><b>Chiudere la partita adesso?</b><span class="hint">Si va alla classifica finale con i punti attuali.</span><div class="row"><button class="btn pink" id="end-now">Sì, chiudi</button><button class="btn ghost" id="end-no">No</button></div></div>`; }
  else if(id==="end-no"){ $("#end-slot").innerHTML=""; }
  else if(id==="end-now"){ S.game.over=true; go("final"); confetti(160); }
  else if(id==="again"){ newGame(); go("pass"); }
  else if(id==="to-home"){ go("home"); }
});

  if(["ready","turn","reveal"].includes(M.phase)) it.push(["skipturn", "Salta il turno", "Nessun punto a nessuno"]);

function hostDo(a, arg){
  if(NET.role !== "host" || !M) return;

  if(a === "close" && M.phase === "turn"){ toReveal(); }
  else if(a === "reveal" && M.phase === "reveal"){ M.revealed = true; }
  else if(a === "skipdraw" && M.phase === "reveal" && M.revealed && M.view < M.queue.length){ M.view++; turnCheck(); }
  else if(a === "skipturn" && M.phase === "ready"){ M.turn++; toNextTurn(); }
  else if(a === "skipturn" && (M.phase === "turn" || M.phase === "reveal")){ mpEndTurn({reason:"skip"}); }
  else if(a === "next" && M.phase === "result"){ clearTimeout(NET.autoT); M.autoAt = null; M.turn++; toNextTurn(); }
  else if(a === "kick" && arg){ mpRemove(arg); return; }
  else if(a === "end"){ clearTimeout(NET.autoT); M.autoAt = null; M.phase = "final"; M.lineSeed = Math.floor(Math.random()*1000); }
  armTurnTimer(); publish();
}

/* aggiornamento vero: aggiorna il service worker, svuota le cache e riapre la pagina saltando la cache */
function hardReload(){
  let gone = false;
  const done = () => { if(gone) return; gone = true; const q = new URLSearchParams(location.search); q.set("v", Date.now()); location.replace(location.pathname + "?" + q); };
  const steps = [fetch(location.pathname, {cache:"reload"}).catch(()=>{})];
  if(navigator.serviceWorker) steps.push(navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{}));
  if(window.caches) steps.push(caches.keys().then(k => Promise.all(k.map(x => caches.delete(x)))).catch(()=>{}));
  Promise.all(steps).then(done, done); setTimeout(done, 3000);
}

(() => {
  let y0 = null, dy = 0, el = null;
  const ok = () => S.screen === "home" && window.scrollY <= 0 && !document.querySelector(".modal");
  const set = (d, anim) => { if(!el) return; el.style.transition = anim ? "transform .25s" : "none"; el.style.transform = `translateY(${d}px)`; el.querySelector("svg").style.transform = `rotate(${d*4}deg)`; };
  document.addEventListener("touchstart", e => {
    // mai sulla ruota o sui controlli, e solo se il dito parte dalla parte alta dello schermo
    if(!ok() || e.touches.length !== 1 || e.target.closest("#wheelwrap,.stepper,.viewsw") || e.touches[0].clientY > innerHeight * .5) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
    if(!el){ el = document.createElement("div"); el.id = "ptr"; el.setAttribute("aria-hidden","true");
      el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`;
      document.body.appendChild(el); }
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if(y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if(window.scrollY > 0){ y0 = null; set(-60, true); return; }
    set(Math.min(dy * .75, 230) - 60, false);
    el.style.opacity = Math.min(1, dy / 120);
    el.classList.toggle("armed", dy > 200);
  }, {passive:true});
  document.addEventListener("touchend", () => {
    if(y0 == null) return; y0 = null;
    if(dy > 200){ set(110, true); el.classList.add("go"); buzz(15);
      hardReload();
    } else set(-60, true);
  });
})();
