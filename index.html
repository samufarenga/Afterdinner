<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14173f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AfterDinner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AfterDinner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: una colonna da telefono, schermate a "carte" su un tavolo notturno; una sola cosa grande per volta */
:root{
  --night:#14173f; --night-2:#21266a; --night-3:#30378c;
  --paper:#fff6e6; --ink:#2a2140;
  --mango:#ffa41b; --pink:#ff3d72; --mint:#14d494; --sky:#3d8bff; --lilac:#8f63ff;
  --muted:#b3b8ea;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:22px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 15% 10%,rgba(255,181,71,.10),transparent 40%),radial-gradient(circle at 90% 85%,rgba(255,111,145,.10),transparent 45%);
  background-attachment:fixed}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:6px 16px}
.logo{grid-column:2;font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1;background:none;border:0;color:var(--paper);cursor:pointer;padding:0}
.logo .dots{display:flex;gap:6px}
.logo .dots i{width:11px;height:11px;border-radius:50%;display:block}
.logo .dots i:nth-child(1){background:var(--mango)}.logo .dots i:nth-child(2){background:var(--pink)}.logo .dots i:nth-child(3){background:var(--mint)}
.iconbtn{font:600 .9rem var(--body);color:var(--paper);background:var(--night-2);border:1px solid var(--night-3);border-radius:999px;padding:8px 14px;cursor:pointer}
.iconbtn:hover{background:var(--night-3)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2.3rem}
h2{font-size:1.6rem}
.lead{color:var(--muted);margin:6px 0 0}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--muted)}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;animation:in .28s ease-out}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* bottoni */
.btn{font:600 1.1rem var(--display);letter-spacing:.01em;border:0;border-radius:18px;padding:16px 20px;cursor:pointer;color:var(--ink);background:var(--mango);box-shadow:0 5px 0 #c2740a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c2740a}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #b8204c}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #0a9468}
.btn.ghost{background:var(--night-2);color:var(--paper);box-shadow:0 5px 0 #11152b}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stack{display:flex;flex-direction:column;gap:12px}

/* home */
.hero{padding:10px 0 4px}
.hero h1 span{color:var(--mango)}
.games{display:flex;flex-direction:column;gap:14px}
.game{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;border:0;border-radius:var(--r);padding:16px;background:var(--paper);color:var(--ink);cursor:pointer;position:relative;font:inherit}
.game .art{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:700 1.9rem var(--display);color:var(--ink)}
.game h3{font-size:1.3rem}
.game p{margin:2px 0 0;font-size:.92rem;color:#5b5272}
.game .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px;background:#f0e3cc;color:#5b4a2c}
.game.soon{background:var(--night-2);color:var(--paper);cursor:default}
.game.soon p{color:var(--muted)}
.game.soon .tag{background:var(--night-3);color:var(--muted)}
.game.soon .art{background:var(--night-3)!important;color:var(--muted)}

/* giocatori */
.field{display:flex;gap:10px}
.field input{flex:1;min-width:0;font:500 1.1rem var(--body);padding:14px 16px;border-radius:16px;border:2px solid var(--night-3);background:var(--night-2);color:var(--paper)}
.field input::placeholder{color:var(--muted)}
.field .btn{padding:14px 18px}
.players{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.player{display:flex;align-items:center;gap:12px;background:var(--night-2);border-radius:16px;padding:10px 12px}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 1.05rem var(--display);color:var(--ink)}
.player .name{flex:1;font-weight:600;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:10px}
.x:hover{color:var(--pink)}
.empty{color:var(--muted);text-align:center;padding:18px;border:2px dashed var(--night-3);border-radius:16px}
.opts{display:grid;grid-template-columns:1fr;gap:14px;background:var(--night-2);border-radius:var(--r);padding:16px}
.opt label{display:block;font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:600 1rem var(--display);padding:10px;border-radius:12px;border:2px solid var(--night-3);background:transparent;color:var(--paper);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* passa il telefono */
.pass{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:20px 0}
.pass .big-av{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font:700 3rem var(--display);color:var(--ink);box-shadow:0 0 0 10px rgba(255,255,255,.06)}
.pass h1{font-size:2.6rem}
.roundinfo{font-variant-numeric:tabular-nums}

/* carta */
.card{background:var(--paper);color:var(--ink);border-radius:28px;padding:22px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.mode{display:inline-flex;align-items:center;gap:8px;font:700 1rem var(--display);padding:7px 14px;border-radius:999px;color:var(--ink)}
.mode .pts{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 8px;font-size:.85rem}
.word{font:700 clamp(2.2rem,11vw,3.4rem) var(--display);line-height:1.05;overflow-wrap:anywhere}
.cat{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:#7a6f8f;font-weight:700}
.rule{font-size:.95rem;color:#5b5272;margin:0;max-width:34ch}
.timer{position:relative;width:132px;height:132px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font:700 2.6rem var(--display);font-variant-numeric:tabular-nums;color:var(--paper)}
.timer.low .t{color:var(--pink)}
.timer.low{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.hidden-word{filter:blur(14px);user-select:none}
.peek{font:600 .85rem var(--body);background:none;border:0;color:#7a6f8f;text-decoration:underline;cursor:pointer}

/* chi ha indovinato */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.who button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:2px solid var(--night-3);background:var(--night-2);color:var(--paper);font:600 1rem var(--body);cursor:pointer;text-align:left;min-width:0}
.who button span.n{min-width:0;overflow-wrap:anywhere}
.who button:hover{border-color:var(--mint)}
.who .av{width:32px;height:32px;font-size:.95rem}

/* esito */
.burst{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 0}
.burst .plus{font:700 3.2rem var(--display);color:var(--mint)}
.deltas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.delta{background:var(--night-2);border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700}
.delta .av{width:28px;height:28px;font-size:.85rem}
.delta b{color:var(--mint)}

/* tabellone */
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:grid;grid-template-columns:28px 38px 1fr auto;align-items:center;gap:12px;background:var(--night-2);border-radius:16px;padding:10px 14px}
.board .pos{font:700 1.1rem var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.board .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.board .bar{grid-column:3/4;height:6px;border-radius:6px;background:var(--night-3);overflow:hidden;margin-top:4px}
.board .bar i{display:block;height:100%;background:var(--mango);border-radius:6px}
.board .sc{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.board li.first{background:linear-gradient(90deg,rgba(255,181,71,.25),var(--night-2))}
.board li.first .pos{color:var(--mango)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:10px}
.pod{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .col{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:8px;font:700 1.6rem var(--display);color:var(--ink)}
.pod .nm{font-weight:700;text-align:center;overflow-wrap:anywhere;font-size:.95rem}
.pod .pts{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}

/* regole */
.rules{background:var(--night-2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.rules ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes div{border-radius:14px;padding:10px 12px;color:var(--ink);font-size:.85rem;line-height:1.3}
.modes b{display:block;font:700 1.05rem var(--display)}
.confirm{background:var(--night-2);border:2px solid var(--pink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
/* splash di apertura */
#splash{position:fixed;inset:0;z-index:100;background:var(--night);display:grid;place-items:center;cursor:pointer;animation:splashOut .45s ease-in 2.5s forwards}
#splash .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
#splash .dots{display:flex;gap:14px}
#splash .dots i{width:26px;height:26px;border-radius:50%;display:block;transform:translateY(-60px) scale(0);animation:drop .6s cubic-bezier(.3,1.6,.5,1) forwards, hop .5s ease-in-out 1.55s 2}
#splash .dots i:nth-child(1){background:var(--mango);animation-delay:.1s,1.55s}
#splash .dots i:nth-child(2){background:var(--pink);animation-delay:.25s,1.65s}
#splash .dots i:nth-child(3){background:var(--mint);animation-delay:.4s,1.75s}
#splash .name{font:700 clamp(2.4rem,12vw,3.4rem) var(--display);color:var(--paper);display:flex;letter-spacing:.01em}
#splash .name span{display:inline-block;opacity:0;transform:translateY(14px);animation:letter .35s ease-out forwards}
#splash .name span.d{color:var(--mango)}
@keyframes drop{to{transform:none}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation:splashOut .3s ease-in 1s forwards!important}#splash *{opacity:1!important;transform:none!important}}
/* home: elenco giochi */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.people{display:flex;align-items:center;gap:10px;background:var(--night-2);border:2px solid var(--night-3);border-radius:20px;padding:10px 10px 10px 16px}
.people .plabel{flex:1;font:600 1rem var(--body)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--night);border-radius:999px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--night-3);color:var(--paper);font:700 1.3rem var(--display);cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:54px;text-align:center;font:700 1.15rem var(--display)}
.pclear{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer}
.chips button{font:600 .9rem var(--body);padding:8px 14px;border-radius:999px;border:2px solid var(--night-3);background:transparent;color:var(--paper);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gitem{width:100%;display:grid;grid-template-columns:60px 1fr 18px;gap:14px;align-items:center;text-align:left;font:inherit;color:var(--paper);background:var(--night-2);border:2px solid transparent;border-radius:20px;padding:12px;cursor:pointer;transition:transform .1s,border-color .15s}
.gitem:hover{border-color:var(--night-3)}
.gitem:active{transform:scale(.98)}
.gitem:not(.locked){background:var(--paper);color:var(--ink)}
.gicon{width:60px;height:60px;border-radius:18px;background:var(--c);color:var(--ink);display:grid;place-items:center}
.gicon svg{width:32px;height:32px}
.locked .gicon{background:color-mix(in srgb,var(--c) 55%,var(--night-3));color:var(--paper)}
.gtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.gname{font:600 1.2rem var(--display);line-height:1.15}
.gdesc{font-size:.88rem;opacity:.8}
.gmeta{font-size:.75rem;font-weight:700;opacity:.6;margin-top:2px}
.soon{font:700 .62rem var(--body);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;background:var(--night-3);color:var(--muted);border-radius:999px;padding:2px 7px;vertical-align:middle}
.chev{font:700 1.6rem var(--display);opacity:.5}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,28,.7);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:in .2s ease-out}
.modal .sheet{width:100%;max-width:480px;background:var(--night-2);border:2px solid var(--night-3);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.ggrid{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.gtile{width:100%;aspect-ratio:1;max-width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;text-align:center;background:var(--c);color:var(--ink);border:0;border-radius:32px;padding:26px 22px 24px;font:inherit;cursor:pointer;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .15s}
.gtile.pressing{transform:scale(.96)}
.gtile .gname{font:700 clamp(1.7rem,8vw,2.3rem) var(--display);line-height:1.05;text-wrap:balance}
.gtile .gicon{color:var(--ink);flex:1;min-height:0;width:100%;display:grid;place-items:center;background:none;box-shadow:none;height:auto;border-radius:0}
.gtile .gicon svg{width:auto;height:78%;max-width:60%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))}
.gtile .gdesc{font-size:1rem;font-weight:500;opacity:.85;max-width:30ch;text-wrap:balance}
.gtile.locked{filter:saturate(.75) brightness(.88)}
.gtile .badge{position:static;margin-top:-2px;font:700 .66rem var(--body);text-transform:uppercase;letter-spacing:.1em;background:rgba(20,23,63,.85);color:var(--paper);border-radius:999px;padding:5px 10px}
.badges{display:flex;gap:6px;justify-content:center}
.gtile .badge.adult{background:var(--paper);color:#b0102a}
.zoom{position:fixed;z-index:90;border-radius:32px;pointer-events:none;display:grid;place-items:center;color:var(--ink);transition:all .45s cubic-bezier(.6,0,.2,1)}
.zoom svg{width:120px;height:120px;transition:transform .45s cubic-bezier(.6,0,.2,1),opacity .3s}
.zoom.fade{opacity:0;transition:opacity .3s}
html,body{overscroll-behavior-y:contain}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:max(16px,1em)}
html:has(.modal),html:has(.modal) body{overflow:hidden}
.modal{overscroll-behavior:contain}
.modal .sheet{position:relative;max-height:100%;min-height:0;flex:0 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal .sheet>h2:first-of-type{padding-right:44px}
.xclose{position:sticky;top:0;align-self:flex-end;flex:none;margin:0 -4px -40px 0;box-shadow:0 4px 14px rgba(0,0,0,.35);width:40px;height:40px;border-radius:50%;border:0;background:var(--night-3);color:var(--paper);display:grid;place-items:center;cursor:pointer;z-index:2}
.xclose svg{width:20px;height:20px}
.preview .xclose{background:rgba(20,23,63,.55)}
#ptr{position:fixed;left:50%;top:env(safe-area-inset-top,0px);z-index:95;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--night-2);border:2px solid var(--night-3);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(-60px);pointer-events:none}
#ptr svg{width:22px;height:22px;color:var(--mango)}
#ptr.armed{border-color:var(--mango)}
#ptr.go svg{animation:spin .8s linear infinite}
.hright{grid-column:3;grid-row:1;justify-self:end;display:flex;gap:8px;align-items:center}
#info-btn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
#info-btn svg{width:24px;height:24px}
.rulesheet .sheet{gap:14px}
.rulesheet h3{margin:4px 0 0;font:600 1.05rem var(--display);color:var(--mango)}
.rulesheet ol,.rulesheet ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.rulesheet .modes{margin-top:4px}
#menu-btn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
#menu-btn svg{width:22px;height:22px}
.set-list{display:flex;flex-direction:column;gap:4px;width:100%}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--night-3)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.set-row .lbl b{font-weight:700}
.set-row .lbl span{font-size:.82rem;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--night-3);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:transform .2s}
.sw:checked{background:var(--mint)}
.sw:checked::after{transform:translateX(22px)}
.set-row input[type=range]{flex:1;accent-color:var(--mango);min-width:0}

#back-btn{grid-column:1;grid-row:1;justify-self:start;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
#back-btn svg{width:22px;height:22px}

.lock{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--night-3);border:2px solid var(--night)}
.lock::after{content:"";position:absolute;left:6px;top:8px;width:6px;height:5px;border-radius:1px;background:var(--muted);box-shadow:0 -3px 0 -1px transparent}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => esc((n.trim()[0]||"?").toUpperCase());

let S = load() || fresh();
function fresh(){ return {screen:"home", players:[], rounds:2, seconds:60, game:null, settings:{...DEFAULT_SETTINGS}}; }
function load(){ try{ const v = JSON.parse(localStorage.getItem(STORE_KEY)); return v && v.players ? v : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

let timerId = null, wake = null, audio = null;
S.settings = {...DEFAULT_SETTINGS, ...(S.settings||{})};
const ST = () => S.settings;

function go(screen){ S.screen = screen; save(); render(); window.scrollTo(0,0); }
function player(id){ return S.players.find(p => p.id === id); }
function av(p, cls="av"){ return `<span class="${cls}" style="background:${p.color}">${initial(p.name)}</span>`; }

/* ---------- Schermate ---------- */
const screens = {
  home(){
    const f = S.filter || "all";
    const n = S.people || null;
    const fits = g => { if(!n) return true; const [a,b] = String(g.players).split("-").map(Number); return n >= a && n <= (b || a); };
    const list = CATALOG.filter(g => (f==="all" || (f==="one" ? g.phones!=="all" : g.phones!=="one")) && fits(g));
    const chip = (k,l) => `<button data-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
    return `
    <section class="screen">
      <div class="hero">
        <span class="eyebrow">Giochi per la serata</span>
        <h1>A cosa <span>giochiamo?</span></h1>
      </div>
      ${S.game && !S.game.over ? `<button class="btn mint" id="resume">Riprendi la partita di Lampo</button>` : ""}
      <div class="people" role="group" aria-label="Quanti siete stasera">
        <span class="plabel">Quanti siete stasera?</span>
        <div class="stepper"><button data-people="-1" aria-label="Uno in meno" ${n && n <= 2 ? "disabled" : ""}>−</button><output aria-live="polite">${n ? n : "?"}</output><button data-people="1" aria-label="Uno in più" ${n >= 16 ? "disabled" : ""}>+</button></div>
        ${n ? `<button class="pclear" data-people="0" aria-label="Mostra tutti i giochi">✕</button>` : ""}
      </div>
      <div class="chips" role="group" aria-label="Filtra i giochi">${chip("all","Tutti")}${chip("one","Un telefono")}${chip("many","Più telefoni")}</div>
      <ul class="ggrid">${list.map(g => `
        <li><button class="gtile ${g.ready?"":"locked"}" style="--c:${g.color}" data-game="${g.id}" aria-label="${g.name}${g.ready?"":", in arrivo"}">
          <span class="gname">${g.name}</span>
          <span class="gicon">${ICONS[g.icon]}</span>
          <span class="gdesc">${g.desc}</span>
          <span class="badges">${g.adult?`<span class="badge adult">18+</span>`:""}${g.ready?"":`<span class="badge">In arrivo</span>`}</span>
        </button></li>`).join("")}
      </ul>
      ${list.length ? "" : `<p class="lead" style="text-align:center">Nessun gioco adatto a ${n} persone con questo filtro. Cambia il numero o tocca ✕.</p>`}
      <p class="hint" style="text-align:center">Tieni premuto un gioco per i dettagli</p>
    </section>`;
  },

  players(){
    const list = S.players.length
      ? `<ul class="players">${S.players.map(p => `<li class="player">${av(p)}<span class="name">${esc(p.name)}</span><button class="x" data-del="${p.id}" aria-label="Togli ${esc(p.name)}">×</button></li>`).join("")}</ul>`
      : `<div class="empty">Aggiungi almeno 3 giocatori.<br>Chi è seduto al tavolo?</div>`;
    const seg = (key, vals, fmt) => `<div class="seg">${vals.map(v => `<button data-${key}="${v}" aria-pressed="${S[key]===v}">${fmt(v)}</button>`).join("")}</div>`;
    return `
    <section class="screen">
      <div><span class="eyebrow">Lampo</span><h2>Chi gioca?</h2></div>
      <form class="field" id="add-form" autocomplete="off">
        <input id="player-name" maxlength="18" placeholder="Nome del giocatore" aria-label="Nome del giocatore">
        <button class="btn" type="submit">Aggiungi</button>
      </form>
      ${list}
      <div class="opts">
        <div class="opt"><label>Giri a testa</label>${seg("rounds",[1,2,3],v=>v)}</div>
        <div class="opt"><label>Secondi per turno</label>${seg("seconds",[45,60,90],v=>v+"s")}</div>
      </div>
      <details class="rules">
        <summary><b>Come si gioca</b></summary>
        <ol>
          <li>Il telefono passa a un giocatore alla volta. Solo lui guarda lo schermo.</li>
          <li>Esce una parola e il modo in cui farla indovinare.</li>
          <li>Gli altri urlano le risposte. Chi indovina prende <b>1 punto</b>, chi la fa indovinare prende i punti della carta.</li>
          <li>Se il tempo finisce o passi, nessuno prende punti.</li>
        </ol>
        <div class="modes">${MODES.map(m=>`<div style="background:${m.color}"><b>${m.name} · ${m.pts} pt</b>${m.rule}</div>`).join("")}</div>
      </details>
      <button class="btn pink" id="start" ${S.players.length<3?"disabled":""}>Inizia la partita</button>
    </section>`;
  },

  pass(){
    const g = S.game, p = player(g.order[g.turn]);
    const total = g.order.length;
    return `
    <section class="screen pass">
      <span class="eyebrow roundinfo">Giro ${g.round} di ${g.rounds} · turno ${g.turn+1} di ${total}</span>
      ${av(p,"big-av")}
      <div><p class="lead" style="margin:0 0 6px">Passa il telefono a</p><h1>${esc(p.name)}</h1></div>
      <p class="hint">Gli altri non guardano lo schermo!</p>
      <div class="spacer"></div>
      <button class="btn" id="ready" style="width:100%">Sono ${esc(p.name)}, scopri la carta</button>
    </section>`;
  },

  play(){
    const g = S.game, c = g.card, m = MODES.find(x=>x.id===c.mode);
    const r = 54, circ = 2*Math.PI*r;
    return `
    <section class="screen">
      <div class="card">
        <span class="mode" style="background:${m.color}">${m.name} <span class="pts">${m.pts} pt</span></span>
        <span class="cat">${esc(c.cat)}</span>
        <div class="word ${g.hidden?"hidden-word":""}" id="word">${esc(c.word)}</div>
        <button class="peek" id="peek">${g.hidden?"Mostra la parola":"Nascondi la parola"}</button>
        <p class="rule">${m.rule}</p>
      </div>
      <div style="display:flex;justify-content:center">
        <div class="timer" id="timer">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--night-3)" stroke-width="10"/>
          <circle id="ring" cx="60" cy="60" r="${r}" fill="none" stroke="${m.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="0"/></svg>
          <span class="t" id="tleft">${g.seconds}</span>
        </div>
      </div>
      <div class="row">
        <button class="btn ghost" id="skip">Passo</button>
        <button class="btn mint" id="got">Indovinata!</button>
      </div>
    </section>`;
  },

  who(){
    const g = S.game, me = g.order[g.turn];
    const others = S.players.filter(p => p.id !== me);
    return `
    <section class="screen">
      <div><span class="eyebrow">Indovinata</span><h2>Chi l'ha detta per primo?</h2></div>
      <div class="who">${others.map(p=>`<button data-who="${p.id}">${av(p)}<span class="n">${esc(p.name)}</span></button>`).join("")}</div>
      <button class="btn ghost" id="back-play">Torna alla carta</button>
    </section>`;
  },

  result(){
    const g = S.game, last = g.last;
    const word = `<p class="lead">La parola era <b style="color:var(--paper)">${esc(last.word)}</b></p>`;
    const body = last.deltas.length
      ? `<div class="plus">+${last.deltas.reduce((a,d)=>a+d.pts,0)}</div><h2>Bella!</h2>${word}
         <div class="deltas">${last.deltas.map(d=>{const p=player(d.id);return `<span class="delta">${av(p)}${esc(p.name)} <b>+${d.pts}</b></span>`}).join("")}</div>`
      : `<div class="plus" style="color:var(--pink)">0</div><h2>${last.reason==="time"?"Tempo scaduto":"Carta passata"}</h2>${word}`;
    const isLast = g.turn+1 >= g.order.length && g.round >= g.rounds;
    return `
    <section class="screen">
      <div class="burst">${body}</div>
      ${boardHTML(true)}
      <div class="spacer"></div>
      <button class="btn" id="next">${isLast ? "Vedi la classifica finale" : "Prossimo turno"}</button>
    </section>`;
  },

  board(){
    return `
    <section class="screen">
      <div><span class="eyebrow">Lampo</span><h2>Tabellone</h2></div>
      ${boardHTML(false)}
      <div class="spacer"></div>
      <button class="btn" id="back-game">Torna al gioco</button>
      <button class="btn ghost" id="ask-end">Chiudi la partita</button>
      <div id="end-slot"></div>
    </section>`;
  },

  final(){
    const ranked = rank();
    const top = ranked.slice(0,3);
    const order = [top[1], top[0], top[2]].filter(Boolean);
    const h = {0:120,1:86,2:64};
    return `
    <section class="screen">
      <div style="text-align:center"><span class="eyebrow">Fine partita</span><h1>Vince ${esc(ranked[0].name)}!</h1></div>
      <div class="podium">${order.map(p=>{const i=ranked.indexOf(p);return `
        <div class="pod">${av(p)}<span class="nm">${esc(p.name)}</span><span class="pts">${S.game.scores[p.id]} pt</span>
        <div class="col" style="height:${h[i]}px;background:${p.color}">${i+1}</div></div>`}).join("")}</div>
      ${boardHTML(false)}
      <div class="row">
        <button class="btn pink" id="again">Rivincita</button>
        <button class="btn ghost" id="to-home">Home</button>
      </div>
    </section>`;
  }
};

function rank(){
  const sc = S.game.scores;
  return [...S.players].sort((a,b)=> sc[b.id]-sc[a.id] || a.name.localeCompare(b.name));
}
function boardHTML(compact){
  const ranked = rank(), sc = S.game.scores, max = Math.max(1, ...Object.values(sc));
  let pos = 0, prev = null;
  return `<ol class="board">${ranked.map((p,i)=>{ if(sc[p.id]!==prev){pos=i+1;prev=sc[p.id];}
    return `<li class="${pos===1&&sc[p.id]>0?"first":""}"><span class="pos">${pos}</span>${av(p)}
      <span><span class="nm">${esc(p.name)}</span>${compact?"":`<span class="bar" style="display:block"><i style="width:${sc[p.id]/max*100}%"></i></span>`}</span>
      <span class="sc">${sc[p.id]}</span></li>`}).join("")}</ol>`;
}

/* ---------- Logica di gioco ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newGame(){
  const deck = shuffle(Object.entries(WORDS).flatMap(([cat,ws])=>ws.map(w=>({cat,word:w}))));
  S.game = {round:1, rounds:S.rounds, seconds:S.seconds, turn:0, order:shuffle(S.players.map(p=>p.id)),
    scores:Object.fromEntries(S.players.map(p=>[p.id,0])), deck, card:null, hidden:false, endsAt:null, last:null, over:false};
}
function drawCard(){
  const g = S.game;
  if(!g.deck.length) g.deck = shuffle(Object.entries(WORDS).flatMap(([cat,ws])=>ws.map(w=>({cat,word:w}))));
  const c = g.deck.pop();
  // "Tre parole" esce più di rado, è la carta difficile
  const r = Math.random(); const mode = r<.32?"mima":r<.62?"descrivi":r<.88?"disegna":"tre";
  g.card = {...c, mode}; g.hidden = false;
}
function startTurn(){
  drawCard();
  S.game.endsAt = Date.now() + S.game.seconds*1000;
  go("play"); grabWake();
}
function endTurn(reason, guesserId){
  stopTimer(); releaseWake();
  const g = S.game, me = g.order[g.turn], m = MODES.find(x=>x.id===g.card.mode);
  const deltas = [];
  if(reason==="guess"){ deltas.push({id:me, pts:m.pts},{id:guesserId, pts:1}); g.scores[me]+=m.pts; g.scores[guesserId]+=1; }
  g.last = {word:g.card.word, reason, deltas};
  g.endsAt = null;
  go("result");
  if(deltas.length){ buzz([30,40,30]); confetti(); sfx("correct"); }
}
function nextTurn(){
  const g = S.game;
  if(g.turn+1 < g.order.length){ g.turn++; }
  else if(g.round < g.rounds){ g.round++; g.turn=0; }
  else { g.over = true; go("final"); confetti(160); return; }
  go("pass");
}

function runTimer(){
  stopTimer();
  const g = S.game, total = g.seconds*1000, r=54, circ=2*Math.PI*r;
  const tick = () => {
    const left = Math.max(0, g.endsAt - Date.now());
    const s = Math.ceil(left/1000);
    const t = $("#tleft"), ring = $("#ring"), box = $("#timer");
    if(!t) return;
    if(t.textContent !== String(s)){ t.textContent = s; if(s<=5 && s>0) sfx("tick"); }
    ring.setAttribute("stroke-dashoffset", circ*(1-left/total));
    box.classList.toggle("low", s<=10);
    if(left<=0){ sfx("timeUp"); endTurn("time"); }
  };
  tick(); timerId = setInterval(tick, 200);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

/* ---------- Extra: wake lock, suoni, coriandoli ---------- */
async function grabWake(){ if(!ST().awake) return; try{ wake = await navigator.wakeLock?.request("screen"); }catch(e){ wake=null; } }
function releaseWake(){ try{ wake?.release(); }catch(e){} wake=null; }
function ctx(){ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); if(audio.state!=="running") audio.resume().catch(()=>{}); return audio; }
/* iPhone: l'audio parte solo dopo un tocco, e la levetta del silenzioso lo zittisce a meno di chiedere la modalità "riproduzione" */
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
  try{ const a = ctx(); const b = a.createBuffer(1, 1, 22050), src = a.createBufferSource(); src.buffer = b; src.connect(a.destination); src.start(0); }catch(e){}
}
["pointerdown","touchend","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, {passive:true, capture:true}));
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && audio) audio.resume().catch(()=>{}); });
/* effetti sonori sintetizzati: niente file da scaricare */
function tone(f, at, dur, o = {}){
  const a = audio, t = a.currentTime + at, osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || "triangle"; osc.frequency.setValueAtTime(f, t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const peak = (o.gain || .16) * vol() + .0001;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + (o.attack || .008)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = osc;
  if(o.lp){ const fl = a.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; osc.connect(fl); node = fl; }
  node.connect(g).connect(a.destination); osc.start(t); osc.stop(t + dur + .02);
}
function noise(at, dur, o = {}){
  const a = audio, t = a.currentTime + at, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; fl.type = o.type || "bandpass"; fl.frequency.setValueAtTime(o.from || 800, t); if(o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + dur); fl.Q.value = o.q || 1;
  g.gain.setValueAtTime((o.gain || .12) * vol() + .0001, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(fl).connect(g).connect(a.destination); src.start(t); src.stop(t + dur);
}
const SFX = {
  tap(){ tone(1400, 0, .035, {type:"sine", gain:.05}); },
  open(){ tone(523, 0, .09); tone(784, .08, .14); },
  join(){ tone(660, 0, .1, {type:"sine", gain:.14}); tone(990, .09, .18, {type:"sine", gain:.14}); },
  go(){ [523,659,784,1047].forEach((f,i) => tone(f, i*.07, .14, {gain:.13})); },
  send(){ noise(0, .28, {from:500, to:3500, gain:.16}); tone(880, .18, .08, {type:"sine", gain:.08}); },
  pop(){ tone(380, 0, .12, {type:"sine", to:900, gain:.2}); tone(1200, .07, .06, {type:"sine", gain:.06}); },
  correct(){ [523,659,784].forEach((f,i) => tone(f, i*.09, .16, {gain:.15})); tone(1047, .27, .5, {gain:.16}); tone(1319, .27, .5, {type:"sine", gain:.08}); },
  wrong(){ tone(220, 0, .16, {type:"sawtooth", gain:.09, lp:900}); tone(155, .14, .3, {type:"sawtooth", gain:.1, lp:700}); },
  tick(){ tone(1800, 0, .03, {type:"square", gain:.04, lp:3000}); tone(900, 0, .05, {type:"sine", gain:.08}); },
  timeUp(){ tone(196, 0, .9, {type:"sine", gain:.2}); tone(98, 0, 1.1, {type:"triangle", gain:.12}); },
  pass(){ tone(440, 0, .12); tone(330, .1, .2); },
  sprint(){ for(let i = 0; i < 3; i++){ tone(700, i*.18, .09, {type:"square", gain:.06, lp:2500}); tone(1050, i*.18+.09, .09, {type:"square", gain:.06, lp:2500}); } },
  drumroll(d){ for(let t = 0; t < d; t += .045) noise(t, .04, {type:"highpass", from:1500, gain:.05 + .07*(t/d)}); },
  fanfare(){ [[392,0],[523,.12],[659,.24],[784,.36]].forEach(([f,t]) => tone(f, t, .14, {type:"square", gain:.06, lp:2200})); [784,988,1175].forEach(f => tone(f, .5, .8, {type:"square", gain:.05, lp:2000})); },
  sad(){ [[392,0],[370,.32],[349,.64]].forEach(([f,t]) => tone(f, t, .3, {type:"sawtooth", gain:.08, lp:1200})); tone(330, .96, .9, {type:"sawtooth", gain:.09, lp:1000, to:300}); }
};
function sfx(name, ...a){ if(!ST().sfx || !ST().volume) return; try{ ctx(); SFX[name](...a); }catch(e){ console.warn("sfx", name, e); } }
window.__sfxTest = () => Object.keys(SFX).map(k => { try{ ctx(); SFX[k](k === "drumroll" ? .5 : undefined); return k + ":ok"; }catch(e){ return k + ":" + e.message; } });
function vol(){ return ST().volume/100; }
function buzz(ms){ if(ST().vibration){ try{ navigator.vibrate?.(ms); }catch(e){} } }
function beep(freq, dur){
  if(!ST().sfx || !ST().volume) return;
  try{
    ctx();
    const o = audio.createOscillator(), gn = audio.createGain();
    o.type="triangle"; o.frequency.value=freq; gn.gain.setValueAtTime(.16*vol()+.0001, audio.currentTime);
    gn.gain.exponentialRampToValueAtTime(.001, audio.currentTime+dur);
    o.connect(gn).connect(audio.destination); o.start(); o.stop(audio.currentTime+dur);
  }catch(e){}
}
/* musica di sottofondo: giro di accordi morbido generato al volo */
let musicT = null, musicStep = 0;
const CHORDS = [[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
function musicNote(f, t, d, g){
  const o = audio.createOscillator(), gn = audio.createGain();
  o.type = "sine"; o.frequency.value = f;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(g, t+.04); gn.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(gn).connect(audio.destination); o.start(t); o.stop(t+d+.05);
}
function musicTick(){
  if(!ST().music || !ST().volume) return;
  const ch = CHORDS[Math.floor(musicStep/8)%CHORDS.length], t = audio.currentTime+.05, v = .05*vol();
  if(musicStep%8===0) musicNote(ch[0]/2, t, 2.2, v*1.2);
  musicNote(ch[[0,1,2,1,0,2,1,2][musicStep%8]]*(musicStep%4===3?2:1), t, .5, v);
  musicStep++;
}
function startMusic(){ if(musicT || !ST().music) return; try{ ctx(); musicT = setInterval(musicTick, 280); }catch(e){} }
function stopMusic(){ clearInterval(musicT); musicT = null; }
document.addEventListener("pointerdown", () => { if(ST().music && !musicT) startMusic(); });
document.addEventListener("click", e => { if(e.target.closest("button:not([disabled]):not(#b-send):not(#mp-go):not(.gtile)")) sfx("tap"); }, true);

function confetti(n=90){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio||1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const ps = Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,
    s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[Math.floor(Math.random()*COLORS.length)]}));
  let f=0;
  (function frame(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<110) requestAnimationFrame(frame); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* ---------- Render ed eventi ---------- */
function render(){
  if(!screens[S.screen] || (["pass","play","who","result","board","final"].includes(S.screen) && !S.game)) S.screen="home";
  if(S.screen==="mp" && !NET.role) S.screen="home";
  if(LOCK_ON && !isUnlocked() && S.screen!=="mp") S.screen="locked";
  view.innerHTML = screens[S.screen]();
  $("#back-btn").hidden = S.screen==="home";
  $("#menu-btn").hidden = S.screen!=="home";
  $("#board-btn").hidden = !(S.game && !S.game.over && ["pass","result"].includes(S.screen));
  $("#info-btn").hidden = !currentRulesGame();
  if(S.screen==="play"){

view.addEventListener("click", e => {

  else if(id==="resume"){ go(S.game.endsAt && S.game.endsAt>Date.now() ? "play" : (S.screen==="play"?"result":"pass")); }

  else if(d.rounds){ S.rounds=+d.rounds; save(); render(); }
  else if(d.seconds){ S.seconds=+d.seconds; save(); render(); }
  else if(id==="start"){ newGame(); go("pass"); }

  else if(id==="got"){ stopTimer(); S.game.pausedLeft = S.game.endsAt-Date.now(); go("who"); }
  else if(id==="back-play"){ S.game.endsAt = Date.now()+(S.game.pausedLeft||0); go("play"); }
  else if(d.who){ endTurn("guess", d.who); }
  else if(id==="skip"){ endTurn("skip"); }

  else if(id==="end-now"){ S.game.over=true; go("final"); confetti(160); }

/* =====================================================================
   MULTI-TELEFONO: stanza con QR, benvenuto per gli amici, Scarabocchi
   L'host (il tuo telefono) tiene lo stato della partita; gli altri
   telefoni si collegano al tuo con PeerJS (WebRTC, nessun account).
   Con ?local nell'indirizzo usa BroadcastChannel: utile per provare
   più schede sullo stesso computer.
   ===================================================================== */
const PEER_PREFIX = "afterdinner-v1-";
const QS = new URLSearchParams(location.search);
const USE_LOCAL = QS.has("local");
const NET = { role:null, code:null, myId:null, status:"idle", peer:null, conn:null, conns:new Map(), bc:null, name:"", info:null, turnT:null, outbox:[], lostAt:0 };
const GRACE = USE_LOCAL && QS.has("fast") ? 3000 : 60000;      // tempo per ricollegarsi prima che l'host possa togliere un giocatore

let MD = {};           // disegni del turno {idGiocatore: immagine}

function myPid(){
  if(USE_LOCAL){ try{ let id = sessionStorage.getItem("ad.pid"); if(!id){ id = "u"+Math.random().toString(36).slice(2,10); sessionStorage.setItem("ad.pid", id); } return id; }catch(e){} } // in prova ogni scheda è un giocatore diverso
  try{ let id = localStorage.getItem("ad.pid"); if(!id){ id = "u"+Math.random().toString(36).slice(2,10); localStorage.setItem("ad.pid", id); } return id; }
  catch(e){ return NET._pid || (NET._pid = "u"+Math.random().toString(36).slice(2,10)); }
}
function savedName(){ try{ return localStorage.getItem("ad.name") || ""; }catch(e){ return ""; } }
function storeName(n){ try{ localStorage.setItem("ad.name", n); }catch(e){} }
function loadScript(src, globalName){
  if(window[globalName]) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); });
}
const newCode = () => Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
const joinUrl = () => location.origin + location.pathname + "?room=" + NET.code + (USE_LOCAL ? "&local" : "");
const mpPlayer = id => M && M.players.find(p => p.id === id);
const guesserId = () => M && M.order[M.turn];
const amGuesser = () => guesserId() === NET.myId;
const cleanName = n => String(n||"").trim().slice(0,18) || "Giocatore";

/* ---------- trasporto ---------- */
async function hostOpen(){
  if(USE_LOCAL){
    NET.bc = new BroadcastChannel("ad-" + NET.code);
    NET.bc.onmessage = e => { const d = e.data; if(d.to === "host") hostReceive(d.from, d.msg); };
    NET.sendTo = (id, msg) => NET.bc.postMessage({from:"host", to:id, msg});
    NET.bc.postMessage({from:"host", to:"*", msg:{t:"rehello"}}); // dopo una riapertura chi era dentro si ripresenta
    return;
  }
  await loadScript("lib/peerjs.min.js", "Peer");
  await new Promise((res, rej) => {
    const peer = new Peer(PEER_PREFIX + NET.code); NET.peer = peer;
    peer.on("open", res);
    peer.on("error", e => { if(NET.status !== "open") rej(e); else console.warn(e); });
    peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
    peer.on("connection", conn => {
      conn.on("data", msg => { if(msg && msg.pid){ conn._pid = msg.pid; NET.conns.set(msg.pid, conn); } hostReceive(conn._pid, msg); });
      conn.on("close", () => { if(conn._pid && NET.conns.get(conn._pid) === conn){ NET.conns.delete(conn._pid); hostReceive(conn._pid, {t:"bye"}); } });
    });
  });
  NET.sendTo = (id, msg) => { const c = NET.conns.get(id); if(c && c.open) try{ c.send(msg); }catch(e){} };

  }

    try{ NET.conn && NET.conn.close(); }catch(e){}
    const conn = peer.connect(PEER_PREFIX + NET.code, {reliable:true}); NET.conn = conn;
    conn.on("open", () => {
      if(NET.conn !== conn) return;

      NET.toHost({t:"peek"}); if(NET.name) NET.toHost({t:"hello", name:NET.name});

function hostReceive(pid, msg){
  if(!M || !msg || !pid) return;

    case "peek": NET.sendTo(pid, {t:"info", host:mpPlayer(M.host).name, game:"Scarabocchi"}); break;
    case "hello": {
      // stesso nome di un giocatore scollegato: è lui che rientra da un altro "telefono"
      const ghost = !p && M.players.find(x => !x.on && x.id !== M.host && x.name.toLowerCase() === cleanName(msg.name).toLowerCase());
      if(ghost){
        const old = ghost.id; ghost.id = pid; playerBack(ghost);
        M.scores[pid] = M.scores[old]; delete M.scores[old];
        M.order = M.order.map(x => x === old ? pid : x);
        if(M.queue) M.queue = M.queue.map(x => x === old ? pid : x);
        if(MD[old]){ MD[pid] = MD[old]; delete MD[old]; }
        publish(); break;
      }
      if(!p){
        if(M.players.length >= 16){ NET.sendTo(pid, {t:"full"}); return; }
        const used = new Set(M.players.map(x => x.color));
        let nm = cleanName(msg.name), k = 2; while(M.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = cleanName(msg.name).slice(0,15) + " " + k++;
        M.players.push({id:pid, name:nm, color:COLORS.find(c => !used.has(c)) || COLORS[M.players.length % COLORS.length], on:true});
        M.scores[pid] = 0;
        if(M.phase !== "lobby") M.order.push(pid);
        sfx("join"); buzz(20);
      } else { playerBack(p); if(msg.name) p.name = cleanName(msg.name); }
      publish();
      if(Object.keys(MD).length) NET.sendTo(pid, {t:"drawings", imgs:MD});

    }
    case "bye":

    case "start":

        if(msg.skip){ M.turn++; toNextTurn(); publish(); break; }
        const c = drawWord(); M.word = c.word; M.cat = c.cat; MD = {};

        }

    case "advance": // chi indovina salta il disegno senza provare (non si torna indietro)

      }

    }
    case "pass":
      if(M.phase === "turn" && pid === guesserId()){ mpEndTurn({reason:"pass"}); publish(); } break;
    case "next":
      if(M.phase === "result" && (pid === guesserId() || pid === M.host)){

      } break;

}

function onState(s){

  if(s.phase === "turn" && prevPhase !== "turn"){ NET.lastQ = 0; NET.lastTry = 0; }
  if(s.phase === "turn" && s.tries && s.tries.length > (NET.lastTry||0)){ const t = s.tries[s.tries.length-1]; NET.lastTry = s.tries.length; if(amGuesser()) showX(t.text); else if(s.queue.includes(NET.myId)) buzz(15); }
  if(s.phase === "turn" && s.sprint && s.queue && s.queue.length === 1 && (NET.lastQ||0) === 0 && !amGuesser() && s.queue[0] !== NET.myId){ sprintAlert(); }
  if(s.phase === "turn" && s.queue && s.queue.length > (NET.lastQ||0)){ if(amGuesser()){ sfx("pop"); buzz(20); } NET.lastQ = s.queue.length; }
  if(s.phase === "turn" && prevPhase !== "turn") sfx("go");
  if(s.phase !== "turn" && prevPhase === "turn"){ if(s.last && s.last.reason === "guess") { confetti(); buzz([30,40,30]); sfx("correct"); } else if(s.last && s.last.reason === "pass") sfx("pass"); else sfx("timeUp"); }
  if(s.phase === "ready" && prevPhase !== "ready" && amGuesser()){ buzz([20,40,20]); sfx("join"); }
  const enteringFinal = s.phase === "final" && prevPhase !== "final";

  if(NET.role === "guest" && mpPlayer(NET.myId)) NET.wasIn = true;

}

const INKS = ["#1d1b2e","#ff3d72","#3d8bff","#14b886","#ffa41b"];
const PAPER = "#fffaf0";
const TICONS = (() => { const w = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  return { undo: w('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
           eraser: w('<path d="m7 21-4-4a2 2 0 0 1 0-3L13 4a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-9 9"/><path d="M7 21h14M9 10l6 6"/>'),
           trash: w('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>') }; })();
let BOARD = null;
function boardInit(){
  const cv = $("#board"); if(!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.lineCap = "round"; g.lineJoin = "round";
  BOARD = {cv, g, w:r.width, h:r.height, strokes:(BOARD && BOARD.key === mpKey) ? BOARD.strokes : [], cur:null, ink:(BOARD && BOARD.ink) || INKS[0], size:(BOARD && BOARD.size) || 5, eraser:!!(BOARD && BOARD.eraser), key:mpKey};
  boardRedraw();
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); BOARD.cur = {c:BOARD.eraser ? PAPER : BOARD.ink, s:BOARD.eraser ? 22 : BOARD.size, p:[[e.offsetX/BOARD.w, e.offsetY/BOARD.h]]}; BOARD.strokes.push(BOARD.cur); boardRedraw(); };
  cv.onpointermove = e => { if(!BOARD.cur) return; BOARD.cur.p.push([e.offsetX/BOARD.w, e.offsetY/BOARD.h]); boardRedraw(); };
  cv.onpointerup = cv.onpointercancel = () => { BOARD.cur = null; };
}
function boardPaint(g, w, h, strokes){
  g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
  strokes.forEach(st => {
    g.strokeStyle = st.c; g.lineWidth = st.s * (w/340); g.beginPath();
    st.p.forEach(([x,y], i) => i ? g.lineTo(x*w, y*h) : g.moveTo(x*w, y*h));
    if(st.p.length === 1) g.lineTo(st.p[0][0]*w + .1, st.p[0][1]*h);
    g.stroke();
  });
}
function boardRedraw(){ if(BOARD) boardPaint(BOARD.g, BOARD.w, BOARD.h, BOARD.strokes); }
function boardSnapshot(){
  if(!BOARD || !BOARD.strokes.length) return null;
  const c = document.createElement("canvas"), W = 360, H = Math.round(360 * BOARD.h / BOARD.w);
  c.width = W; c.height = H; const g = c.getContext("2d"); g.lineCap = "round"; g.lineJoin = "round";
  boardPaint(g, W, H, BOARD.strokes);
  return c.toDataURL("image/jpeg", .72);
}

  M = {game:"scarabocchi", phase:"lobby", host:NET.myId, players:[{id:NET.myId, name:cleanName(savedName() || "Host"), color:COLORS[0], on:true}],
       scores:{[NET.myId]:0}, order:[], turn:0, round:1, rounds:1, seconds:120, sprint:false, level:"medium", word:null, cat:null, last:null, queue:[], tries:[], view:0};

/* riapro la partita salvata con lo stesso codice: gli amici si ricollegano da soli */
async function mpHostResume(sv){
  mpClose();
  NET.role = "host"; NET.myId = myPid(); NET.code = sv.code; NET.status = "connecting"; NET.lobbyStep = 2; NET.inviteN = 0;
  M = sv.M; MD = sv.MD || {}; NET.deck = sv.deck; NET.deckLevel = sv.deckLevel;
  if(M.host !== NET.myId){ const h = mpPlayer(M.host); if(h) h.id = NET.myId; M.scores[NET.myId] = M.scores[M.host]; M.order = M.order.map(x => x === M.host ? NET.myId : x); M.host = NET.myId; }
  M.players.forEach(p => { if(p.id !== NET.myId && p.on){ p.on = false; p.offAt = Date.now(); } });
  if(M.phase === "turn" && M.paused == null) M.endsAt = Date.now() + Math.max(15000, sv.M.endsAt - sv.at); // il tempo era fermo mentre l'app era chiusa
  prevPhase = M.phase;

        <ol class="podium-list">${podium.map((p,i) => `<li class="rv pod-${medal[pos(p)-1] || ""}" style="animation-delay:${step(.8)}s">
          <span class="pnum">${pos(p)}°</span>${av(p)}<span class="pname">${esc(p.name)}${p.id===NET.myId?" (tu)":""}</span><span class="ppts">${M.scores[p.id]} pt</span></li>`).join("")}</ol>
        ${middle.length ? `<ol class="mid-list">${middle.map(p => `<li class="rv" style="animation-delay:${step(.25)}s"><span class="pnum">${pos(p)}°</span>${av(p)}<span class="pname">${esc(p.name)}${p.id===NET.myId?" (tu)":""}</span><span class="ppts">${M.scores[p.id]}</span></li>`).join("")}</ol>` : ""}
        ${last ? `<div class="last rv" style="animation-delay:${NET.finalLastAt = step(.6)+.4}s"><span class="eyebrow">Ultimo posto</span><div class="lastrow">${av(last)}<span class="pname">${esc(last.name)}</span><span class="ppts">${M.scores[last.id]} pt</span></div><p class="quip">${line}</p></div>` : ""}
        <div class="rv" style="animation-delay:${step(.3)+.4}s">${NET.role === "host" ? `<div class="row"><button class="btn pink" id="mp-again">Rivincita</button><button class="btn ghost" id="mp-exit">Chiudi la stanza</button></div>` : `<p class="hint" style="text-align:center">Se ${esc(mpPlayer(M.host).name)} lancia la rivincita, si riparte da qui.</p>`}</div>

function mpRender(force){
  if(S.screen !== "mp") return;
  const drawing = M && M.phase === "turn" && !amGuesser() && !(M.queue||[]).includes(NET.myId);
  const guessing = M && M.phase === "turn" && amGuesser(), cur = guessing ? M.queue[M.view] : null;
  const key = M ? [M.phase, M.turn, M.round, amGuesser(), drawing, guessing ? M.view + "/" + (cur && MD[cur] ? 1 : 0) : ""].join("|") : "none";
  // mentre disegni (o scrivi la risposta) non ridisegno la pagina, altrimenti si cancellerebbe la lavagna
  if(!force && key === mpKey && (drawing || guessing)){ const q = $("#qcount"); if(guessing && q){ const h = guessInfo(); if(q.innerHTML !== h) q.innerHTML = h; } return; }
  if(drawing && key !== mpKey) BOARD = null;
  mpKey = key;
  render();
}
function mpAfterRender(){
  if(S.screen !== "mp") return;
  $("#board-btn").hidden = true;
  if(NET.role === "guest"){ $("#back-btn").hidden = true; $("#menu-btn").hidden = true; }

    mpTick = setInterval(() => {
      const el = $("#mptime"); const s = M && M.paused != null ? Math.ceil(M.paused/1000) : Math.max(0, Math.ceil((mpEndsLocal - Date.now())/1000));
      if(el && el.textContent !== String(s)){ el.textContent = s; el.classList.toggle("low", s <= 10); if(s <= 5 && s > 0 && !(M && M.paused != null)) sfx("tick"); }
    }, 200);
  }
}

/* ---------- lucchetto da host: senza invito l'app pubblicata chiede il PIN ---------- */
const PIN_HASH = "318aee3fed8c9d040d35a7fc1fa776fb31303833aa2de885354ddf3d44d8fb69"; // SHA-256 del PIN dell'host; vuoto = nessun lucchetto
const LOCK_ON = !!PIN_HASH && /github\.io$/.test(location.hostname);
function isUnlocked(){ try{ return localStorage.getItem("ad.host") === PIN_HASH; }catch(e){ return false; } }
async function sha256(t){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
  // ripiego per i browser senza crypto.subtle
  const K = [], H = [], isP = n => { for(let f = 2; f*f <= n; f++) if(n % f === 0) return false; return true; };
  for(let n = 2, i = 0; i < 64; n++) if(isP(n)){ if(i < 8) H[i] = (Math.pow(n, 1/2) * 2**32) | 0; K[i++] = (Math.pow(n, 1/3) * 2**32) | 0; }
  const bytes = [...new TextEncoder().encode(t)], l = bytes.length * 8; bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i*8)) & 255);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for(let o = 0; o < bytes.length; o += 64){
    const w = []; for(let i = 0; i < 16; i++) w[i] = (bytes[o+4*i] << 24) | (bytes[o+4*i+1] << 16) | (bytes[o+4*i+2] << 8) | bytes[o+4*i+3];
    for(let i = 16; i < 64; i++){ const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3), s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i = 0; i < 64; i++){ const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
    [a,b,c,d,e,f,g,h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}
