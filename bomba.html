<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140904">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Bomba · AfterDinner</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{
  --bg0:#140904; --bg1:#2a1206; --or:#ff7a2e; --or2:#ff9a3c; --amber:#ffc24d; --red:#ff3b2f; --green:#2fd27a;
  --paper:#fff6ee; --muted:rgba(255,236,220,.68); --line:rgba(255,200,160,.18); --glass:rgba(255,255,255,.06);
  --display:"Fredoka",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif; --g:16px; --r:22px;
  --spd:1.4s;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
[hidden]{display:none!important}

/* ---------- sfondo ---------- */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:radial-gradient(130% 85% at 50% 115%,#4a1a06,var(--bg0) 72%)}
#bg .glow{position:absolute;border-radius:50%;filter:blur(70px);background:#c2410c;opacity:.35;animation:breathe 7s ease-in-out infinite}
#bg .glow:nth-child(1){width:80vw;height:80vw;left:-25vw;bottom:-30vw}
#bg .glow:nth-child(2){width:70vw;height:70vw;right:-25vw;bottom:-15vw;animation-delay:-3s}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(1.15);opacity:.5}}
#bg .spark{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#ffd28a;box-shadow:0 0 8px 2px #ff7a2e;opacity:0;animation:rise 9s linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx,20px),-105vh) scale(.3);opacity:0}}
/* chi ha la bomba: lo schermo pulsa sui toni dell'arancione */
#hot{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(120% 90% at 50% 55%,#ff9a3c 0%,#ff6a1a 38%,#b33a06 72%,#4a1404 100%)}
body[data-mode="hot"] #hot{opacity:1;animation:hotpulse var(--spd) ease-in-out infinite}
@keyframes hotpulse{0%,100%{filter:brightness(.78) saturate(1)}50%{filter:brightness(1.12) saturate(1.25)}}
body[data-mode="hot"] #bg{opacity:0}
body[data-heat="1"]{--spd:1.1s}body[data-heat="2"]{--spd:.8s}body[data-heat="3"]{--spd:.55s}
/* a chi è esplosa resta il rosso */
#red{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(120% 90% at 50% 50%,#ff3b2f,#a10e08 55%,#3a0402)}
body[data-mode="dead"] #red{opacity:1}
body[data-mode="dead"] #bg{opacity:0}

#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--g) calc(env(safe-area-inset-bottom,0px) + 18px)}
.screen{flex:1;display:flex;flex-direction:column;gap:16px}
.center{justify-content:center;text-align:center}
.grow{flex:1}
#app[data-fresh="1"] .in{animation:enter .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*80ms)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- barra in alto ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.brand .ic{width:28px;height:28px}
.tools{display:flex;justify-content:flex-end;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--display);font-weight:700;display:grid;place-items:center;transition:transform .15s}
.ib:active{transform:scale(.9)}
.ib .ic{width:20px;height:20px}
.fuses{display:flex;gap:4px;align-items:center}
.fuses i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14)}
.fuses i.done{background:var(--or)}
.fuses i.now{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}

/* ---------- testi ---------- */
.eyebrow{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--or2)}
.big{font-size:clamp(1.9rem,8vw,2.5rem)}
.lead{color:var(--muted);margin:0}
.hint{color:var(--muted);font-size:.92rem;margin:0;text-align:center}
.lbl{font-family:var(--display);font-weight:600;font-size:.95rem;margin:0 0 8px}

/* ---------- pulsanti ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 18px;border:0;border-radius:18px;width:100%;
  font-family:var(--display);font-weight:600;font-size:1.08rem;color:#2a0e00;
  background:linear-gradient(180deg,#ffb04d,#ff6a1a);box-shadow:0 12px 26px -12px rgba(255,110,30,.9),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s cubic-bezier(.2,.8,.2,1),opacity .2s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{color:var(--paper);background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{color:#ffb3a8;background:var(--glass);box-shadow:inset 0 0 0 1.5px rgba(255,80,60,.5)}
.btn[disabled]{opacity:.4;filter:saturate(.4);pointer-events:none}
.btn.pulse{animation:bpulse 1.8s ease-in-out infinite}
@keyframes bpulse{50%{box-shadow:0 12px 34px -4px rgba(255,120,30,1),inset 0 1px 0 rgba(255,255,255,.45)}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.opt{border:0;border-radius:18px;padding:12px 10px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s,background .25s,box-shadow .25s}
.opt:active{transform:scale(.96)}
.opt b{font-family:var(--display);font-weight:600;font-size:1rem}
.opt small{color:var(--muted);font-size:.78rem;line-height:1.25}
.opt.on{background:linear-gradient(180deg,rgba(255,140,50,.32),rgba(255,90,20,.18));box-shadow:inset 0 0 0 2px var(--or),0 10px 24px -14px var(--or)}
.field{width:100%;min-height:56px;border-radius:18px;border:0;padding:0 18px;font:600 1.3rem var(--display);color:var(--paper);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px var(--line);outline:none;text-align:center}
.field:focus{box-shadow:inset 0 0 0 2px var(--or),0 0 0 4px rgba(255,122,46,.18)}
.field.l{text-align:left;font-size:1.05rem}
.panel{border-radius:var(--r);padding:16px;background:rgba(30,12,4,.55);box-shadow:inset 0 0 0 1.5px var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.av{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.9rem;background:var(--c);color:#2a0e00;flex:none}

/* ---------- QR ---------- */
.qr{width:min(60vw,220px);aspect-ratio:1;margin:0 auto;border-radius:24px;background:#fff;padding:12px;box-shadow:0 0 0 6px rgba(255,122,46,.35),0 24px 50px -18px rgba(255,110,30,.8);display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.code{font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:1.3rem;text-align:center}

/* ---------- il tavolo (posti in cerchio) ---------- */
.table{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
.table.mini{width:min(78vw,250px)}
.table .wood{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6b3412,#3a1a08 70%);box-shadow:inset 0 0 0 3px rgba(255,180,120,.15),0 20px 40px -20px #000}
.table .dir{position:absolute;inset:14%;color:rgba(255,200,150,.28)}
.seat{position:absolute;left:calc(50% + var(--x)*41%);top:calc(50% + var(--y)*41%);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;transition:left .5s cubic-bezier(.3,.8,.2,1),top .5s cubic-bezier(.3,.8,.2,1)}
.seat .av{width:40px;height:40px;font-size:1.05rem;box-shadow:0 0 0 3px rgba(20,9,4,.9);transition:transform .25s,box-shadow .25s}
.table.mini .seat .av{width:34px;height:34px;font-size:.92rem}
.seat b{font-family:var(--display);font-weight:600;font-size:.74rem;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 6px;border-radius:99px;background:rgba(20,9,4,.7)}
.seat.tappable{cursor:pointer;touch-action:manipulation;padding:6px;margin:-6px}
.seat.tappable .av{box-shadow:0 0 0 3px rgba(20,9,4,.9),0 0 0 5px rgba(255,194,77,.35)}
.seat.sel .av{transform:scale(1.2);box-shadow:0 0 0 3px var(--amber),0 0 22px var(--amber);animation:selp 1s ease-in-out infinite}
@keyframes selp{50%{transform:scale(1.32)}}
.seat.sel b{background:var(--amber);color:#2a0e00}
.seat.swapped .av{animation:swp .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes swp{0%{transform:scale(.4) rotate(-180deg)}100%{transform:none}}
.swaphint{margin:8px 0 0;text-align:center;font:600 .95rem var(--display);color:var(--muted);transition:color .2s}
.swaphint.on{color:var(--amber)}
.swaphint b{color:#fff}
.seat.me b{color:var(--amber)}
.seat.off{opacity:.4}
.seat.hold .av{box-shadow:0 0 0 3px var(--or),0 0 22px var(--or)}
.seat.next .av{box-shadow:0 0 0 3px rgba(255,194,77,.7)}
.seat .k{position:absolute;top:-6px;right:-8px;font:700 .7rem var(--display);background:var(--or);color:#2a0e00;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.tbomb{position:absolute;width:44px;height:44px;left:calc(50% + var(--x)*20%);top:calc(50% + var(--y)*20%);transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.3,1.4,.4,1),top .45s cubic-bezier(.3,1.4,.4,1)}
.tbomb .bombsvg{width:100%;height:100%;animation:shake .5s linear infinite}

/* ---------- la bomba ---------- */
.bombsvg{display:block;overflow:visible}
.bombsvg .spk{transform-origin:center;transform-box:fill-box;animation:spark .18s linear infinite alternate}
@keyframes spark{from{transform:scale(.7) rotate(0)}to{transform:scale(1.25) rotate(40deg)}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(calc(var(--amp,1)*-1px),calc(var(--amp,1)*1px)) rotate(calc(var(--amp,1)*-.6deg))}50%{transform:translate(calc(var(--amp,1)*1px),calc(var(--amp,1)*-1px)) rotate(0)}75%{transform:translate(calc(var(--amp,1)*1px),calc(var(--amp,1)*1px)) rotate(calc(var(--amp,1)*.6deg))}}
.hero{width:min(58vw,240px);margin:0 auto;position:relative}
.hero .bombsvg{width:100%;height:auto;animation:shake .32s linear infinite;filter:drop-shadow(0 24px 30px rgba(60,10,0,.55))}
body[data-heat="0"] .hero{--amp:1.5}body[data-heat="1"] .hero{--amp:3}body[data-heat="2"] .hero{--amp:5}body[data-heat="3"] .hero{--amp:8}
.hero.small{width:min(30vw,120px)}

/* sillaba */
.syl{font:700 clamp(3.6rem,22vw,6rem) var(--display);letter-spacing:.06em;line-height:1;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(120,30,0,.45),0 0 40px rgba(255,160,60,.55)}
#app[data-sylnew="1"] .syl{animation:sylIn .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sylIn{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.sylbox{border-radius:28px;padding:18px 10px 14px;background:rgba(20,9,4,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.sylbox small{display:block;text-align:center;font:600 .8rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,246,238,.75);margin-bottom:6px}
body[data-mode="hot"] .sylbox{background:rgba(70,20,0,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.say{text-align:center;font:600 1.15rem var(--display);margin:0}
.say small{display:block;font:500 .92rem var(--body);opacity:.85;margin-top:4px}
.tapzone{position:fixed;inset:0;z-index:2;border:0;background:transparent;padding:0}
.holder{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:99px;background:rgba(255,122,46,.18);box-shadow:inset 0 0 0 1.5px var(--or);font:600 1.05rem var(--display);margin:0 auto}
.holder .av{width:34px;height:34px}
.ready{text-align:center;font:700 1.25rem var(--display);color:var(--amber);animation:blink 1s ease-in-out infinite}


/* ---------- schermata di gioco: pulita, tutta touch ---------- */
.screen.play{gap:0}
.band{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:48px;padding:4px 4px 4px 12px;border-radius:99px;background:rgba(20,8,2,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mark{font:700 1.02rem var(--display);letter-spacing:-.01em;white-space:nowrap}
.mark span{color:var(--or2)}
body[data-mode="hot"] .mark span{color:#fff3c4}
.mine{display:flex;align-items:center;gap:6px;font-family:var(--display);padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.mine .ic{width:20px;height:20px}
.mine b{font-weight:700;font-size:1rem}
.mine i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;margin:0 2px}
.mine small{font-size:.75rem;opacity:.7}
.pz{justify-self:end;width:40px;height:40px;background:rgba(255,255,255,.12)}
.pz .ic{width:22px;height:22px}
.pz.ghosted{opacity:0}
.stagec{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:6vh}
.rule{font:600 .95rem var(--display);letter-spacing:.14em;text-transform:uppercase;padding:7px 16px;border-radius:99px;background:rgba(20,8,2,.3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.sylrow{display:flex;align-items:baseline;justify-content:center;gap:.14em;font:700 clamp(4rem,24vw,7rem) var(--display);line-height:1;max-width:100%}
.sylrow.long{font-size:clamp(3rem,17vw,5.4rem)}
.sylrow .syl{font:inherit;letter-spacing:.04em}
.gap{display:inline-flex;gap:.1em;align-items:flex-end;height:.9em;padding-bottom:.02em}
.gap i{display:block;width:.28em;height:.08em;border-radius:.04em;background:currentColor;opacity:.45}
.foot{position:relative;z-index:1;text-align:center;margin:0;font:600 1.05rem var(--display);opacity:.9;min-height:2.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.foot small{font:500 .88rem var(--body);opacity:.85}
.foot .ic{width:22px;height:22px;margin-right:4px}
.foot.ready{color:var(--amber);animation:blink 1s ease-in-out infinite}
.turnban{align-self:center;margin-top:14px;padding:8px 18px;border-radius:99px;font:600 1rem var(--display);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.turnban b{color:var(--or2)}
.turnban.me{background:rgba(70,20,0,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.turnban.soon{color:#2a0e00;background:linear-gradient(180deg,#ffd27a,#ffb04d);box-shadow:0 0 24px -4px var(--amber);animation:soon 1s ease-in-out infinite}
@keyframes soon{50%{transform:scale(1.05);box-shadow:0 0 34px 0 var(--amber)}}
.pbig{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px var(--line)}
.pbig .ic{width:40px;height:40px;color:var(--or2)}
.wheelbox{position:relative;height:260px;margin:0 auto;max-width:320px}
.wheelbox::before{content:"";position:absolute;left:0;right:0;top:50%;height:52px;margin-top:-26px;border-radius:16px;background:rgba(255,122,46,.18);box-shadow:inset 0 0 0 2px var(--or);pointer-events:none}
.wheel{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:calc((260px - 52px)/2) 0;scrollbar-width:none;-webkit-mask:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);mask:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wi{height:52px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;gap:10px;font:600 1.1rem var(--display);opacity:.55;transition:opacity .2s,transform .2s}
.wi.on{opacity:1;transform:scale(1.06)}
.wi.off{text-decoration:line-through}
.wi em{font:500 .75rem var(--body);font-style:normal;color:var(--amber)}

/* ---------- recap e classifica ---------- */
.scroller{overflow:hidden;position:relative;border-radius:18px;max-height:calc(100dvh - 330px);min-height:120px;-webkit-mask:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);mask:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
.scroller.free{overflow-y:auto}
.rank{list-style:none;margin:0;padding:10px 0 18px;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(30,12,4,.6);box-shadow:inset 0 0 0 1px var(--line)}
#app[data-fresh="1"] .rank li{animation:drop .55s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--d,0)*110ms + 150ms)}
@keyframes drop{from{opacity:0;transform:translateY(-26px) scaleY(.7)}}
.rank .pos{width:1.5em;text-align:center;font:700 1rem var(--display);color:var(--muted)}
.rank .nm{flex:1;min-width:0;font:600 1rem var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{display:block;font:500 .78rem var(--body);color:var(--amber);white-space:normal}
.rank li.just{background:linear-gradient(90deg,rgba(255,59,47,.35),rgba(255,122,46,.15));box-shadow:inset 0 0 0 1.5px var(--red)}
.rank li.win{background:linear-gradient(90deg,rgba(255,194,77,.25),rgba(255,122,46,.12));box-shadow:inset 0 0 0 1.5px var(--amber)}
.rank li.lose{background:linear-gradient(90deg,rgba(255,59,47,.3),rgba(120,10,4,.2));box-shadow:inset 0 0 0 1.5px var(--red)}
.bombs{display:flex;align-items:center;gap:1px;flex:none}
.bombs .ic{width:22px;height:22px}
.bombs .zero{font:600 .85rem var(--display);color:var(--muted)}
.bombs b{font:700 1rem var(--display);margin-left:4px;color:var(--or2)}
.bombs .ic.new{animation:newb .9s cubic-bezier(.2,1.6,.4,1) both .9s}
@keyframes newb{from{transform:scale(3) rotate(-30deg);opacity:0}}
.ic.crown{display:block;margin:0 auto;width:54px;height:54px;color:var(--amber);animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-4deg)}}
.mean{font:600 1.02rem var(--display);text-align:center;color:#ffd0c4;margin:0}
.mean b{color:#fff}

/* ---------- emblema e regole ---------- */
.emblem{width:140px;height:140px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ffb04d,#ff6a1a 55%,#7a2405);box-shadow:0 0 0 8px rgba(255,122,46,.18),0 0 60px rgba(255,110,30,.6);animation:float 4s ease-in-out infinite}
.emblem .bombsvg{width:66%;height:66%;animation:shake .5s linear infinite}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;text-align:left}
.rules li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--glass)}
.rules li .ic{width:22px;height:22px;flex:none;color:var(--or2);margin-top:1px}

/* ---------- effetti ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:rgba(30,12,4,.92);box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--display);font-weight:600;animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
/* passaggio riuscito: lampo verde */
.okflash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#4af09a,#1fae5f 60%,#0a5a2e);animation:okf .75s ease-out forwards}
.okflash .ic{width:34vw;max-width:150px;height:auto;color:#fff;filter:drop-shadow(0 6px 18px rgba(0,60,20,.5));animation:okc .75s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes okf{0%{opacity:0}15%{opacity:1}60%{opacity:.95}100%{opacity:0}}
@keyframes okc{0%{transform:scale(.3)}40%{transform:scale(1.1)}100%{transform:scale(1.25);opacity:.2}}
.passfly{position:fixed;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;animation:passfly .7s cubic-bezier(.5,0,.4,1) forwards}
@keyframes passfly{0%{transform:scale(1.4)}100%{transform:translate(var(--tx),var(--ty)) scale(.4) rotate(540deg);opacity:0}}
/* accensione della miccia */
.lightup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,9,4,.85);animation:ovl 1.6s ease forwards}
.lightup b{font:700 clamp(2.2rem,11vw,3.4rem) var(--display);color:var(--amber);text-shadow:0 0 30px var(--or)}
.lightup .bombsvg{width:110px;height:110px;animation:shake .3s linear infinite}
@keyframes ovl{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}

/* ---------- ESPLOSIONE ---------- */
.boom{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center;animation:boomBg 3.6s ease forwards}
@keyframes boomBg{0%{background:rgba(20,9,4,.0)}12%{background:rgba(20,9,4,.85)}20%{background:#fff}26%{background:#ffd24d}40%{background:#ff5a1f}70%{background:#7a0e04}100%{background:rgba(58,4,2,0)}}
.boom .core{position:absolute;left:50%;top:44%;width:0;height:0}
.boom .bm{position:absolute;width:150px;height:150px;left:-75px;top:-75px;animation:bmSwell .75s cubic-bezier(.5,0,1,.5) forwards}
.boom .bm .bombsvg{width:100%;height:100%;animation:shake .07s linear infinite;--amp:6}
@keyframes bmSwell{0%{transform:scale(1)}85%{transform:scale(1.5);filter:brightness(1.4)}100%{transform:scale(1.9);opacity:0;filter:brightness(3)}}
.boom .flash{position:absolute;width:40px;height:40px;left:-20px;top:-20px;border-radius:50%;background:radial-gradient(circle,#fff,#fff6c2 35%,#ffb02e 60%,rgba(255,80,20,0) 72%);opacity:0;animation:flash 1.1s ease-out forwards .7s}
@keyframes flash{0%{transform:scale(.2);opacity:1}35%{opacity:1}100%{transform:scale(32);opacity:0}}
.boom .ring{position:absolute;width:60px;height:60px;left:-30px;top:-30px;border-radius:50%;border:6px solid rgba(255,230,180,.9);opacity:0;animation:ring 1.1s cubic-bezier(.1,.7,.3,1) forwards;animation-delay:var(--t)}
@keyframes ring{0%{transform:scale(.3);opacity:1;border-width:10px}100%{transform:scale(13);opacity:0;border-width:1px}}
.boom .ball{position:absolute;width:300px;height:300px;left:-150px;top:-150px;border-radius:50%;opacity:0;filter:blur(6px);
  background:radial-gradient(circle,#fff 0,#fff3b0 18%,#ffc23d 34%,#ff6a1a 52%,rgba(196,29,8,.7) 66%,rgba(120,10,0,0) 74%);animation:ball 1.5s cubic-bezier(.1,.8,.3,1) forwards .7s}
@keyframes ball{0%{transform:scale(.05);opacity:1}30%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.boom .fire{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2);border-radius:50%;filter:blur(3px);mix-blend-mode:screen;
  background:radial-gradient(circle,#fffbe0 0,#ffd24d 22%,#ff7a1f 48%,rgba(210,40,8,.55) 66%,rgba(150,15,0,0) 72%);opacity:0;animation:fire var(--dur) cubic-bezier(.1,.8,.3,1) forwards .72s}
@keyframes fire{0%{transform:translate(0,0) scale(.2);opacity:1}55%{opacity:.95}100%{transform:translate(var(--x),var(--y)) scale(1.8);opacity:0}}
.boom .ember{position:absolute;width:5px;height:5px;left:-2px;top:-2px;border-radius:50%;background:#fff1a8;box-shadow:0 0 8px 3px #ff9a3c;opacity:0;animation:emb 1.4s cubic-bezier(.1,.7,.4,1) forwards .74s}
@keyframes emb{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 120px));opacity:0}}
.boom .deb{position:absolute;width:var(--s);height:calc(var(--s)*.6);left:0;top:0;border-radius:3px;background:#2a160c;box-shadow:inset 0 0 0 1px #5a3018;opacity:0;animation:deb 1.6s cubic-bezier(.15,.6,.4,1) forwards .74s}
@keyframes deb{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r));opacity:0}}
.boom .smoke{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle,rgba(70,50,40,.85),rgba(40,28,22,0) 70%);opacity:0;animation:smoke 2.6s ease-out forwards;animation-delay:var(--t)}
@keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.9}100%{transform:translate(var(--x),var(--y)) scale(2.4);opacity:0}}
.boom .word{position:absolute;left:0;right:0;top:56%;text-align:center;font:700 clamp(4.4rem,25vw,7.5rem) var(--display);color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:3px #7a0e04;text-shadow:0 6px 0 #7a0e04,0 0 40px #ff5a1f;opacity:0;animation:word 2.8s cubic-bezier(.2,1.5,.4,1) forwards .82s}
@keyframes word{0%{transform:scale(3) rotate(-12deg);opacity:0}14%{transform:scale(1) rotate(-6deg);opacity:1}20%{transform:scale(1.08) rotate(-5deg)}80%{opacity:1}100%{transform:scale(1.15) rotate(-5deg);opacity:0}}
.boom .who{position:absolute;left:var(--g);right:var(--g);top:calc(56% + clamp(5rem,26vw,8rem));text-align:center;font:600 1.35rem var(--display);color:#fff;opacity:0;animation:who 2.4s ease forwards 1.25s}
@keyframes who{0%{opacity:0;transform:translateY(12px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.shake{animation:scrShake .6s cubic-bezier(.36,.07,.19,.97) both .72s}
@keyframes scrShake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}}

/* ---------- foglio regole / menu ---------- */
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(10,4,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px var(--g) calc(env(safe-area-inset-bottom,0px) + 22px);background:linear-gradient(180deg,#3a1a08,#1c0c04);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);animation:up .4s cubic-bezier(.2,.9,.2,1) both;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(100%)}}
.sheet p,.sheet li{color:var(--muted)}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet b{color:var(--paper)}

.ic{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;flex:none;overflow:visible}
.btn .ic{width:1.3em;height:1.3em}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .boom{animation:none;background:#7a0e04}
  .boom .word,.boom .who{opacity:1;animation:none}
}
</style>
</head>
<body data-mode="calm" data-heat="0">
<div id="bg" aria-hidden="true"><div class="glow"></div><div class="glow"></div></div>
<div id="hot" aria-hidden="true"></div>
<div id="red" aria-hidden="true"></div>
<main id="app"></main>
<div id="fx" aria-hidden="true"></div>
<script>
"use strict";
/* =====================================================================
   BOMBA: la bomba passa di telefono in telefono (nessuno si passa il
   telefono vero). Tutti vedono la stessa sillaba; chi ha la bomba dice
   ad alta voce una parola che la contiene e tocca lo schermo per passarla.
   Il timer è nascosto e vive solo sull'host. Stanza PeerJS con QR come
   Porcellino; ?local per provare con più schede sullo stesso computer.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QS = new URLSearchParams(location.search);
const USE_LOCAL = QS.has("local");
const ROOM = (QS.get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
const PEER_PREFIX = "afterdinner-bomba-v1-";
const PIN_HASH = "318aee3fed8c9d040d35a7fc1fa776fb31303833aa2de885354ddf3d44d8fb69"; // come in index.html
const LOCK_ON = !!PIN_HASH && /github\.io$/.test(location.hostname);
const SAVE_KEY = "ad.bomba", SAVE_TTL = 3 * 3600e3;
const MIN_P = 3, MAX_P = 12;
const TURN_BANNER = true; // scritta «Tocca a…» / «Sta per arrivare il tuo turno»: in prova, false per toglierla
const FAST = USE_LOCAL && QS.has("fast"); // solo per le prove
const FUSE_MIN = FAST ? 5000 : 15000, FUSE_MAX = FAST ? 7000 : 50000, LIGHT_MS = 1600, BOOM_MS = 3700;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const app = $("#app");

/* ---------- disegni (niente emoji della tastiera) ---------- */
let bombN = 0;
function bombSVG(spark = true){
  const g = "bg" + (++bombN);
  return `<svg class="bombsvg" viewBox="0 0 120 120" aria-hidden="true">
    <defs><radialGradient id="${g}" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#6a6f80"/><stop offset=".35" stop-color="#2b2e3a"/><stop offset="1" stop-color="#0b0c12"/></radialGradient></defs>
    <path d="M70 30c6-12 16-16 26-12" fill="none" stroke="#c9a46a" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 30c6-12 16-16 26-12" fill="none" stroke="#7a5a2e" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 5"/>
    <rect x="52" y="25" width="22" height="16" rx="4" transform="rotate(28 63 33)" fill="#3a3d4a" stroke="#0b0c12" stroke-width="2"/>
    <circle cx="54" cy="70" r="38" fill="url(#${g})"/>
    <ellipse cx="40" cy="54" rx="11" ry="7" transform="rotate(-35 40 54)" fill="#fff" opacity=".28"/>
    <circle cx="33" cy="64" r="3" fill="#fff" opacity=".18"/>
    ${spark ? `<g class="spk"><path d="M97 3l3 9 9-4-5 8 9 4-9 2 3 9-8-6-5 8-1-9-9 1 7-6-6-7 9 1z" fill="#ffd24d"/><circle cx="97" cy="17" r="4" fill="#fff"/></g>` : ""}
  </svg>`;
}
const sv = (cls, body, vb = "0 0 24 24") => `<svg class="ic i-${cls}" viewBox="${vb}" aria-hidden="true">${body}</svg>`;
const STK = 'fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
const I = {
  bomb: sv("bomb", `<circle cx="10.5" cy="14" r="7.5" fill="#22242e"/><ellipse cx="7.8" cy="11" rx="2.2" ry="1.4" transform="rotate(-35 7.8 11)" fill="#fff" opacity=".35"/><rect x="11" y="4.6" width="4.4" height="3.4" rx="1" transform="rotate(30 13.2 6.3)" fill="#3a3d4a"/><path d="M14.6 5.2c1.2-2.4 3.2-3.2 5.2-2.4" fill="none" stroke="#c9a46a" stroke-width="1.4" stroke-linecap="round"/><circle cx="20" cy="2.8" r="1.6" fill="#ffc24d"/>`),
  check: sv("check", `<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`),
  crown: sv("crown", `<path d="M3 8.2l4.6 4L12 4.8l4.4 7.4L21 8.2l-1.9 10.6H4.9z" fill="currentColor"/><path d="M5 21h14" ${STK}/>`),
  more: sv("more", `<circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/>`),
  mouth: sv("mouth", `<path d="M4 9.5c2.4-2 5-3 8-3s5.6 1 8 3c-1.3 5-4.4 8-8 8s-6.7-3-8-8z" ${STK}/><path d="M5.5 10.5c4.3 1.6 8.7 1.6 13 0" ${STK}/>`),
  tap: sv("tap", `<path d="M9 11V5.5a1.6 1.6 0 0 1 3.2 0V10l4.6.8a2.4 2.4 0 0 1 2 2.7l-.7 4.6A3.4 3.4 0 0 1 14.7 21h-3.4a3.4 3.4 0 0 1-2.8-1.5L5.3 15a1.6 1.6 0 0 1 2.4-2.1z" ${STK}/><path d="M6.6 6.2a4.8 4.8 0 0 1 8 0" ${STK}/>`),
  seat: sv("seat", `<circle cx="12" cy="12" r="5" ${STK}/><circle cx="12" cy="3.4" r="1.8" fill="currentColor"/><circle cx="20.6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="20.6" r="1.8" fill="currentColor"/><circle cx="3.4" cy="12" r="1.8" fill="currentColor"/>`),
  dice: sv("dice", `<rect x="3.5" y="3.5" width="17" height="17" rx="4" ${STK}/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>`),
  boom: sv("boom", `<path d="M12 1.8l2.2 5.4 5.2-2.6-1.9 5.6 5.4 1.8-5.4 2 2.4 5.3-5.5-2.2L12 22.2l-2.3-5.1-5.5 2.2 2.4-5.3-5.4-2 5.4-1.8-1.9-5.6 5.2 2.6z" fill="currentColor"/>`),
  pause: sv("pause", `<path d="M3.5 5.2v13.6c0 .8.9 1.3 1.6.9l9.6-6.8c.6-.4.6-1.3 0-1.7L5.1 4.3c-.7-.5-1.6 0-1.6.9z" fill="currentColor"/><rect x="16.2" y="5" width="2.2" height="14" rx="1.1" fill="currentColor"/><rect x="19.9" y="5" width="2.2" height="14" rx="1.1" fill="currentColor"/>`),
  play: sv("play", `<path d="M6 4.6v14.8c0 .9 1 1.4 1.7.9l11-7.4c.6-.4.6-1.4 0-1.8l-11-7.4C7 3.2 6 3.7 6 4.6z" fill="currentColor"/>`),
  flag: sv("flag", `<path d="M5.5 21.5V3" ${STK}/><path d="M5.5 4.2c3-1.6 5.2 1.4 8.2-.1s4.6-.8 4.6-.8v8.3s-1.6-.7-4.6.8-5.2-1.5-8.2.1z" fill="currentColor"/>`)
};

/* ---------- sillabe: facili all'inizio, poi sempre più toste ---------- */
/* per ogni livello: dove va la sillaba (i = inizio, f = fine, m = in mezzo) */
const SYL = [
  { i:"CA PA MA LA TA CO PO MO RI SE DI VE BA FA GA PE TE FI MI PI BO TO SA LI NO RE SO VI GI CI FO LU MU CU BU",
    f:"TO TA NE RE LA NO CO CA RO RA NA LE LO TE SA SO ME MA DO DA NI RI TI LI VA VO PO PA GO CE CI BO ZA ZO IA IO",
    m:"AR ER AN EN IN ON OR AL EL AT IS ES OS AS ST NT RT LL TT SS RA RO TA NA LA CO TO RE NE MA" },
  { i:"STA PRE CON TRA PER PRO CAR MAR SPO SCA ACC ALL ATT PAN SOL FER VER GIO CIA POR COL MON BAR CAN FOR PAS TER VEN MAN SAL CAM PIA FIO LUN SCO DIS IMP INT CEN GRA",
    f:"ATO INO ORE ONE URA OSA ETTA TTO LLO OLA ARE ERE IRE ANO ATA ITO ENTE ELLA ESSA ISTA AIO ICO OSO ANZA ORIA ANTE ALE ILE ETO UTO INA ONA OTTO IERE OLO",
    m:"ART ENT OST ANT ORT ELL ATT ACC ESS IST OLL ERR ARR ASS OTT ALL ERT ARI ORI ERO INT ONT AND END OND RTA NTE STE STO LLA TTA CCI GLI CHE SCI" },
  { i:"STR SCH SPR SGU SBA GNO PSI SFI ZUC GHI CHI QUA SCI GLI TRU BRU FRA GRI SPL SCR SFO CRO",
    f:"GLIA GNO ZZA CCHIO GHI SCO STRO NDO ZZO CCIA GGIO MBA LLE RCO RGO PPO NZA TRO CHI CHE GLIO ZIO",
    m:"STR NTR MPR GHI CCH ZZ GN GL MBR NDR SCH RCH NGH QU CQU PP FF BB GG ZZI SPL RTI MPL" }
].map(o => ({i:o.i.split(" "), f:o.f.split(" "), m:o.m.split(" ")}));
const POS = {
  i:{t:"All'inizio della parola", pre:"", post:"_ _ _"},
  f:{t:"Alla fine della parola", pre:"_ _ _", post:""},
  m:{t:"In mezzo alla parola", pre:"_ _", post:"_ _"}
};

const COLORS = ["#ffb86b","#ffe07a","#ff9d7a","#ffd28a","#9be7ff","#b6f28a","#ffadc6","#d9b3ff","#ffc4a0","#8ee3c8","#ff8a8a","#f5e6a8"];
const MEAN = [
  "{n}: più bombe di un artificiere distratto.",
  "{n}, la prossima volta gioca da casa. È più sicuro per tutti.",
  "{n} non è sfortunato: è proprio un detonatore.",
  "Gli amici vogliono bene a {n}, ma da almeno tre metri.",
  "Il vocabolario ha mollato {n} a metà parola.",
  "Con {n} al tavolo il timer era quasi inutile.",
  "{n} ha trasformato la cena in una zona rossa.",
  "Qualcuno avvisi l'assicurazione di casa: {n} era seduto lì.",
  "{n} conosce tante parole. Purtroppo dopo l'esplosione."
];

const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function rawName(){ try{ return localStorage.getItem("ad.name") || ""; }catch(e){ return ""; } }
function storeName(n){ try{ localStorage.setItem("ad.name", n); }catch(e){} }
function myPid(){
  const mk = () => "u" + Math.random().toString(36).slice(2, 10);
  try{
    const st = USE_LOCAL ? sessionStorage : localStorage; // in prova ogni scheda è un giocatore diverso
    let id = st.getItem("ad.pid"); if(!id){ id = mk(); st.setItem("ad.pid", id); } return id;
  }catch(e){ return mk(); }
}
const cleanName = n => String(n || "").replace(/\s+/g, " ").trim().slice(0, 16);
const initial = n => (cleanName(n)[0] || "?").toUpperCase();
const newCode = () => Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)]).join("");
const joinUrl = () => location.origin + location.pathname + "?room=" + NET.code + (USE_LOCAL ? "&local" : "");
function loadScript(src, globalName){
  if(window[globalName]) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); });
}

/* ---------- stato ---------- */
let G = null;                 // partita (lo stato vero sta sull'host)
const UI = { scr:"boot", err:"", joined:false, sheet:null, sel:null, passed:-1, holdAt:0, roundKey:"", roundAt:0 };
const NET = { role:null, code:null, me:myPid(), name:"", peer:null, conns:new Map(), conn:null, bc:null, status:"idle", seen:{}, lastHost:0, lostAt:0, retryT:null };
let lastKey = "", lastFx = -1, lastSyl = "", fuseT = null, boomT = null;

const P = id => G && G.players.find(p => p.id === id);
const amHost = () => NET.role !== "guest";
const online = p => p.id === G.host || p.on !== false;

/* =====================================================================
   LOGICA (solo sull'host)
   ===================================================================== */
function newPlayer(id, name, n){ return {id, name, bombs:0, on:true, color:COLORS[n % COLORS.length]}; }
function recolor(){ G.players.forEach((p, i) => p.color = COLORS[i % COLORS.length]); }
function pickSyl(){
  const lvl = Math.min(2, Math.floor((G.passes + G.i * 2.2) / 7));
  G.recent = G.recent || [];
  const pos = G.pos || "m";                       // la regola resta la stessa finché la bomba scoppia
  let list = SYL[lvl][pos].filter(s => !G.recent.includes(pos + s));
  if(!list.length) list = SYL[lvl][pos];
  const s = list[Math.floor(Math.random() * list.length)];
  G.recent.push(pos + s); G.recent = G.recent.slice(-40);
  return s;
}
function armFuse(ms){
  clearTimeout(fuseT);
  G.fuse = Date.now() + ms;                // resta sull'host: agli altri non arriva mai
  fuseT = setTimeout(explode, ms);
}
function nextOf(id){
  const ps = G.players.filter(online);
  if(G.order === "rand"){
    const others = ps.filter(p => p.id !== id);
    const pool = others.filter(p => p.id !== G.prev) .length ? others.filter(p => p.id !== G.prev) : others; // niente ping-pong
    return pool.length ? pool[Math.floor(Math.random() * pool.length)].id : id;
  }
  const all = G.players, i = all.findIndex(p => p.id === id);
  for(let k = 1; k <= all.length; k++){ const p = all[(i + k) % all.length]; if(online(p)) return p.id; }
  return id;
}
function startGame(){
  G.players.forEach(p => p.bombs = 0);
  Object.assign(G, {phase:"play", i:0, boom:null, fxq:[], resumed:false, recent:[]});
  const ps = G.players.filter(online);
  lightBomb(ps[Math.floor(Math.random() * ps.length)].id);
}
function lightBomb(starter){
  Object.assign(G, {phase:"play", holder:starter, prev:null, passes:0, turn:(G.turn || 0) + 1, key:Math.random().toString(36).slice(2, 8), resumed:false});
  { const ks = ["i","f","m"].filter(k => k !== G.pos); G.pos = ks[Math.floor(Math.random() * ks.length)]; } // regola nuova a ogni bomba
  G.syl = pickSyl(); G.last = null;
  G.fxq.push({k:"light"});
  armFuse(LIGHT_MS + FUSE_MIN + Math.random() * (FUSE_MAX - FUSE_MIN));
  commit();
}
function explode(){
  if(!G || G.phase !== "play") return;
  clearTimeout(fuseT);
  const p = P(G.holder); if(p) p.bombs++;
  G.boom = {id:G.holder, syl:G.syl, n:G.i};
  G.phase = "boom"; G.fxq.push({k:"boom", id:G.holder});
  commit();
  clearTimeout(boomT);
  boomT = setTimeout(() => { if(!G || G.phase !== "boom") return; G.phase = G.i + 1 >= G.total ? "end" : "recap"; commit(); }, BOOM_MS);
}
function commit(){
  if(G.fxq && G.fxq.length){ G.fxn = (G.fxn || 0) + 1; G.fx = {n:G.fxn, l:G.fxq}; G.fxq = []; }
  save(); publish(); render();
}
function save(){
  if(!amHost() || !G) return;
  if(G.phase === "end") ls.del(SAVE_KEY);
  else ls.set(SAVE_KEY, {G, code:NET.code, at:Date.now()});
}
function hostAct(pid, a, v){
  if(!G) return;
  const isHost = pid === NET.me;
  switch(a){
    case "pass":
      if(G.phase !== "play" || pid !== G.holder || +v !== G.turn) return;
      G.last = {id:pid, syl:G.syl, pos:G.pos};      // serve se il tavolo contesta la parola
      G.prev = pid; G.holder = nextOf(pid); G.turn++; G.passes++; G.syl = pickSyl();
      G.fxq.push({k:"pass", from:pid, to:G.holder});
      return commit();
    case "pause":                                    // la pausa la può chiedere chiunque
      if(G.phase !== "play" || !P(pid)) return;
      clearTimeout(fuseT);
      G.left = Math.max(0, (G.fuse || Date.now()) - Date.now());
      G.phase = "pause"; G.pausedBy = pid;
      return commit();
    case "resume":                                   // la ripartenza solo l'host, scegliendo a chi torna la bomba
      if(!isHost || G.phase !== "pause") return;
      { const to = P(v) && online(P(v)) ? v : G.holder;
        if(to !== G.holder){
          if(G.last && G.last.id === to){ G.syl = G.last.syl; G.pos = G.last.pos; } // stessa sillaba: deve trovare un'altra parola
          G.holder = to; G.prev = null;
        }
        G.phase = "play"; G.turn++; G.last = null;
        armFuse(Math.max(4000, G.left || 0));
        G.fxq.push({k:"resume", to});
        return commit(); }
    case "next":
      if(G.phase !== "recap" || !(isHost || (G.boom && pid === G.boom.id))) return;
      if(G.resumed) return lightBomb(P(G.holder) && online(P(G.holder)) ? G.holder : G.players.filter(online)[0].id);
      G.i++;
      return lightBomb(P(G.boom.id) && online(P(G.boom.id)) ? G.boom.id : nextOf(G.boom.id));
    case "end":
      if(!isHost || G.phase === "lobby") return;
      clearTimeout(fuseT); clearTimeout(boomT); G.phase = "end"; return commit();
  }
}
function uniqueName(name, selfId){
  let n = cleanName(name) || "Giocatore", k = 2;
  const taken = x => G.players.some(p => p.id !== selfId && p.name.toLowerCase() === x.toLowerCase());
  const base = n; while(taken(n)) n = base + " " + k++;
  return n;
}
function swapId(oldId, newId){
  const p = P(oldId); if(!p) return; p.id = newId;
  if(G.holder === oldId) G.holder = newId;
  if(G.prev === oldId) G.prev = newId;
  if(G.boom && G.boom.id === oldId) G.boom.id = newId;
}

/* ---------- bot di prova (solo per lo sviluppatore): giocatori finti sul telefono dell'host. Si spengono con BOTS_ON = false ---------- */
const BOTS_ON = true;
const BOT_NAMES = ["Bot Pino","Bot Gina","Bot Rocco","Bot Tea","Bot Nando","Bot Wanda","Bot Ugo","Bot Lia","Bot Ciro","Bot Nives","Bot Elio"];
const isBot = id => typeof id === "string" && id.startsWith("bot-");
const BOT = {};
const botRnd = (a, b) => a + Math.random() * (b - a);
function botAdd(){
  if(!BOTS_ON || !amHost() || !G || G.phase !== "lobby" || G.players.length >= MAX_P) return;
  const name = BOT_NAMES.find(n => !G.players.some(p => p.name === n)) || "Bot " + (G.players.length + 1);
  hostReceive("bot-" + Math.random().toString(36).slice(2, 8), {t:"hello", name});
}
function botRemoveAll(){ if(G && G.phase === "lobby"){ G.players = G.players.filter(p => !isBot(p.id)); recolor(); commit(); } }
function botTick(){
  if(!BOTS_ON || !amHost() || !G) return;
  const now = Date.now();
  G.players.forEach(p => {
    if(!isBot(p.id)) return;
    NET.seen[p.id] = now; // un bot non va mai offline
    const id = p.id;
    const plan = (key, a, b) => { let x = BOT[id]; if(!x || x.key !== key) x = BOT[id] = {key, at:now + botRnd(a, b), done:false}; return x; };
    if(G.phase === "play" && G.holder === id){ // il bot "dice" la sua parola e passa; ogni tanto ci mette troppo
      const x = plan("p" + G.turn, 1500, Math.random() < .15 ? 9000 : 5000);
      if(!x.done && now >= x.at){ x.done = true; hostAct(id, Math.random() < .03 ? "pause" : "pass", G.turn); }
    } else if(G.phase === "recap" && G.boom && G.boom.id === id){
      const x = plan("r" + G.i, 3000, 5000);
      if(!x.done && now >= x.at){ x.done = true; hostAct(id, "next"); }
    }
  });
}
setInterval(botTick, 400);

/* ---------- rete: host ---------- */
async function hostOpen(){
  if(USE_LOCAL){
    NET.bc = new BroadcastChannel("adb-" + NET.code);
    NET.bc.onmessage = e => { const d = e.data; if(d.to === "host") hostReceive(d.from, d.msg); };
    NET.sendTo = (id, msg) => NET.bc.postMessage({from:"host", to:id, msg});
    NET.bc.postMessage({from:"host", to:"*", msg:{t:"rehello"}});
    return;
  }
  await loadScript("lib/peerjs.min.js", "Peer");
  await new Promise((res, rej) => {
    const peer = new Peer(PEER_PREFIX + NET.code); NET.peer = peer; let opened = false;
    peer.on("open", () => { opened = true; res(); });
    peer.on("error", e => { if(!opened) rej(e); else console.warn(e); });
    peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
    peer.on("connection", conn => {
      conn.on("data", msg => { if(msg && msg.pid){ conn._pid = msg.pid; NET.conns.set(msg.pid, conn); } hostReceive(conn._pid, msg); });
      conn.on("close", () => { if(conn._pid && NET.conns.get(conn._pid) === conn){ NET.conns.delete(conn._pid); hostReceive(conn._pid, {t:"bye"}); } });
    });
  });
  NET.sendTo = (id, msg) => { const c = NET.conns.get(id); if(c && c.open) try{ c.send(msg); }catch(e){} };
}
function forGuest(){ const g = JSON.parse(JSON.stringify(G)); delete g.fuse; delete g.fxq; delete g.recent; return g; }
function publish(){
  if(!amHost() || !G || !NET.sendTo) return;
  const g = forGuest();
  G.players.forEach(p => { if(p.id !== NET.me) NET.sendTo(p.id, {t:"state", G:g}); });
}
function hostReceive(pid, msg){
  if(!G || !pid || !msg) return;
  NET.seen[pid] = Date.now();
  const p = P(pid);
  if(msg.t === "hb"){ if(p && p.on === false){ p.on = true; commit(); } return; }
  switch(msg.t){
    case "hello": {
      const name = cleanName(msg.name);
      if(!p){
        const ghost = G.players.find(x => x.on === false && x.id !== NET.me && x.name.toLowerCase() === name.toLowerCase());
        if(ghost){ swapId(ghost.id, pid); ghost.on = true; }
        else {
          if(G.players.length >= MAX_P){ NET.sendTo(pid, {t:"full"}); return; }
          const nn = uniqueName(name, pid);
          G.players.push(newPlayer(pid, nn, G.players.length));
          G.fxq = G.fxq || []; G.fxq.push({k:"toast", txt:`${nn} si è seduto`});
        }
      } else { p.on = true; if(name && G.phase === "lobby") p.name = uniqueName(name, pid); }
      commit(); break;
    }
    case "act": hostAct(pid, msg.a, msg.v); break;
    case "bye":
      if(!p) return;
      if(G.phase === "lobby"){ G.players = G.players.filter(x => x.id !== pid); recolor(); } else p.on = false;
      commit(); break;
    default: if(p && p.on === false){ p.on = true; commit(); }
  }
}

/* ---------- rete: ospite ---------- */
async function guestOpen(){
  NET.toHost = msg => {
    msg = {...msg, pid:NET.me};
    if(USE_LOCAL){ NET.bc && NET.bc.postMessage({from:NET.me, to:"host", msg}); return; }
    if(NET.conn && NET.conn.open){ try{ NET.conn.send(msg); }catch(e){} }
  };
  NET.status = "connecting"; render();
  if(USE_LOCAL){
    NET.bc = new BroadcastChannel("adb-" + NET.code);
    NET.bc.onmessage = e => { const d = e.data; if(d.to === NET.me || d.to === "*") guestReceive(d.msg); };
    NET.status = "open"; NET.lastHost = Date.now(); NET.toHost({t:"hello", name:NET.name}); render(); return;
  }
  try{ await loadScript("lib/peerjs.min.js", "Peer"); }catch(e){ NET.status = "lost"; render(); return; }
  guestConnect();
}
function guestConnect(){
  clearTimeout(NET.retryT);
  if(!NET.peer || NET.peer.destroyed){
    const peer = new Peer(); NET.peer = peer;
    peer.on("error", e => { if(NET.peer !== peer) return; guestLost(e.type === "peer-unavailable"); });
    peer.on("disconnected", () => { try{ !peer.destroyed && peer.reconnect(); }catch(e){} });
  }
  const peer = NET.peer;
  const dial = () => {
    try{ NET.conn && NET.conn.close(); }catch(e){}
    const conn = peer.connect(PEER_PREFIX + NET.code, {reliable:true}); NET.conn = conn;
    conn.on("open", () => { if(NET.conn !== conn) return; NET.status = "open"; NET.lostAt = 0; NET.lastHost = Date.now(); NET.toHost({t:"hello", name:NET.name}); render(); });
    conn.on("data", m => { NET.lastHost = Date.now(); guestReceive(m); });
    conn.on("close", () => { if(NET.conn === conn) guestLost(false); });
  };
  if(peer.open) dial(); else peer.once("open", dial);
}
function guestLost(noroom){
  if(["closed","full"].includes(NET.status)) return;
  if(noroom && !G){ NET.status = "noroom"; render(); return; }
  if(!NET.lostAt) NET.lostAt = Date.now();
  if(Date.now() - NET.lostAt > 5 * 60e3){ NET.status = "lost"; render(); return; }
  if(NET.status !== "reconnecting"){ NET.status = "reconnecting"; render(); }
  clearTimeout(NET.retryT); NET.retryT = setTimeout(guestConnect, 3000);
}
function guestReceive(m){
  if(!m) return;
  if(m.t === "state"){ const first = !G; G = m.G; if(first && G.fx) lastFx = G.fx.n; NET.status = "open"; render(); }
  else if(m.t === "full"){ NET.status = "full"; render(); }
  else if(m.t === "closed"){ NET.status = "closed"; G = null; render(); }
  else if(m.t === "rehello"){ NET.toHost({t:"hello", name:NET.name}); }
}
/* battito: ogni 3 s, dopo 10 s di silenzio si è offline */
setInterval(() => {
  const now = Date.now();
  if(NET.role === "host" && G && NET.sendTo){
    let changed = false;
    G.players.forEach(p => { if(p.id !== NET.me && p.on !== false && NET.seen[p.id] && now - NET.seen[p.id] > 10000){ p.on = false; changed = true; } });
    G.players.forEach(p => { if(p.id !== NET.me) NET.sendTo(p.id, {t:"hb"}); });
    if(changed){
      // se la bomba è in mano a chi è sparito, passa da sola al prossimo
      if(G.phase === "play" && P(G.holder) && P(G.holder).on === false){ G.prev = G.holder; G.holder = nextOf(G.holder); G.turn++; G.syl = pickSyl(); }
      commit();
    }
  } else if(NET.role === "guest" && UI.joined && NET.toHost){
    if(NET.status === "open") NET.toHost({t:"hb"});
    if(!USE_LOCAL && NET.status === "open" && NET.lastHost && now - NET.lastHost > 10000){ const c = NET.conn; NET.conn = null; try{ c && c.close(); }catch(e){} guestLost(false); }
  }
}, 3000);

function send(a, v){ if(amHost()) hostAct(NET.me, a, v); else if(NET.toHost) NET.toHost({t:"act", a, v}); }
function closeRoom(){
  clearTimeout(fuseT); clearTimeout(boomT);
  if(amHost() && G && NET.sendTo) G.players.forEach(p => p.id !== NET.me && NET.sendTo(p.id, {t:"closed"}));
  try{ NET.peer && NET.peer.destroy(); }catch(e){}
  try{ NET.bc && NET.bc.close(); }catch(e){}
}
async function openRoom(resume){
  UI.err = ""; UI.scr = "opening"; render();
  for(let tries = 0; tries < 3; tries++){
    try{ if(!resume) NET.code = newCode(); await hostOpen(); UI.scr = null; return true; }
    catch(e){ console.warn(e); try{ NET.peer && NET.peer.destroy(); }catch(_){} if(resume) break; }
  }
  UI.err = "Non riesco ad aprire la stanza. Controlla la connessione e riprova."; UI.scr = "fail"; render(); return false;
}

function seatXY(i, n){ const a = Math.PI / 2 + i * 2 * Math.PI / n; return [Math.cos(a), Math.sin(a)]; }

function bombsHTML(n, fresh){

function standings(){ return [...G.players].sort((a, b) => a.bombs - b.bombs || a.name.localeCompare(b.name)); }
function rankHTML(final){

  join: () => `<div class="screen center">

  connecting: () => `<div class="screen center"><div class="grow"></div><div class="emblem in">${bombSVG()}</div>

  recap: () => { const canGo = amHost() || (G.boom && G.boom.id === NET.me);

      <h1 class="big" style="margin-top:6px">${G.resumed ? "Si riparte" : who ? (who.id === NET.me ? "Sei saltato in aria" : `Boom, ${esc(who.name)}`) : "Boom"}</h1></div>

      <h1 class="big" style="margin-top:6px">${hi > lo ? `${best.length > 1 ? "Vincono" : "Vince"} ${andList(best)}` : "Pareggio"}</h1></div>

};

function myRank(){ const me = P(NET.me); return me ? 1 + G.players.filter(p => p.bombs < me.bombs).length : 0; }
/* banda in alto durante il gioco: AfterDinner, mini recap personale, pausa */

const gap = n => `<span class="gap">${"<i></i>".repeat(n)}</span>`;

}
function playView(){

    <div class="stagec">${sylHTML()}</div>
    <p class="foot ${amNext ? "ready" : ""}">${TURN_BANNER ? "" : amNext ? "Preparati: tocca a te!" : `${I.bomb} ${holder ? esc(holder.name) : ""}`}</p>

function pauseView(){

    <div class="in" style="text-align:center;margin-top:8px"><span class="pbig">${I.pause}</span>
      <h1 class="big" style="margin-top:10px">Pausa</h1><p class="lead">${by ? `L'ha chiesta ${by.id === NET.me ? "tu" : esc(by.name)}` : ""}. Il timer è fermo.</p></div>
    ${amHost() ? `<div class="in" style="--d:1;margin-top:18px"><p class="lbl" style="text-align:center">A chi torna la bomba?</p>
      <div class="wheelbox"><div class="wheel" id="wheel">${G.players.map(p => `<div class="wi ${online(p) ? "" : "off"}" data-w="${p.id}">${av(p)}<span>${p.id === NET.me ? "Tu" : esc(p.name)}</span>${p.id === G.holder ? `<em>ha la bomba</em>` : G.last && p.id === G.last.id ? `<em>ha appena passato</em>` : ""}</div>`).join("")}</div></div>
      <p class="hint" style="margin-top:8px">Se la parola non valeva, torna a chi l'ha detta: stessa sillaba, deve trovarne un'altra.</p></div>

    : `<div class="grow"></div><p class="hint">${nm(G.host)} sceglie a chi torna la bomba e fa ripartire il gioco<span class="dots"></span></p><div class="grow"></div>`}

/* ruota: si gira con il dito, vale quello al centro */
const WH = 52;
function wheelInit(){
  const w = $("#wheel"); if(!w) return;
  const i = Math.max(0, G.players.findIndex(p => p.id === UI.wheel));
  w.scrollTop = i * WH; wheelMark();
  w.onscroll = () => { const k = Math.round(w.scrollTop / WH); const p = G.players[Math.max(0, Math.min(G.players.length - 1, k))]; if(p && p.id !== UI.wheel){ UI.wheel = p.id; } wheelMark(); };
}
function wheelMark(){ const w = $("#wheel"); if(!w) return; w.querySelectorAll(".wi").forEach(el => el.classList.toggle("on", el.dataset.w === UI.wheel)); }

/* ---------- disegno ---------- */
function setMode(){
  const scr = screenName();
  let m = "calm";
  if(G && scr === "play" && G.holder === NET.me && UI.passed !== G.turn) m = "hot";
  else if(G && (scr === "boom" || scr === "recap") && G.boom && G.boom.id === NET.me && !G.resumed) m = "dead";
  document.body.dataset.mode = m;
  document.querySelector('meta[name="theme-color"]').content = m === "hot" ? "#c2410c" : m === "dead" ? "#7a0e04" : "#140904";
}
function render(){
  const scr = screenName();
  if(G && G.key && UI.roundKey !== G.key){ UI.roundKey = G.key; UI.roundAt = Date.now(); }
  if(G && G.holder === NET.me && UI.holdTurn !== G.turn){ UI.holdTurn = G.turn; UI.holdAt = Date.now(); }
  const key = scr + "|" + (G ? G.phase + (G.phase === "lobby" ? "" : G.i) : "");
  const fresh = key !== lastKey; lastKey = key;
  const sylNew = G && G.syl && G.syl + G.turn !== lastSyl; if(G) lastSyl = (G.syl || "") + G.turn;
  const keep = {};
  app.querySelectorAll("input[id]").forEach(el => keep[el.id] = {v:el.value, f:document.activeElement === el});
  const sc = $("#scroller"), scTop = sc ? sc.scrollTop : 0;
  app.dataset.fresh = fresh ? "1" : "0";
  app.dataset.sylnew = sylNew && scr === "play" ? "1" : "0";
  app.innerHTML = VIEWS[scr]();
  for(const id in keep){ const el = document.getElementById(id); if(el && !fresh){ el.value = keep[id].v; if(keep[id].f) el.focus(); } }
  setMode(); heat();
  if(scr === "lobby") drawQR();
  if(scr === "pause") wheelInit(); else UI.wheel = null;
  if(scr === "recap" || scr === "end"){ if(fresh) autoScroll(); else { const s = $("#scroller"); if(s){ s.classList.add("free"); s.scrollTop = scTop; } } }
  if(G && G.fx && G.fx.n > lastFx){ lastFx = G.fx.n; playFx(G.fx.l); }
  if(UI.sheet) showSheet(UI.sheet);
}
function drawQR(){
  loadScript("lib/qrcode.js", "qrcode").then(() => { const q = qrcode(0, "M"); q.addData(joinUrl()); q.make(); const b = $("#qrbox"); if(b) b.innerHTML = q.createSvgTag(6, 2); }).catch(() => {});
}
/* la bomba trema sempre di più: dipende dal tempo passato, non da quello che manca */
function heat(){
  const t = G && G.phase === "play" ? Date.now() - UI.roundAt : 0;
  document.body.dataset.heat = t < 12000 ? 0 : t < 24000 ? 1 : t < 36000 ? 2 : 3;
}
setInterval(heat, 1000);
/* recap a tendina: se la lista non sta nello schermo, scorre da sola dal primo all'ultimo */
let scrollRaf = 0;
function autoScroll(){
  cancelAnimationFrame(scrollRaf);
  const s = $("#scroller"); if(!s) return;
  const go = () => {
    const el = $("#scroller"); if(!el) return;
    const max = el.scrollHeight - el.clientHeight;
    if(max <= 4 || REDUCED){ el.classList.add("free"); return; }
    const dur = Math.max(2500, max * 22), t0 = performance.now();
    const step = now => {
      const e = $("#scroller"); if(!e) return;
      const k = Math.min(1, (now - t0) / dur), ease = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      e.scrollTop = max * ease;
      if(k < 1) scrollRaf = requestAnimationFrame(step); else e.classList.add("free");
    };
    scrollRaf = requestAnimationFrame(step);
  };
  setTimeout(go, 600 + G.players.length * 110);
}

/* ---------- effetti (niente audio né vibrazione: tutto a vista) ---------- */
function fxEl(cls, html, style, life){
  const d = document.createElement("div"); d.className = cls; d.innerHTML = html;
  if(style) for(const k in style) d.style.setProperty(k, style[k]);
  $("#fx").appendChild(d);
  setTimeout(() => d.remove(), life || 1800); return d;
}
function toast(html){ fxEl("toast", html, null, 2300); }
function okFlash(){ fxEl("okflash", I.check, null, 800); }
function playFx(list){
  (list || []).forEach(f => {
    if(f.k === "toast") toast(esc(f.txt));
    else if(f.k === "light") fxEl("lightup", `${bombSVG()}<b>Miccia accesa!</b><span class="hint">${G.holder === NET.me ? "Parti tu" : `Parte ${nm(G.holder)}`}</span>`, null, 1650);
    else if(f.k === "pass"){
      if(f.from === NET.me && UI.passed !== G.turn - 1) okFlash();   // l'host vede il suo lampo anche se è passato da qui
      if(f.to === NET.me) fxEl("passfly", bombSVG(), {"--tx":"0px", "--ty":"0px"}, 700);
    }
    else if(f.k === "boom") explosion(f.id === NET.me, nm(f.id));
  });
}
function explosion(mine, name){
  const rnd = (a, b) => a + Math.random() * (b - a);
  let h = `<div class="core"><div class="bm">${bombSVG()}</div><div class="flash"></div>`;
  for(let i = 0; i < 3; i++) h += `<div class="ring" style="--t:${.72 + i * .14}s"></div>`;
  h += `<div class="ball"></div>`;
  for(let i = 0; i < 26; i++){ const a = rnd(0, Math.PI * 2), d = rnd(40, 200); h += `<div class="fire" style="--s:${rnd(50, 120).toFixed(0)}px;--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d).toFixed(0)}px;--dur:${rnd(.7, 1.3).toFixed(2)}s"></div>`; }
  for(let i = 0; i < 28; i++){ const a = rnd(0, Math.PI * 2), d = rnd(160, 420); h += `<div class="ember" style="--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d).toFixed(0)}px"></div>`; }
  for(let i = 0; i < 14; i++){ const a = rnd(0, Math.PI * 2), d = rnd(140, 340); h += `<div class="deb" style="--s:${rnd(8, 18).toFixed(0)}px;--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d - 120).toFixed(0)}px;--r:${rnd(-720, 720).toFixed(0)}deg"></div>`; }
  for(let i = 0; i < 10; i++) h += `<div class="smoke" style="--s:${rnd(90, 170).toFixed(0)}px;--x:${rnd(-140, 140).toFixed(0)}px;--y:${rnd(-260, -80).toFixed(0)}px;--t:${rnd(.9, 1.4).toFixed(2)}s"></div>`;
  h += `</div><div class="word">BOOM</div><div class="who">${mine ? "Ti è esplosa in mano!" : `Esplosa in mano a ${name}`}</div>`;
  fxEl("boom", h, null, 3700);
  app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
  setTimeout(() => app.classList.remove("shake"), 1500);
}
function showSheet(kind){
  document.querySelector(".sheetbg")?.remove();
  const bg = document.createElement("div"); bg.className = "sheetbg";
  let h = "";
  if(kind === "rules") h = `<h2>Bomba: le regole</h2>
    <ul>
      <li>Ognuno gioca col suo telefono: il telefono non passa mai di mano, passa solo la bomba.</li>
      <li>Tutti vedono la stessa <b>sillaba</b> e dove va messa nella parola (la regola resta uguale finché la bomba scoppia). Chi ha la bomba dice ad alta voce una parola che la contiene e <b>tocca lo schermo</b>: la bomba passa al prossimo con una sillaba nuova.</li>
      <li>Decide il tavolo: se qualcuno grida <b>«non vale!»</b>, bisogna trovare un'altra parola prima di passare.</li>
      <li>Il timer è <b>nascosto</b>: ogni bomba esplode quando vuole, tra 15 e 50 secondi. La bomba trema sempre di più, ma non dice quanto manca.</li>
      <li>A chi esplode in mano prende <b>una bomba</b> in classifica e riaccende la prossima.</li>
      <li>Nessuno viene eliminato. Dopo l'ultima bomba <b>chi ha più bombe perde</b>, chi ne ha meno vince.</li>
      <li>${G && G.order === "rand" ? "Questa partita: la bomba passa a qualcuno a caso." : "Questa partita: la bomba passa al vicino, girando a sinistra intorno al tavolo."}</li>
    </ul><button class="btn" data-close>Ho capito</button>`;
  else if(kind === "menu") h = `<h2>Menu dell'host</h2>
    <button class="btn danger" data-a="end" data-close>Termina la partita</button><button class="btn" data-close>Chiudi</button>`;
  else if(kind === "exit") h = `<h2>Uscire dalla partita?</h2><p>La stanza si chiude per tutti.</p>
    <div class="row"><button class="btn ghost" data-close>Resto</button><button class="btn" data-a="exit" data-close>Esci</button></div>`;
  bg.innerHTML = `<div class="sheet">${h}</div>`;
  bg.addEventListener("click", e => { if(e.target === bg || e.target.closest("[data-close]")){ UI.sheet = null; bg.remove(); } });
  document.body.appendChild(bg);

}

/* ---------- tocchi ---------- */
function doPass(){
  if(!G || G.phase !== "play" || G.holder !== NET.me || UI.passed === G.turn) return;
  if(Date.now() - UI.holdAt < 500) return;                 // niente passaggi per sbaglio
  UI.passed = G.turn; okFlash();
  if(amHost()) send("pass", G.turn); else { send("pass", G.turn); render(); }
}
document.addEventListener("pointerdown", e => { if(e.target.closest('[data-a="pass"]')){ e.preventDefault(); doPass(); } }, {passive:false});
document.addEventListener("click", async e => {
  const wi = e.target.closest("[data-w]");
  if(wi){ const w = $("#wheel"), i = G.players.findIndex(p => p.id === wi.dataset.w); if(w && i >= 0) w.scrollTo({top:i * WH, behavior:REDUCED ? "auto" : "smooth"}); return; }
  const seat = e.target.closest("[data-seat]");
  if(seat && amHost() && G && G.phase === "lobby"){
    const id = seat.dataset.seat;
    if(!UI.sel || UI.sel === id) UI.sel = UI.sel === id ? null : id;
    else { const a = G.players.findIndex(p => p.id === UI.sel), b = G.players.findIndex(p => p.id === id);
      [G.players[a], G.players[b]] = [G.players[b], G.players[a]]; UI.swapped = [UI.sel, id]; UI.sel = null; save(); publish();
      setTimeout(() => { UI.swapped = null; }, 900); }
    render(); return;
  }
  const st = e.target.closest("[data-set]");
  if(st && amHost() && G && G.phase === "lobby"){ const k = st.dataset.set; G[k] = k === "total" ? +st.dataset.v : st.dataset.v; commit(); return; }
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a;
  switch(a){
    case "pass": break; // gestito al tocco
    case "go-on": send("resume", UI.wheel); break;
    case "exit": closeRoom(); ls.del(SAVE_KEY); location.href = "./"; break;
    case "exit-ask": UI.sheet = "exit"; render(); break;
    case "rules": UI.sheet = "rules"; render(); break;
    case "menu": UI.sheet = "menu"; render(); break;
    case "newgame": ls.del(SAVE_KEY); newRoom(); break;
    case "bot-add": botAdd(); break;
    case "bot-del": botRemoveAll(); break;
    case "lobby-go": if(G.players.filter(online).length >= MIN_P){ UI.sel = null; startGame(); } break;
    case "copy": try{ await navigator.clipboard.writeText(joinUrl()); toast("Link copiato"); }catch(_){ toast(esc(joinUrl())); } break;
    case "share": if(navigator.share) navigator.share({title:"Bomba", text:"Vieni a giocare a Bomba", url:joinUrl()}).catch(() => {}); else { try{ await navigator.clipboard.writeText(joinUrl()); toast("Link copiato"); }catch(_){} } break;
    case "reload": {
      const s = ls.get(SAVE_KEY, null); if(!s){ newRoom(); break; }
      G = s.G; G.fxq = []; lastFx = G.fx ? G.fx.n : -1; NET.code = s.code;
      G.players.forEach(p => { if(p.id !== NET.me) p.on = false; });
      if(G.phase === "play" || G.phase === "boom" || G.phase === "pause"){ G.phase = "recap"; G.resumed = true; } // il timer non si salva: si riaccende la bomba in corso
      if(!(await openRoom(true))){ G = null; break; }
      UI.scr = null; commit(); break;
    }
    case "join": {
      const n = cleanName($("#jname")?.value);
      if(!n){ $("#jname")?.focus(); toast("Scrivi il tuo nome"); break; }
      storeName(n); NET.name = n; UI.joined = true; guestOpen(); break;
    }
    case "retry": NET.status = "connecting"; NET.lostAt = 0; render(); if(USE_LOCAL) guestOpen(); else guestConnect(); break;
    case "again": {
      G.players = G.players.filter(p => p.on !== false || p.id === NET.me); recolor();
      if(G.players.length < MIN_P){ toast(`Servono almeno ${MIN_P} giocatori`); break; }
      startGame(); break;
    }
    default: send(a, b.dataset.v); // next, end
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "hname" && G && amHost()){ const p = P(NET.me); const v = cleanName(e.target.value); if(v){ p.name = uniqueName(v, NET.me); storeName(v); save(); publish(); } }
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "jname") $('[data-a="join"]')?.click(); });
/* l'host che torna sull'app: se il timer è scaduto mentre era in background, esplode subito */
document.addEventListener("visibilitychange", () => { if(!document.hidden && amHost() && G && G.phase === "play" && G.fuse && Date.now() >= G.fuse) explode(); });

/* ---------- scintille ---------- */
(function(){ const bg = $("#bg"); if(REDUCED) return; for(let i = 0; i < 12; i++){ const e = document.createElement("span"); e.className = "spark";
  Object.assign(e.style, {left:Math.random() * 100 + "%", animationDelay:(-Math.random() * 9) + "s", animationDuration:(7 + Math.random() * 6) + "s"}); e.style.setProperty("--dx", (Math.random() * 80 - 40) + "px"); bg.appendChild(e); } })();

/* ---------- avvio ---------- */
async function newRoom(){
  G = {phase:"lobby", host:NET.me, order:"seat", total:8, players:[newPlayer(NET.me, cleanName(rawName()) || "Host", 0)], fxq:[], i:0, turn:0};
  if(await openRoom(false)) commit(); else G = null;
}
(function boot(){
  if(ROOM){ NET.role = "guest"; NET.code = ROOM; UI.scr = null; render(); return; }
  if(LOCK_ON){ let ok = false; try{ ok = localStorage.getItem("ad.host") === PIN_HASH; }catch(e){} if(!ok){ location.replace("./"); return; } }
  NET.role = "host";
  const s = ls.get(SAVE_KEY, null);
  if(s && s.G && Date.now() - s.at < SAVE_TTL){ UI.scr = "resume"; render(); }
  else newRoom();
})();
window.addEventListener("pagehide", () => { if(NET.role === "guest" && NET.toHost) NET.toHost({t:"bye"}); });
</script>
